    time: "2026-08-31 23:35"
    text: |-
      今天忙完了，每天都要復盤，今天如果按照兩分K策略進場，不是找不太到地方進場就是虧損。要認知到今天的盤面就是洗，洗的盤勢如果你一定要出手，你就得要去看看有什麼方法賺震盪盤的錢。
      如果1分K呢?我相信相較2分K應該有比較多點位可以介入。或是你就是用2分K打但是獲利跟停損抓小一點呢?可能就得抓1:1，賺個40點賠個40點試試。以上方法都只是拋磚引玉，讓你去想想看有什麼方式，然後可以的話每天復盤，今天盤勢這麼洗截圖起來，看一下適用什麼K，訓練到肌肉記憶之後你就會有人家所謂的"盤感"，還是得付出時間才會有回報，我可能不到一年但我每天複習的時間大概除了上班時間不行外我午休也在復習以及回家自己的時間，平日至少4小時假日至少10小時，我之前做的筆記Word文件超過3000頁，雖然我知道大家的狀況不太一樣，但就問問自己今天如果有一小時的空檔你會想要先看Youtube還是復盤~
quiz:
  - q: 盤勢很洗、2分K策略找不到地方進場時，Shawnnnn 提出的思考方向是？
    o:
      - 改看日線，等大趨勢明確出來之後再進場做
      - "改用1分K找點，或2分K停利停損抓小約1:1"
      - 放大停損到100點以上，撐過這段洗盤再說
      - 改用市價單追突破，避免錯過後面真正行情
    a: 1
    e: Shawnnnn 說可以試1分K，或用2分K但獲利跟停損抓小，大概1:1、賺40點賠40點。
  - q: 依 Shawnnnn 的說法，「盤感」要怎麼來？
    o:
      - 多看別人報單跟著做，看久了自然就會有盤感
      - 每天復盤截圖，分析適用什麼K練到肌肉記憶
      - 找到勝率夠高的指標，照著訊號做就會有盤感
      - 多參加直播看別人即時操作，模仿他的手感
    a: 1
    e: Shawnnnn 說每天復盤、把洗盤截圖起來看適用什麼K，訓練到肌肉記憶後就會有盤感，還是得付出時間。
