quiz:
  - q: Shawnnnn 分享他以前怎麼做交易筆記？
    o:
      - 每天記錄損益數字，月底再統計勝率和賺賠比
      - 把喊單老師的點位抄下來，事後對照準不準
      - 只記錄虧損的單，逐筆找出犯錯的原因
      - 截圖寫下進場依據和防守點位，趨勢盤震盪盤都記
    a: 3
    e: Shawnnnn 會把圖截下來，解釋當時的進場依據跟防守點位，三不五時複習；趨勢盤和震盪盤狀況差很多，都要記錄，精實記錄 3-5 個月會進步不少。
  - q: 在壓力帶下緣回到 EMA 附近嘗試進場的筆記中，Shawnnnn 說重點是哪幾個字？
    o:
      - 「量能放大」
      - 「沒有被灌破」
      - 「突破前高」
      - 「連續紅 K」
    a: 1
    e: Shawnnnn 說這張筆記的重點在「沒有被灌破」這幾個字，沒被強勢灌破、回踩有撐才進場，停損抓起漲紅 K。
