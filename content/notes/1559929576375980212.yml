quiz:
  - q: 白線下穿橘線、多週期全偏空時，nick_AJ 這筆 3 分 K 空單是怎麼進場的？
    o:
      - 白線一下穿橘線，就立刻市價進空
      - 等價格跌破前低確認後，再追空
      - 等 1 分 K 也出空訊號，再分批進空
      - 等價格回踩到上方壓力框，才進空
    a: 3
    e: nick_AJ 說「剛剛這單我是回踩上才空的」，是等價格回踩到壓力框才進場，不是一交叉就追。
  - q: 趨勢表 1 分到 4 小時全部偏空時，nick_AJ 對做多的提醒是什麼？
    o:
      - 目前都偏空，要做多也只能做短多
      - 偏空時完全不能做多，只能等翻轉
      - 可以做多，但要改看 4 小時的支撐
      - 跌深可以左側分批買多，停損放寬
    a: 0
    e: nick_AJ 提醒目前都偏空，要做多的話只能做短多、要特別注意，並沒有說完全不能做或可以左側攤平。
