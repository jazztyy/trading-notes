    text: 就各有優缺點，掛藍線的成本一定比較好，但可能次數不多；掛白線交易次數一定比較多，但伴隨著停損的次數也許也比較多或是獲利也比較多次
quiz:
  - q: 掛單常常掛不到白線時，Shawnnnn 建議怎麼調整？
    o:
      - 改用市價單，看到訊號出來就直接進場不掛單
      - 改掛到藍線外再多 5 點，確保一定成交
      - 等價格穿過白線確認方向後，再追價進場
      - 離白線高或低 5 點掛，或掛兩條線中間價
    a: 3
    e: Shawnnnn 說他也會遇到，所以請對方離白線高或低 5 點去掛，有時他也會掛兩條線中間的價格。
  - q: 依 Shawnnnn 的說法，掛藍線和掛白線各有什麼差別？
    o:
      - 藍線成本較好但次數少；白線次數多，停損獲利也較多
      - 白線成本較好但次數少；藍線次數多，停損也比較多
      - 兩者成本其實一樣；差別只在掛藍線比較不會被停損
      - 藍線次數多、成本又好；所以一律掛藍線就不會錯
    a: 0
    e: Shawnnnn 說各有優缺點：藍線成本一定比較好但次數可能不多，白線交易次數多，伴隨停損或獲利的次數也比較多。
