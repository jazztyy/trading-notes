quiz:
  - q: 口數多的時候，Alina 遇到反彈到 EMA200 會怎麼處理？
    o:
      - 先出一口、剩下觀察，因為這位置通常會被壓頭
      - 全部續抱，因為站上 EMA200 代表會繼續往上走
      - 再加碼一口，因為碰到 EMA200 是突破的訊號
      - 全部平倉，因為反彈到 EMA200 就是當天高點
    a: 0
    e: Alina 說口數多時會在 EMA200 先出一口、剩下的觀察，因為這位置通常會被壓頭（Shawnnnn 補充尤其跌很深的時候），之後再看支撐決定去留。
  - q: Mikey 說要跟著 Shawnnnn 一起停損，Shawnnnn 怎麼回應？
    o:
      - 可以跟著他出，因為他看的點位比較準確
      - 先別停損，凹到成本附近再出就不會虧錢
      - 自己還沒損是因為單子還是正的，要看自己成本
      - 改用移動停利，等反彈到 EMA200 再一起出
    a: 2
    e: Shawnnnn 說「你想損就要損，我是因為還是正的」，他的單子還有獲利所以能等，停損要依自己的成本決定，不能跟別人的出場點。
