quiz:
  - q: JJ 覺得群組資訊太多、多空都有人說，nick_AJ 和 Shawnnnn 怎麼建議？
    o:
      - 多跟幾個人的喊單，分散單一來源風險
      - 篩選自己覺得有用的，看誰的策略順手
      - 多空意見各半時就兩邊都各下一口
      - 只看人數最多的那一方意見跟著做
    a: 1
    e: nick_AJ 說要篩選出自己認為有用的、不要被其他影響；Shawnnnn 說看誰的策略操作起來舒服。
  - q: 為什麼 Shawnnnn 說只做期貨去跟那位喊單者會很虧？
    o:
      - 因為期貨手續費和稅比股票高很多
      - 因為喊單者實際上都是在做選擇權
      - 因為喊單者有避險部位，跟單者沒有
      - 因為期貨只能做夜盤，波動太大
    a: 2
    e: JJ 提到他有避險單沒教，Shawnnnn 說「他有避險，所以只做期貨會很虧」。
