quiz:
  - q: JJ 加了很多群、資訊越來越雜反而一直賠，Alina 怎麼看？
    o:
      - 資訊多會增加雜訊影響判斷，捏逆勢單時更明顯
      - 資訊多不是問題，問題是沒有挑出最準的那一群
      - 資訊雜沒關係，只要停損設好就不會一直賠錢
      - 資訊多可以互相驗證，多數人同方向時再進場
    a: 0
    e: Alina 說資訊多有時候會增加雜訊、影響判斷，尤其捏逆勢單的時候；建議看線辦事、按線做不要逆勢。
  - q: Alina 覺得哪一套判斷組合就已經很好用？
    o:
      - 雙線加 RSI 背離，再搭配成交量判斷
      - 雙線加 EMA200，再搭配撐壓點位參考
      - 裸 K 加畫框畫線，再搭配訂閱群訊號
      - EMA25 加 MACD 交叉，再搭配布林通道
    a: 1
    e: Alina 說還是要找自己順手的判斷方法，她覺得「雙線＋EMA200＋撐壓點位」已經很好用。
