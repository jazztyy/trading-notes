quiz:
  - q: Shawnnnn 對 KD 的另一個看法是什麼？
    o:
      - 只看 K 值與 D 值交叉，金叉就試進場
      - KD 到個位數就代表超賣，可以去試抄底
      - KDJ 只看 J 值，J 小於 0 可試抄底
      - KD 只適合看日線，5 分 K 鈍化太多
    a: 2
    e: Shawnnnn 說 KDJ 只要看 J 值，J 小於 0 可以試抄底；維尼原以為到個位數就能抄。
  - q: Shawnnnn 認為 Impulse MACD 比較適合怎麼用？
    o:
      - 單獨當唯一的進出場訊號，交叉就進出
      - 搭配其他指標，或多口數交叉後分批停利
      - 只用來判斷大週期趨勢，不拿來進出場
      - 死叉時直接反手做空，金叉再反手做多
    a: 1
    e: Shawnnnn 說 Impulse MACD 通常要搭配其他指標，或多口數的人交叉後分批停利一些。
