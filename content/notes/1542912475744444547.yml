quiz:
  - q: 兩條線慢慢靠近時，Shawnnnn 對「沒單」和「有單」的處理分別是？
    o:
      - 沒單就進場搶突破；有單則順勢再加碼一口
      - 沒單就掛在兩線中間；有單就移到保本
      - 沒單不進場；有單先觀察，收K前不對就跑
      - 沒單就反手掛單；有單也直接反手
    a: 2
    e: Shawnnnn 說線慢慢靠近，沒單就不會進場；有單時會再觀察，收完前30秒可能就先跑，最後他停損40點離場。
  - q: 停損40點出場後，Shawnnnn 怎麼看這筆交易？
    o:
      - 出場太早，應該等它反彈
      - 乖乖停損就是一個好的交易
      - 停損太小，應該設100點
      - 應該在停損後立刻反手
    a: 1
    e: Shawnnnn 說不知道等等會往上或往下噴，但對他來說乖乖停損就是一個好的交易。
