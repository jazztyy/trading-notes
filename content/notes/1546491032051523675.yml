quiz:
  - q: Alina 看到下降樓梯的走勢時，認為要觀察什麼來判斷是否轉多？
    o:
      - 碰到支撐彈一下就可以轉多看
      - 等成交量放大到超過前一波高點
      - 看有沒有突破下降趨勢線
      - 看 1 分 K 是否先出現買進訊號
    a: 2
    e: Alina 認為下降樓梯是碰到彈一下再往下，反彈只是短多，要看有沒有突破下降趨勢才算轉多。
