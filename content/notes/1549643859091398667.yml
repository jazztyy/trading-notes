quiz:
  - q: 午盤看起來沒什麼波動時，Shawnnnn 怎麼處理手上的多單？
    o:
      - 續抱到下午，看收盤前有沒有發動再決定
      - 加碼一口拉低成本，等下午表態
      - 不先賭下午，先出場，下午晚上再重新規劃
      - 把停損拉到成本價，讓單子繼續跑
    a: 2
    e: Shawnnnn 說「不先賭下午，我多單要先出場」，盤勢沒波動就先出，下午晚上再重新規劃。
  - q: 突破下降趨勢線後的回踩，Shawnnnn 打算怎麼進場？
    o:
      - 突破當下直接市價追進，停損設在趨勢線下
      - 已經先進場，等回踩到趨勢線時再加碼一口
      - 等跌破支撐後反手做空
      - 先出場觀望，等價格回到規劃的進倉價再進
    a: 3
    e: 他說進倉價 45941 那筆還沒進，要看價格有沒有回來再進，回來的話停損只要約 55 點。
