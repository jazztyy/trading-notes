quiz:
  - q: 日 K 直接測到斐波 0.382 後，Alina 預期接下來怎麼走？
    o:
      - 結算前先反彈，站不上 0.236 再往下
      - 0.382 守不住，會直接跌到 0.618
      - 站穩 0.382 後，就會一路漲回前高
      - 先在 0.382 橫盤，等結算後才表態
    a: 0
    e: Alina 說結算前應該會彈一下再往下，往上站不上 0.236，到 47XXX 就差不多了，而且力道一次比一次弱。
  - q: 回頭看那根跌破上升趨勢線的大黑 K，Alina 怎麼檢討？
    o:
      - 那根是主力故意洗盤，之後一定會拉回
      - 單根黑 K 跌破不算數，要等週 K 確認
      - 那根成交量太小不可信，當時不必理會
      - 跌破時訊號就很明顯，只是被漲勢矇眼
    a: 3
    e: Alina 說其實跌破就很明顯了，但她一直被月初上漲的氣勢矇眼，沒有照訊號做。
