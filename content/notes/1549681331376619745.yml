quiz:
  - q: Alina 抓出大範圍的壓力、交界、支撐後，怎麼用「交界」判斷方向？
    o:
      - 交界上偏多看、交界下偏空看
      - 交界上偏空看、交界下偏多看
      - 碰到交界就反手，交界本身是壓力
      - 交界只用來設停損，不判斷方向
    a: 0
    e: Alina 說「交界上偏多看、交界下偏空看」，再看有沒有機會慢慢爬去摸壓力。
  - q: 價格夾在壓力和支撐中間時，Alina 通常怎麼做？
    o:
      - 在中間先小量試單，兩邊都掛好停損再說
      - 夾在中間不太做，通常搭配兩條線法則抓進場
      - 直接在中間價位掛限價單等成交
      - 改看更長週期，等日 K 給方向再市價進場
    a: 1
    e: 她說夾在中間不太會做，通常是搭配師父兩條線法則抓進場；要空也會等接近壓力點位再觀察。
