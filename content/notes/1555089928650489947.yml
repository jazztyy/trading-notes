quiz:
  - q: Alina 找均線糾結、季線下彎、等一根表態的股票時，進場有什麼原則？
    o:
      - 買紅 K 確認表態再追，跌破季線停損
      - 分批買在每根紅 K 上，越漲越加碼
      - 等突破季線才進場，沒突破就不碰
      - 買綠可以、買紅絕對不行，跌破直接掰
    a: 3
    e: Alina 說買進去蹲、糾結的也要防守跌破直接掰，買綠可以、買紅絕對不行。
  - q: Shawnnnn 為什麼建議這類股票成交總量最好有 1500 以上？
    o:
      - 量太小無法用 EMA200 判斷
      - 現在的盤勢中小型股很容易只點火一天
      - 量大才有隔日沖抬轎
      - 融資券才有足夠額度
    a: 1
    e: Shawnnnn 說現在這種盤勢中小型股突然一根很容易只點火一天，所以最好成交總量有 1500 以上。
