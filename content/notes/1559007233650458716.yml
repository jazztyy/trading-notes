quiz:
  - q: 當天直接開在 5 分 EMA200 之上，Alina 認為該怎麼操作？
    o:
      - 開高容易回補，先短空等回到 EMA200 再接多
      - 順勢做多、回踩加單，就算要空也只是短空
      - 方向還不明，先觀望等 2 分K 雙線展開再說
      - 多空都不做，等 OTC 和台指都翻紅才進場
    a: 1
    e: Alina 說當天順勢應該做多、回踩加單，有人問為什麼盤勢強還在空，她回這線型空也只是短空。
  - q: 有人堅持做空，Shawnnnn 覺得不妥的理由是什麼？
    o:
      - 當天成交量太小，空單很難有足夠的獲利空間
      - 日K 乖離已經修正完，回測的機率已經很低了
      - 當天的上升結構完全沒被破壞，不該逆勢空
      - 5 分K 雙線剛黃金交叉，空單停損會抓太遠
    a: 2
    e: Shawnnnn 說當天上升結構完全沒被破壞，不懂為什麼要堅持空；他也提到站穩 49300 可以繼續攻。
