quiz:
  - q: Mikey 問為什麼做多的停損要設在跳水位，nick_AJ 的理由是？
    o:
      - 跳水位是當天最低點，不可能跌破
      - 跌破跳水位就會加速下殺，不能讓它跳水
      - 跳水位剛好是保本的位置
      - 跳水位離進場最遠，停損最不容易被掃
    a: 1
    e: nick_AJ 說「因為要跳水了…不給跳水」，跌破跳水位就容易加速下殺，所以停損放這裡。
  - q: A 大抓的區間最後被貫穿，Mikey 事後的反省是？
    o:
      - 應該等訊號確定有出來再跟著進單
      - 停損應該設得更寬一點才不被洗
      - 應該在區間內加碼攤平降低成本
      - 應該反向操作喊單者給的點位
    a: 0
    e: Mikey 說區間也被貫穿，應該等訊號確定有出來再跟著進單才對。
