  - id: "1551626461067083799"
    author: Shawnnnn
    teacher: true
    time: "2026-09-22 00:09"
    text: 我有幾次懷疑我眼睛是不是看盤看太久壞掉了明明印象中是做空了 怎麼回來他又是繼續多
  - id: "1551626756501405796"
    author: Shawnnnn
    teacher: true
    time: "2026-09-22 00:10"
    text: 我有在想是因為他只是給訊號，但她不是真的取當下的市價單，所以才會有這種情況發生
  - id: "1551626933475868835"
    author: Shawnnnn
    teacher: true
    time: "2026-09-22 00:11"
    text: 因為你程式交易不可能同一根掛了又出，出了又掛，訊號打下去就是下去了，你真的要停損就是下一根後面的事情了
  - id: "1551627130482204693"
    author: Shawnnnn
    teacher: true
    time: "2026-09-22 00:12"
    text: 但因為我想說這是給大家看訊號不是真的要程式交易所以影響應該不會太大
  - id: "1551627438298243123"
    author: Shawnnnn
    teacher: true
    time: "2026-09-22 00:13"
    text: 但原則就是拿30分K去看趨勢，5分K以下找進場點都是沒問題的
  - id: "1551627848824004722"
    author: Shawnnnn
    teacher: true
    time: "2026-09-22 00:15"
    text: 現在就是你先等整根跑完去看看合不合理，合理的話你就用5K去找進場點吧~
