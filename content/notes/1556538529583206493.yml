quiz:
  - q: 對於跟別人的喊單，Shawnnnn 和 nick_AJ 的建議是？
    o:
      - 只挑自己有把握的單跟，降低風險
      - 連輸兩次就停止跟單
      - 跟單時把停損設得比喊單者更緊
      - 要跟就筆筆都跟，像程式單一樣不挑單
    a: 3
    e: Shawnnnn 說要跟就要筆筆都跟，不然常發生「怎麼我跟都輸」；nick_AJ 補充挑單跟多半會挑到輸的。
  - q: nick_AJ 被嘎空手時，Shawnnnn 為什麼說「那也很棒」？
    o:
      - 因為空手就不會被收手續費
      - 代表他沒有在看不懂的盤面亂下單
      - 因為隔天一定會有更好的進場點
      - 代表他的空單停損設得很好
    a: 1
    e: Shawnnnn 說空手代表沒有在看不懂的盤面亂下單。
