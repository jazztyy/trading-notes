quiz:
  - q: 早盤最後盤整得很平緩時，即使價格碰到白線或EMA，Shawnnnn 也不進場，理由是？
    o:
      - 沒有肉可以吃，就算進場利潤也太小不划算
      - 白線和EMA在盤整時會失效，訊號不準
      - 不知道會往上還往下，不要猜，等下一段行情
      - 早盤最後一定會反轉，要等反向訊號再做
    a: 2
    e: Shawnnnn 強調不是沒肉，而是不知道方向要往上還往下，不要猜，等它跑出下一段行情再找買點。
  - q: 看到5分K量能開始萎縮時，Shawnnnn 提醒要擔心什麼？
    o:
      - 震幅可能不大，進場會拖很久浪費時間
      - 量縮代表即將爆量突破，應該提早進場
      - 量縮代表主力在出貨，要立刻反手做空
      - 量縮時停損要放大到100點以上才安全
    a: 0
    e: Shawnnnn 說量能萎縮要擔心震幅可能不大，不是不能進場，而是進場會覺得時間拖太久。
