quiz:
  - q: Alina 用「多空交界」判斷方向的方式是？
    o:
      - 交界上偏空看、交界下偏多看，等價格反轉
      - 只看壓力與支撐，交界只當參考不影響方向
      - 交界下偏空看、交界上偏多看
      - 價格在交界附近時一律先偏多看
    a: 2
    e: Alina 說「交界下就偏空看，交界上偏多看」，再搭配師父的兩線法則抓進場。
  - q: 價格在交界上、壓力下時，Alina 只有在很接近壓力或交界時才敢進場，理由是什麼？
    o:
      - 那裡成交量最大，掛單比較容易成交
      - 那裡一定會出現兩線的進場訊號
      - 那裡是當天波動最大、獲利最多的位置
      - 離關鍵價位近，風險值比較好抓
    a: 3
    e: Alina 說除非很接近壓力或交界，否則交界上壓力下不太敢空，因為接近這些位置「至少風險值好抓」。
