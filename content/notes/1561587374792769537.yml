quiz:
  - q: 10/19 日盤留下跳空缺口時，Alina 為什麼先不追多？
    o:
      - 跳空後常會量縮整理，要等量放大再追多
      - 跳空高機率會回補，加上還沒完全轉多
      - 缺口上方就是 200MA 壓力，突破前不追
      - 日盤跳空多半是假突破，夜盤會整段回吐
    a: 1
    e: Alina 說這種跳空都有高機率補缺的可能，加上盤勢還沒完全轉多，所以先等回補。
  - q: Alina 認為現貨開盤前 15 分鐘往下測低，在什麼前提下還可以接受？
    o:
      - 測低時量要縮，量一放大就代表會續跌
      - 測低不能跌破前一天夜盤的最低點才算
      - 測完要 V 回來，不能一路往下殺下去
      - 要在 9 點前先把缺口補完才可以接受
    a: 2
    e: Alina 說現貨開盤前 15 分測低也還 OK，前提是要 V 回來、不要一路下地獄；比起 9 點才往下殺好。
