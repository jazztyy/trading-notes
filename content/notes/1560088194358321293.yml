quiz:
  - q: 價格跌破 4 小時 200MA 後反彈，Alina 怎麼看這條線？
    o:
      - 反彈碰到 4 小時 200MA 就是極限
      - 跌破後這條線就失效，要改看日 K 的季線
      - 只要站回這條線，很快就能回到 5 萬
      - 這條線只看收盤，插針碰到並不算數
    a: 0
    e: Alina 判斷反彈「到 4 小時這個 200MA 極致」，碰到就插針回落，47700 很難到；Shawnnnn 補充除非晚上數據影響很大。
  - q: Alina 說如果當天跳空開低，反而可以拿來做什麼？
    o:
      - 趁低把期貨空單全部回補，改做多單
      - 跳空缺口一定會回補，可以直接掛多
      - 等缺口補完之後，再用 1 分 K 追空
      - 觀察哪些現股比較快站回，汰弱留強
    a: 3
    e: Alina 說跳空開低時可以觀察現股哪些比較快站回來，藉此辨識強弱、汰弱留強。
