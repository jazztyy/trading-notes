quiz:
  - q: 依 Shawnnnn 照參數的做法，15 分 K 翻多之後要怎麼進場？
    o:
      - 15 分 K 翻多那一根直接市價追進
      - 等 5 分 K 拉回到白線附近再進場
      - 等 5 分 K 站上布林上軌後再進場
      - 等 15 分 K 回到白線附近再進場
    a: 1
    e: Shawnnnn 說 15 分跑完翻多後，要等 5 分 K 回到白線（黃圈處）再進場，而不是看到訊號就追高。
  - q: Shawnnnn 說如果不看參數、單純看 5 分 K，價格回到白線時他為什麼還不會進場？
    o:
      - 因為價格還沒有站上布林中線
      - 因為 15 分 K 還沒有出現翻多
      - 因為白線和綠線兩條線還很黏
      - 因為那根 K 棒的成交量還不夠
    a: 2
    e: Shawnnnn 說單看 5 分 K 時，就算回到白線，兩條線還黏在一起他也不會進場。
