summary: 維尼看到 15 分 K 和 5 分 K 都出現做多訊號就追高。Shawnnnn 示範照參數的做法：15 分 K 先翻多後，要等 5 分 K 拉回到白線（EMA）附近才進場；如果不看參數、單純看 5 分 K，就算回到白線，白線和綠線還黏在一起時他也不會進場。停損方式可以照 C 姊說的「訊號出來就進，看 3 根 K 的表現再決定是否停損」，或用跌破布林中線出場，選自己覺得合理的就好。
