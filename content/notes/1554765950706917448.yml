quiz:
  - q: nick_AJ 貼出高點越來越低的圖時，Alina 認為接下來要看什麼？
    o:
      - 看成交量是否放大到前高
      - 看低點是否也越來越低
      - 看後面收斂的方向
      - 看能不能回到 EMA200 上
    a: 2
    e: Alina 說這是高越來越低的下降區間長相，就看後面收斂方向。
  - q: 價格往上試圖突破下降通道時，Alina 強調什麼？
    o:
      - 突破後要立刻加碼
      - 要守好，不能再跌回通道
      - 突破後第一根回踩就要平倉
      - 一定要帶量才算數，否則反手空
    a: 1
    e: Alina 說看能不能突破下降通道，突破後要守好，不能跌回通道。
