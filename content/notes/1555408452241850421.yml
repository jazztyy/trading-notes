quiz:
  - q: Alina 認為白線和橘線都在 EMA200 之上時，空單應該怎麼看？
    o:
      - 是趨勢反轉訊號，可以抱長空
      - 都只是短空，吃壓力壓回而已
      - 完全不能做空，只能觀望
      - 要等跌破白線就加碼空
    a: 1
    e: Alina 說雙線都在 EMA200 上，空都只是短空，吃壓力壓回豆腐那種。
  - q: 均線漂亮上穿、離 EMA200 有距離時，Alina 提醒後段要小心什麼？
    o:
      - 成交量萎縮
      - 均價線下彎
      - 乖離過大
      - 跌破 EMA200
    a: 2
    e: Alina 說這種線型每個壓回都可以加多、賣飛也能補票，但後面可能要小心乖離。
