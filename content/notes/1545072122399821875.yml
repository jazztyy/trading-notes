quiz:
  - q: "Alina 面對上有壓下有撐的夜盤區間，打算怎麼做？"
    o:
      - "區間內來回做，突破框就停損"
      - "只做突破，不在區間內交易"
      - "等區間結束再進場"
      - "在區間中間加碼攤平"
    a: 0
    e: "Alina 說這區間做，「突破框就筍」，也就是在區間上下軌來回做、破框就停損。"
  - q: "Alina 為什麼對當時夜盤偏空看待？"
    o:
      - MACD 出現死亡交叉，柱狀體翻綠
      - 成交量持續萎縮，反彈都沒有量
      - 外資期貨空單大增，籌碼偏空
      - 高點越來越低，交界位置也沒站穩
    a: 3
    e: "Alina 說雖然一直往下測都彈起來，但高也越來越低，交界965、924都沒站穩，所以偏空看待。"
