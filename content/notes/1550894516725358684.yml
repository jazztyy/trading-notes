quiz:
  - q: Alina 想在點位指標加入成交量，打算怎麼用？
    o:
      - 量縮時進場卡位，量大時代表要出場了
      - 爆量就一律反向操作
      - 帶量上穿交界偏多、下穿偏空，無量不用太看
      - 用成交量取代交界點位，直接判斷多空方向
    a: 2
    e: Alina 說「帶量上穿交界就偏多，下穿就是空」，主要用來判斷點位附近 K 棒強弱，無量就不用太看。
  - q: Shawnnnn 為什麼說量能有時候不是關鍵？
    o:
      - 因為台指期成交量大多是程式單灌水，參考價值不高
      - 因為量縮也可能振幅大，程式常用 ATR 或 ADX 判振幅
      - 因為量只在開盤第一個小時有意義，盤中可以直接忽略
      - 因為量能指標都會落後，程式交易多半只看 K 棒型態判斷
    a: 1
    e: 他舉前幾天「量縮可是振幅大」為例，說程式交易很多會用 ATR 或 ADX 去判斷振幅。
