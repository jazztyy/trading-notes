quiz:
  - q: 在跳水位接單時，nick_AJ 提議下次怎麼分配兩口，讓自己「怎樣都不虧」？
    o:
      - 兩口都設保本，等突破壓力再一起出
      - 一口先停損，另一口往下攤平
      - 兩口都放到第一壓再一起停利
      - 一口賺一點先出，另一口設保本續抱
    a: 3
    e: nick_AJ 說接兩口，一口賺一點先出、另一口設保本放看看，這樣怎樣都不虧。
