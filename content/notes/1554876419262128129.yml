quiz:
  - q: Shawnnnn 以起漲/起跌點設停損時，如果這單停損要 70 點，超過預期怎麼辦？
    o:
      - 停損縮到 50 點照做
      - 先進場，停損改用智慧單移動
      - 減少口數照做
      - 這單就不做
    a: 3
    e: Shawnnnn 說想要的停損位置比較遠、超過預期（例如 70 點）就別做；55 點可接受才做。
  - q: 對還看不懂起漲點、起跌點的人，Shawnnnn 建議復盤時先怎麼設停損？
    o:
      - 先用固定點數停損，例如都 50 點
      - 先用前一天振幅的一半當停損點數
      - 先不設停損，觀察走勢再決定出場
      - 用 EMA50 當停損，跌破才出場
    a: 0
    e: Shawnnnn 說可以先不管起漲起跌點，單純看自己幾點承受得了，復盤先用固定點數例如 50 點。
