quiz:
  - q: 一路大漲但沒有程式單訊號時，99 怎麼做，Shawnnnn 怎麼評價？
    o:
      - 錯過這次波段，等下次訊號；Shawnnnn 說心態正確
      - 手動追多補上這段行情；Shawnnnn 說操作要靈活
      - 先放空等回檔再進；Shawnnnn 說這樣太冒險
      - 調整參數讓訊號提早出現；Shawnnnn 說可以試試
    a: 0
    e: 99 說可以錯過一次波段、等下次程式單訊號，不用每個都賺到；Shawnnnn 回「99 你心態很正確」。
  - q: Shawnnnn 怎麼看「拉高賣飛」這件事？
    o:
      - 賣飛代表停利設太近，要拉大目標
      - 應該分批出場，避免整筆都賣在相對低點
      - 有賺到才是真的賺到，不必糾結賣在最高
      - 賣飛後應該再追回來，避免錯過行情
    a: 2
    e: 他說「拉高賣飛也沒關係，有賺到才是真的賺到」，只能賺認知內的錢，認知外的是幸運不是實力。
