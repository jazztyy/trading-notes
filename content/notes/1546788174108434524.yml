summary: Shawn 說明凹單常期待支撐反彈；看幾分K進場就看幾分K離場，2分K該停損就停損，要做30分K就在30分K線進場，不對就走；他自己曾因凹單把10000點凹不見，後來變成看線機器人。
hidden: false
messages:
  - id: "1546788174108434524"
