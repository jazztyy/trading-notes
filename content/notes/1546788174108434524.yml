    time: "2026-09-08 15:43"
    text: 凹單除了期待到支撐位後反彈外，還會到了支撐位後繼續往下找支撐位然後期待他在下個支撐位反彈
  - id: "1546788259642871819"
    author: Shawnnnn
    teacher: true
    time: "2026-09-08 15:44"
    text: 大家真的該走就要走
  - id: "1546789154686373949"
    author: Shawnnnn
    teacher: true
    time: "2026-09-08 15:47"
    text: 所以再說一次，要參考其他的策略都沒問題，但就是偶爾會產生打架的情況發生。看幾分K進場就看幾分K離場，假設你看2分K進場已經跌倒你該走的位置，你還去看30分K發現已經快到30分K的線了然後不走期待他反彈，我知道有時候會成功🤣但是這就不是我的方法
  - id: "1546789429681856554"
    author: Shawnnnn
    teacher: true
    time: "2026-09-08 15:48"
    text: 正確做法是2分k停損，真的想要做30分k那就在30分k的線進場
  - id: "1546789478616539218"
    author: Shawnnnn
    teacher: true
    time: "2026-09-08 15:49"
    text: 然後都一樣 不對就要走
  - id: "1546801617507066047"
    author: Shawnnnn
    teacher: true
    time: "2026-09-08 16:37"
    text: 大概維持了2個月吧哈哈
  - id: "1546801690944995368"
    author: Shawnnnn
    teacher: true
    time: "2026-09-08 16:37"
    text: 後來就變無情的看線機器人
  - id: "1546801766572494878"
    author: Shawnnnn
    teacher: true
    time: "2026-09-08 16:37"
    text: 才會有一個月佳績12000點
  - id: "1546801821123739668"
    author: Shawnnnn
    teacher: true
    time: "2026-09-08 16:38"
    text: 不然靠我自己在那凹單怎麼可能
  - id: "1546801866837590096"
    author: Shawnnnn
    teacher: true
    time: "2026-09-08 16:38"
    text: 10000點都被凹不見了
quiz:
  - q: 用 2 分 K 進場、價格已跌到該走的位置，但快碰到 30 分 K 的線，Shawnnnn 認為正確做法是？
    o:
      - 先不走，等碰到 30 分 K 的線看會不會反彈再決定
      - 先減一半部位，另一半留著看 30 分 K 的線再說
      - 把停損移到 30 分 K 的線下方，繼續抱著看反彈
      - 照 2 分 K 停損；想做 30 分 K 就在它的線進場
    a: 3
    e: Shawnnnn 強調看幾分 K 進場就看幾分 K 離場，2 分 K 該停損就停損，想做 30 分 K 就在 30 分 K 的線進場，不對一樣要走。
  - q: Shawnnnn 提到凹單的人常見的心態是什麼？
    o:
      - 沒在支撐位反彈，就往下找下一個支撐繼續期待
      - 一到支撐位就立刻停損，不給價格任何反彈空間
      - 只在大週期的線上凹，小週期的單一律直接停損
      - 凹單時會先加倉攤平成本，等反彈一次全部出場
    a: 0
    e: Shawnnnn 說凹單除了期待到支撐位反彈，到了支撐位後還會繼續往下找下一個支撐位期待反彈，所以該走就要走。
