quiz:
  - q: 開盤一路上漲、不回頭時，nick_AJ 的態度是？
    o:
      - 趁強勢直接追進，怕錯過行情
      - 沒回踩不敢上車
      - 先空一口賭漲多拉回
      - 改做選擇權買權取代期貨
    a: 1
    e: nick_AJ 說「目前一路不回頭，沒回踩不敢上車」，要等回踩才進。
  - q: 價格已經突破壓力後，Alina 接下來看的是什麼？
    o:
      - 突破就是假突破，準備反手空
      - 直接看下一個壓力，不必管回測
      - 看它能不能好好轉成支撐
      - 等量縮再判斷是否出場
    a: 2
    e: Alina 說「已經突破壓力了，那就好好轉支撐吧」，後續觀察回測插針區能否守住。
