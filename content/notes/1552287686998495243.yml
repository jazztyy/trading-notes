quiz:
  - q: nick_AJ 為什麼通常不太敢一到撐壓點位就先買？
    o:
      - 因為點位每天都會重算，盤中常會變動
      - 因為夜盤算出的點位不適用在日盤交易
      - 因為撐壓沒搭配量，只是單純數學公式
      - 因為點位通常會先被假跌破一次才反彈
    a: 2
    e: nick_AJ 說目前的撐壓沒搭配量、只是數學公式，可能略顯不足，所以不太敢一開始就買。
  - q: Alina 說即使用點位進場，還要做什麼？
    o:
      - 點位進場後就可以放著不管，等收盤
      - 進場後若被套，馬上加碼攤平成本
      - 等收盤後再決定要不要停損出場
      - 還是要盯一下，不然就要設好保利
    a: 3
    e: Alina 說就算點位進也是要盯一下，不然就要設好保利，並提醒停損要先想好。
