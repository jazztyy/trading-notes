quiz:
  - q: 台指跌深反彈時，Alina 打算怎麼佈空單？
    o:
      - 反彈站上季線就先空，跌破半年線再加碼
      - 等反彈去補完上方缺口，補完就是空點
      - 反彈一出現就逢高空，越漲越加碼往上空
      - 等反彈回到五萬附近前高，再一次空滿
    a: 1
    e: Alina 預期反彈會先去補缺口、補完再往下，所以「補完缺口我就空他全家」；她也說怎麼看都不會回五萬。
  - q: Alina 說高點下來有三個缺口，她預期後面會怎麼走？
    o:
      - 一次反彈就把三個缺口全部補完再往下
      - 三個缺口都不會補，會直接往下找半年線
      - 只要補到第一個缺口就代表空頭結束轉多
      - 可以震盪補三次，補一個缺口就再往下
    a: 3
    e: Alina 說先補一個缺口再向下，下一次再來補下一個，三個缺口可以震盪補三次。
