quiz:
  - q: 依 nick_AJ 的整理，什麼樣的黃金交叉才算標準、可以一路做多？
    o:
      - 兩線在 EMA200 下方交叉就算
      - 兩線貼著 EMA200 來回糾結時交叉
      - 交叉後往上穿過 EMA200（橘線）才算
      - 只要 MACD 同步翻紅就算
    a: 2
    e: nick_AJ 說右邊那種要等往上彎、穿過橘線（EMA200）之後才能說是黃金交叉，進場做多。
  - q: 雙線站上 EMA200 且離它還有距離時，Alina 自己怎麼處理回檔？
    o:
      - 回檔就先全部出場，等再站穩再進
      - 回檔不用怕，甚至往下踩可以加多
      - 回檔時反手做空吃一段
      - 回檔只能觀望，不能加碼
    a: 1
    e: Alina 說黃圈站上後雙線離 EMA200 還有距離，過程跌都不用怕、甚至可以加；但兩線很貼很黏時不要做。
