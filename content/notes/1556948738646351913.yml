quiz:
  - q: Alina 認為聯電基本面沒問題，那她怎麼決定接的位置？
    o:
      - 等投信重新轉為買超，再跟著追進 13x
      - 用技術面找位置，看季線和斐波 0.382
      - 跌破整理框就立刻全部低接，不看位置
      - 等下一季財報公布後，再看 EPS 決定
    a: 1
    e: Alina 說下跌是籌碼問題、基本面沒問題，所以用技術分析判斷；斐波 0.382 約 134.5、跟季線差不多，13x 再來看。
  - q: 到了 13x 的價格帶，Alina 打算怎麼進場？
    o:
      - 一次滿倉進場，避免錯過這波低點
      - 先放空股期避險，等反彈再回補
      - 看有沒有止穩，先試小部位再往上加
      - 只要碰到就掛單接，跌破再往下攤平
    a: 2
    e: Alina 說可以在這個價格帶觀察有沒有止穩，13x 先考慮試一小部位，OK 再往上加。
