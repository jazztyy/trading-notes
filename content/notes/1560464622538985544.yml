quiz:
  - q: Alina 為什麼認為今日壓力 47589 一帶是大壓區？
    o:
      - 5 分 K 的 EMA200 和今日交界位重疊
      - 10 分 K 的 EMA200 和今日壓力重疊
      - 前一天的高點剛好落在今日壓力附近
      - 15 分 K 的 EMA200 已經由撐轉成壓力
    a: 1
    e: Alina 說 10 分 K 的 EMA200 剛好和今日壓力重疊、壓力很大，過了才看 15 分 EMA200（約 47800）。
  - q: 價格回到 5 分 EMA200 附近、K 棒貼線又帶量反彈時，Alina 怎麼處理？
    o:
      - 不追空，空手等真正的趨勢出來再切入
      - 貼線代表快跌破了，提前在線上方追空
      - 帶量代表多方轉強，馬上反手追多單
      - 在 EMA200 上方掛多單，等回測再成交
    a: 0
    e: Alina 覺得這個位置尷尬、貼線又有量，她不敢做，選擇空手不硬做，等真的出現上漲或下跌趨勢再切入；壓力區才是比較好的試單位置。
