quiz:
  - q: 關鍵位被反覆測試時，Alina 的看法是？
    o:
      - 越測越穩，測越多次越敢進
      - 測幾次都一樣，只看當下有沒有帶量
      - 第三次測試最安全，前兩次先觀察
      - 越測越弱要小心跌破，第一次測最敢試
    a: 3
    e: Alina 不喜歡關鍵位測太多次，越彈越弱容易破，通常第一次測最敢試；「越測越穩」是另一派說法。
  - q: Alina 在交界位試多單後，什麼情況會停損？
    o:
      - 跌破交界一點點就立刻停損，不管有沒有帶量
      - 穿交界後連兩根仍跌，或下一根帶量下跌
      - 等跌到下一個跳水位才停損，中間波動不理
      - 收盤沒站回交界就停損，或盤中跌破前低時
    a: 1
    e: Alina 說穿交界下出現兩根還是下跌就停損，或下一根也是帶量下跌；不帶量下穿表示多軍還有撐。
