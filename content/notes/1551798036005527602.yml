quiz:
  - q: 價格或兩條線很黏著 EMA200 時，Alina 怎麼處理？
    o:
      - 視為即將突破的前兆，提早進場先卡位
      - 不一定做，因為這附近容易多空打架被巴
      - 只做順著大週期方向的單
      - 改用 1 分 K 找精準進場點
    a: 1
    e: Alina 說 EMA200 是多空分水嶺，但很黏這條線時容易被巴，所以不一定做。
  - q: EMA200 一直上不去、兩條線快下穿時，Alina 的做法是？
    o:
      - 偏空看但不馬上空，可等上去碰藍線再試空
      - 偏空看，立刻市價追空，避免錯過行情
      - 偏多看，等回踩 EMA200 進多
      - 不判斷方向，等兩條線交叉完成後才看
    a: 0
    e: Alina 會偏空看，但這附近容易被多空打架巴到，所以不馬上空，而是上去碰藍線再試空。
