quiz:
  - q: 維尼提前平倉後行情又走了，Shawnnnn 認為該怎麼判斷這次出場對不對？
    o:
      - 看之後行情有沒有真的跌下去來決定
      - 看當下的壓力位有沒有被成功突破
      - 用自己策略的出場條件有沒有觸發來判斷
      - 看當天日盤的方向有沒有延續到夜盤
    a: 2
    e: Shawnnnn 說策略是跌破藍線才出場就是做錯，策略不是那樣就是對的；不能等行情真的跌了才說「好險有走」。
  - q: 為什麼 Shawnnnn 說交易需要自己的策略來輔助？
    o:
      - 因為做交易一定會有自己的偏見
      - 因為策略能保證每一筆都會獲利
      - 因為不會看壓力就一定無法獲利
      - 因為盤整時只能靠策略預測方向
    a: 0
    e: Shawnnnn 說看盤要獨立一點，做交易一定會有偏見，所以需要策略輔助；他也說不會看壓力沒關係，照策略執行一定會有大賺的時候。
