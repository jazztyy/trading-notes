quiz:
  - q: 關於這套方法用在個股當沖，Shawnnnn 的看法是？
    o:
      - 只能用在台指期，個股的K棒結構和節奏都不適用
      - 可用2、3分K，但數據另買、成本較高，先練微台
      - 個股當沖要改用日線和1小時K，2分K雜訊太多
      - 個股當沖成本比期貨低，最適合新手先從這練
    a: 1
    e: Shawnnnn 說個股當沖2分3分都可以，但即時數據要另外買、當沖成本也比較高，他不太建議，先從一微台練功。
