quiz:
  - q: 在 Shawnnnn 試做的趨勢變色線裡，橘黃色代表什麼？
    o:
      - 多頭趨勢已經確立，可做多
      - 空頭趨勢正在加速下跌
      - 比較震盪，趨勢還沒出來
      - 進場訊號已經出現了
    a: 2
    e: Shawnnnn 說橘黃色就是比較震盪、趨勢還沒出來；顏色較淡的則是落在趨勢中。
