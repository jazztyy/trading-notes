quiz:
  - q: 用雙線搭配 EMA200 時，Alina 的進出場方式是？
    o:
      - 雙線一碰 EMA200 就反向進場，停損抓前高
      - 上穿標準就進多，回踩加多，雙線很靠近時出場
      - 上穿後等第三次回踩才進場，之後抱到收盤
      - 雙線交叉就出場，進場時不用看 EMA200
    a: 1
    e: Alina 說上穿很標準就進多，中間回踩離 200 有距離就加多，雙線很靠近時出場。
  - q: Alina 說用這套方法唯一要注意的是什麼？
    o:
      - 只能在日盤使用，夜盤的訊號不準
      - EMA200 要換成 EMA100 反應才夠快
      - 雙線和 EMA200 很貼很黏時不要做
      - 一定要搭配 MACD 同向確認才進場
    a: 2
    e: Alina 說唯一要注意就是很貼、很黏的時候不要做。
