quiz:
  - q: 10/20 早盤急拉時，Alina 為什麼還不急著看多？
    o:
      - 5 分 K 已經連續 6 根紅 K，漲多一定會回檔
      - 上方有 10 分 EMA200 壓著，5 分雙線只擦邊
      - 價格還在 15 分 K 壓力區下方，量也還不夠
      - 撐壓機器人顯示偏空標籤，還沒轉成偏多
    a: 1
    e: Alina 指出 10 分 K 的 EMA200 還在上方壓制，5 分 K 雙線也只是很貼的擦邊，沒有漂亮的黃金交叉；要先守住 5 分 EMA200 再上穿才漂亮。
  - q: 維尼的 10 分 K 200 線和大家不一樣，原因是什麼？
    o:
      - 他把 200 線設在 5 分 K，週期看錯了
      - 他用的是 McGinley 動態指標，不是均線
      - 他把均線長度設成 25，不是 200
      - 他把 200 線設成 SMA，應該要用 EMA
    a: 3
    e: 維尼發現自己一直設錯成 SMA，大家用的是 EMA200，兩者位置不同。
