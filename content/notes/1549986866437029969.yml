quiz:
  - q: 價格在充滿插針的區域來回測試時，Alina 怎麼判斷？
    o:
      - 插針多代表下方支撐很強，可以直接在這裡做多
      - 插針代表有人在洗盤，應該順勢反向做空一口
      - 插針區不重要，只看收盤價
      - 還不確定轉成有效支撐，可能要下去再上來測一次
    a: 3
    e: Alina 說「看來還不確定是不是轉有效支撐」「感覺要下去再上來測一次」，沒確認前不急著出手。
  - q: Shawnnnn 認為台指期難在哪裡？
    o:
      - 判斷到底什麼時候該有耐心
      - 指標參數太多，不知道用哪個
      - 夜盤時間太長，盯盤很累
      - 手續費和滑價吃掉利潤
    a: 0
    e: 他在 30 分位置進場後說「台指期難就是難在到底什麼時候該有耐心」。
