quiz:
  - q: "nick_AJ 建議獲利後設保本的理由，和他遇到的缺點分別是？"
    o:
      - 保本能確保賺到最大波段；缺點是要一直盯盤調整位置
      - 至少突然下去不會賠；但只下一口被打掉就無法分批停
      - 保本可以直接取代停損；缺點是來回進出手續費比較高
      - 保本讓人比較敢抱單凹單；缺點是整體勝率會下降不少
