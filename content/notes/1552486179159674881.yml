quiz:
  - q: 盤中價格被下降趨勢線壓著時，Shawnnnn 怎麼看大方向？
    o:
      - 趨勢線還壓著就代表全面轉空，偏空做
      - 大週期高檔震盪仍偏多，看能否先突破下降線
      - 只看 5 分 K 的方向，大週期不重要
      - 等跌破均價線再決定方向，先不預設多空
    a: 1
    e: Shawnnnn 說大週期高檔震盪其實還是偏多，要看能不能先突破下降趨勢線、5 分 55MA 站穩。
