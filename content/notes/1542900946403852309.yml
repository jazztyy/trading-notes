quiz:
  - q: 2分K已轉空方趨勢、但1小時K還撐著，若採用看1小時K的方法，Shawnnnn 建議怎麼做？
    o:
      - 跟著2分K馬上做空
      - 多空都不做，直到兩個週期一致
      - 改用5分K重新判斷方向
      - 先找機會做多，不要亂做空
    a: 3
    e: Shawnnnn 說要看你採取什麼方法，若看1小時K就先找機會做多，不要亂做空。
  - q: 空單獲利後 Shawnnnn 賣飛了，行情繼續往下時他的態度是？
    o:
      - 不要FOMO，因為兩分鐘趨勢很容易反轉
      - 立刻追空把賣飛的部分補回來
      - 改掛智慧單讓下一筆自動抱更久
      - 檢討停利太早，下次固定抱到200點
    a: 0
    e: Shawnnnn 說就算賣飛了也不要FOMO，因為兩分鐘的趨勢很容易反轉。
