quiz:
  - q: 大跌後檢討時，Alina 得出的結論是什麼？
    o:
      - 大跌時線容易失準，要改看消息面判斷
      - 暴漲暴跌行情要敢逆勢接刀，報酬才大
      - 看線辦事、少聽雜訊，線早就是空頭長相
      - 線和盤況互相矛盾時，就應該空手觀望
    a: 2
    e: Alina 的結論是看線辦事、不要太多雜訊，回頭看線和盤況早就是空頭長相，只是之前暴漲暴跌被軋怕、凹怕了。
  - q: nick_AJ 和 Kai 認為很多人有參數可看卻還是做不好，問題出在哪？
    o:
      - 參數勝率不到五成，所以大家不敢照著做
      - 不相信眼前的參數，喜歡自己摸頭猜底
      - 參數太多太複雜，新手來不及照著下單
      - 照參數做但停損設太緊，常常被洗出場
    a: 1
    e: Kai 說大家都不相信參數亂做，nick_AJ 也說明明有好用的工具卻沒人看，還是喜歡自己摸頭猜底、享受賭博的快感；回測勝率其實超過 50%。
