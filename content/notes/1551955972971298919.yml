quiz:
  - q: 用庫存「開盤先賣、尾盤買回」時，若開盤 15 分鐘就鎖漲，Alina 怎麼做？
    o:
      - 照原計畫先賣出，尾盤再撿回來
      - 加碼買進，跟著漲停
      - 不動；有倒貨氛圍才會跟著賣
      - 改用股期放空避險
    a: 2
    e: Alina 說開盤 15 分鐘就鎖漲她就不動，有倒貨氛圍才跟著賣、盤中再撿回。
  - q: Alina 說這種先賣再撿回的做法，前提或適合的情況是什麼？
    o:
      - 成本好的股票，或有隔日沖抬轎的股票
      - 成本高、想早點解套的股票
      - 剛突破前高、量能持續放大的強勢股
      - 夜盤開低、日盤預期開低的時候
    a: 0
    e: Alina 說前提是成本好的股票，成本高的賣了就賣了；有隔日沖加入抬轎的也很適合。
