quiz:
  - q: 台指日 K 連三根大綠棒時，Shawnnnn 提醒了什麼觀察？
    o:
      - 日 K 連跌三根後一定會出現長紅反彈
      - 日 K 比較少連續跌超過四根，但會很難受
      - 日 K 連跌超過三根就代表趨勢已經反轉
      - 日 K 連跌時要等第五根止跌才可以進場
    a: 1
    e: Shawnnnn 說日 K 比較少連續跌超過四根，只是這種跌法會讓人很不舒服、容易殺漲殺跌。
  - q: Shawnnnn 判斷下檔可能目標時，參考的是什麼？
    o:
      - 日 K 下方長均線聚集的區域
      - 撐壓點位機器人算出的最低點
      - 當天低點到高點拉斐波的 0.786
      - 前一波起漲點，也就是波段最低價
    a: 0
    e: Shawnnnn 在日 K 圈出下方長均線聚集的 42840-43809 區，當作可能的下檔目標。
