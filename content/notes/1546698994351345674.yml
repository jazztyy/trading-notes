quiz:
  - q: K 棒在線上一直上下穿越的震盪情況，Shawnnnn 怎麼說？
    o:
      - 沒辦法照策略做，要做只能自己看區間來回
      - 照樣依策略訊號進場，只是停損放寬一點
      - 改看更大的週期，等大週期的線再進場
      - 縮小口數，每個訊號都進場攤平風險
    a: 0
    e: Shawnnnn 說這種 K 棒在線上一直上下穿的情況沒辦法按照策略做，要做只能自己看區間來回做。
  - q: 震盪盤中「還有一些進場機會」的第二種情況，Shawnnnn 建議怎麼做？
    o:
      - 看到訊號出來就馬上追價進場，抓趨勢波段
      - 等線完全展開、趨勢明確後再進場抱長
      - 不用追，掛線上價格短打，看估計量預估振幅
      - 改用市價單快進快出，避免掛單掛不到
    a: 2
    e: Shawnnnn 說第二種仍可進場但獲利不能抓得像趨勢那麼大，不用追，掛線上價格短打，可看估計量預估振幅。
