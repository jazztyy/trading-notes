quiz:
  - q: 10/20 午盤急殺時，Shawnnnn 怎麼判斷回檔已經「夠深了」？
    o:
      - 用前一天高低點拉斐波，回到 0.5 就算夠深
      - 用當天低點到高點拉斐波，回到 0.618 算夠深
      - 用波段起漲點到當天高點拉斐波，跌破 0.382
      - 看價格跌回開盤價附近，開盤價就是最深位置
    a: 1
    e: Shawnnnn 用當日低點到高點拉斐波，指出已經回到今天的 0.618 位置「夠深了」；守開盤價是 Alina 另外看的點。
  - q: Shawnnnn 圖上出現的 BUY、SELL 標記代表什麼？
    o:
      - 斐波回撤到 0.618 時自動跳出的提示
      - 撐壓點位機器人算出來的進出場建議價位
      - 價格穿過 EMA200 時顯示的多空切換
      - 白線穿過 EMA 時顯示的買賣訊號
    a: 3
    e: Shawnnnn 說那只是白線穿過 EMA 時顯示出 BUY 或 SELL 而已。
