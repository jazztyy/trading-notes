quiz:
  - q: Alina 每個月替自己設獲利目標，主要用意是什麼？
    o:
      - 督促自己每天都要下單，才追得上目標
      - 達標後可以放大口數，把獲利再滾上去
      - 達標就克制下單，避免手癢硬交易
      - 沒達標就延長交易時間，月底前補足
    a: 2
    e: Alina 說每月設獲利目標可以克制自己不要硬交易，雖然仍會手癢；她之前的虧損花了幾個月才打回來。
  - q: 手感不好、連續好幾單都不順的時候，Alina 和 Shawnnnn 怎麼看？
    o:
      - 可以停手，因為多做真的會多錯
      - 要加大口數，一兩單就能把虧損賺回
      - 改換別的時間週期，重新找進場訊號
      - 縮小停損繼續做，等手感慢慢回來
    a: 0
    e: Alina 說手感不好可以停手；Shawnnnn 說多做真的會多錯，Alina 補充尤其好幾單都不行的時候。
