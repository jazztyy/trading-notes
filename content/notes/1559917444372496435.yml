quiz:
  - q: Alina 判斷空單停利位 320 會有支撐、要守住，參考的是什麼？
    o:
      - 今日交界位和 EMA200 重疊處
      - 前一天日 K 的最低點位置
      - 10 月月 K 的開盤價位置
      - 上升趨勢線往下延伸的位置
    a: 2
    e: Alina 說她的邏輯是看月 K 開盤價，10 月開在 48322，所以認為 320 要守。
  - q: 價格在 380 附近沒跳水、5 分 K 勉強站上時，Alina 為什麼先平掉空單？
    o:
      - 等這根 5 分 K 收完風險太大，不想抱上抱下
      - 判斷空方趨勢已經結束，準備反手做多單
      - 月 K 開盤價已被跌破，停利目標已經達成
      - 4 小時 K 已經轉偏多，多週期方向翻轉了
    a: 0
    e: Alina 雖然覺得還會再下，但認為等這根 5 分 K 收完風險太大、不想抱上抱下，就先落袋，打算拉上去再空。
