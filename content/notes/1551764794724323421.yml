quiz:
  - q: nick_AJ 發現當天支撐跟壓力相距很大，Alina 怎麼解釋？
    o:
      - 看前一天的振幅，前一天震幅大撐壓就拉大
      - 當天開盤跳空太大，撐壓距離才會被拉開
      - 代表多空力道懸殊，當天容易走單邊行情
      - 是用的週期太大，換小週期就會縮小
    a: 0
    e: Alina 說撐壓距離要看前一天的振幅落差，前一天震幅大，算出來的撐壓範圍就會大。
  - q: 盤勢一關一關往下破時，Alina 建議去哪裡找低接機會？
    o:
      - 等跌破所有支撐後再追空
      - 去找交界位置，才有機會找低接點
      - 看 1 分 K 出現長紅就馬上接
      - 直接掛在當日最低點附近等成交
    a: 1
    e: Alina 看價格一關一關往下破時說「去找交界吧」，在交界才有機會找低接點。
