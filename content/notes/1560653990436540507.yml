quiz:
  - q: Alina 復盤時說，5 分 K 碰 200ma 一直站不上，正確做法應該是什麼？
    o:
      - 等第三次測試 200ma，站不上再停損多單
      - 跌到前低支撐附近，再加碼多單攤平成本
      - 第一次壓回就停損多單，十字後向下就空
      - 改看 15 分 K，確認也站不上才停損出場
    a: 2
    e: Alina 說「200ma 都站不上，第一個壓回 K 多就要停損，後面十字後向下就該空」，她當時卻一直主觀猜底。
  - q: 跌破支撐、開始下穿時進空，Alina 建議停損怎麼設？
    o:
      - 價格重新站回支撐就停損
      - 進場價往上固定抓 60 點
      - 反彈碰到 5 分 EMA200 時
      - 前一個高點再往上 50 點
    a: 0
    e: Annahui 說她空單防守 60 點，Alina 回「防守就站上支撐，好判斷」，也就是反轉站回支撐就停損。
