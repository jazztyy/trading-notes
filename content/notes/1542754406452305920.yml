summary: 下殺後盤整先別急著下單，看方向；若反彈碰到白線或 EMA 再嘗試。只做單邊，先看一小時K趨勢，再到2分K找進場；一小時K很洗（在兩線間上下）停利停損要比趨勢單小，2分K區間約135點的盤整不做；好進場為站回白線後掛空單、藍白線仍下彎勝率高。
