quiz:
  - q: 1小時K很洗（在兩條線上上下下）時，Shawnnnn 說2分K做單要注意什麼？
    o:
      - 完全不能做，只能等1小時K出趨勢
      - 可以找到位置，但停利停損要比趨勢單小
      - 停損要放寬，才不會被洗出場
      - 改成多空都做，各下一口對沖
    a: 1
    e: Shawnnnn 說1小時K很洗時2分K一定找得到位置，但停利停損一定會比趨勢單少。
  - q: Shawnnnn 舉的「好的空單進場點」具備什麼條件？
    o:
      - 跌破白線後立刻追空
      - 藍線白線都上彎時逆勢掛空
      - 價格站回白線時掛空單，且藍線白線都還下彎
      - 2分K盤整區間約135點時在高點掛空
    a: 2
    e: Shawnnnn 說等價格站回白線掛空單，此時藍白線仍下彎，勝率較高；135點的盤整區間他則不想做。
