quiz:
  - q: 依 Shawnnnn 的說法，決定要不要進場前要先看什麼？
    o:
      - 對應的出場位置好不好，不好就乾脆不要進
      - 當下成交量有沒有放大，沒放量就不要進
      - 這筆單能不能一次賺到一大段才值得進
      - 其他老師有沒有喊同方向，有才跟著進
    a: 0
    e: Shawnnnn 說「進場的位置就要去看出場位置好不好，如果出場位置不好乾脆不要進」。
  - q: 價格噴出去之後，手上沒單的人 Shawnnnn 建議怎麼做？
    o:
      - 趁動能強立刻追進，避免錯過
      - 反向做空，賭噴出後一定拉回
      - 不要亂追，等回踩，有回踩都是機會
      - 改看 1 分 K 找最早的進場點
    a: 2
    e: 他說「沒單先別亂追，有回踩都是機會」，並提醒快速漲跌一段後休息是正常的，現在不是看到噴隨便進都能吃一大段的行情。
