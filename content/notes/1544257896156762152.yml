  - q: "盤整沒方向時，ROCH 和 Alina 的做法是？"
    o:
      - 照樣用大台進場，只是把停損拉寬到100點以上
      - 3個指標都在盤就不進；短打用小台、40-50點閃
      - 改做逆勢單，在盤整區上下兩端摸頂摸底賺價差
      - 持有的單加碼攤平，等單邊行情出現再一次出清
    a: 1
    e: "ROCH 說指標有3個都在盤就不進；Alina 說短的40-50點就閃，短打用小台。"
