quiz:
  - q: Alina 空一口遠月的目的是什麼？
    o:
      - 看空年底行情，先佈一口遠月空單等待大跌
      - 遠月波動比較小，把多單部位換成遠月空單操作
      - 用遠月空單賺價差，同時把近月多單逐步賣掉
      - 跟成本很好的近月多單對鎖，結算前先保住獲利
    a: 3
    e: Alina 說她 48443 的近月多單還想續抱，所以找個遠月位置空一口鎖利，至少到結算前先保利，等方向明確再處理。
  - q: Alina 為什麼不乾脆把近月多單賣掉就好？
    o:
      - 近月快要結算了，現在賣掉要多付額外費用
      - 近月多單其實已經虧損，賣掉就等於認賠出場
      - 她打算等多單轉倉到遠月，再一次全部平倉
      - 成本很好捨不得，怕賣飛之後被行情來回巴
    a: 3
    e: Alina 說成本很好捨不得、怕賣飛，賣掉感覺會被巴來巴去，所以用遠月空單對鎖；隔天跳空回到她成本，幸好有鎖。
