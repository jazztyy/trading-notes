quiz:
  - q: Alina 認為 47404 一定要守住，理由是什麼？
    o:
      - 是 4 小時 200MA 所在，跌破就由撐轉壓
      - 是 10 月月 K 開盤價，跌破本月就翻黑
      - 是日 K 上升趨勢線，跌破代表趨勢反轉
      - 是 6/23 跳空缺口低點，當初攻多次才過
    a: 3
    e: 47404 是 6/23 跳空 K 棒的低點，這個缺口壓力當初攻了好多次才突破；守不住就會滾回下面的舊框，上方變成魔王大壓。
  - q: 價格跌回 47404 附近時，Shawnnnn 認為怎樣的走法也算漂亮？
    o:
      - 跌下去測試後收針站回
      - 直接跌破後回測不過再續跌
      - 一直在上方橫盤不碰到線
      - 跳空開低後一路拉回缺口
    a: 0
    e: Shawnnnn 說跌下去測試、收針站回上來也算漂亮，重點是收回位置之上，而不是完全不能碰。
