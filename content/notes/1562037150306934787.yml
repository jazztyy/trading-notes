quiz:
  - q: 依 Shawnnnn 的做法，30 分 K 和 5 分 K 各自負責什麼？
    o:
      - 30 分看參數訊號定方向，5 分找進場位置
      - 5 分看參數訊號定方向，30 分找出場位置
      - 30 分和 5 分訊號同時出現才可以進場
      - 30 分只用來畫撐壓，5 分訊號出來就進
    a: 0
    e: Shawnnnn 說不能只看 5 分 K 參數就進去，要看 30 分的參數訊號，5 分 K 用來看進場位置。
