    text: 日線維持上禮拜說的現在就還是多頭趨勢，做單邊的就是以做多勝率高，但現在夜盤已經走到4小時K的壓力位，明天如果開高很容易就過，但就是要注意現在4小時K壓力過去之後會不會假突破跌下去再拉上來創高，下禮拜我覺得操作難度有可能高一些，因為有機會在圖上那兩條紅線震盪後再往上，下禮拜我自己就會以短線為主，除非你上禮拜成本有在46100以下的多單不然你會被洗的很不舒服
