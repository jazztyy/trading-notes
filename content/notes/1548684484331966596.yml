quiz:
  - q: Shawnnnn 預期下週可能在兩條紅線間震盪後再往上，他打算怎麼操作？
    o:
      - 趁震盪重倉做多，抱到突破紅線創高再出場
      - 以短線為主，除非多單成本夠低，不然會被洗
      - 改做空單為主，等震盪結束確認再轉做多
      - 完全不進場，等突破上方紅線站穩再說
    a: 1
    e: Shawnnnn 說下週操作難度可能較高，他會以短線為主，除非上週多單成本很低，不然會被洗得很不舒服。
  - q: 用 5 分 K 做單的人，Shawnnnn 建議怎麼進出場？
    o:
      - 用 5 分 K 進場，但用日 K 判斷出場
      - 用 5 分 K 進場，出場改看 1 分 K 比較快
      - 用 5 分 K 進場，停損改看 30 分 K 的線
      - 以 5 分 K 進出場為主，停損就不會大重傷
    a: 3
    e: Shawnnnn 說 5 分 K 算短線，就以 5 分 K 進出場為主，這樣停損就不會大重傷。
