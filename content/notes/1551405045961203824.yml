quiz:
  - q: 價格來到日壓 47850 時，Alina 什麼情況下才會考慮做空？
    o:
      - 一碰到壓力就空，停損設在壓力上方
      - 帶量衝破壓力後馬上反手空
      - 衝破壓力後軟掉、回到壓力下方才考慮
      - 等 30 分 K 參數翻空才空，不看壓力
    a: 2
    e: Alina 說帶量衝破就不敢空，「衝破壓力軟掉回壓力，我才會考慮要不要空」，Shawnnnn 補充那就是假突破。
  - q: 加權指數和櫃買走勢不太同步時，Shawnnnn 怎麼解讀？
    o:
      - 代表指數即將反轉，要準備做空
      - 是在拉權值股，做個股的話要看櫃買
      - 是資料延遲，不用理會
      - 代表中小型股領漲，權值股會補跌
    a: 1
    e: 他說「不太同步就是拉權值股，做個股的話就是看櫃買」，所以手上庫存不一定漲很多。
