quiz:
  - q: 10/20 夜盤 Alina 進一口微台多單，她的依據是什麼？
    o:
      - 5 分雙線交叉，離交界近，停損好防守
      - 1 分 K 出現 BUY 訊號，價格直接追進去
      - 跌到斐波 0.618 位置，回撤夠深可以接
      - 5 分 60 均線往上彎，代表空方力道轉弱
    a: 0
    e: Alina 說她是看線進場：5 分雙線交叉、離交界近，好防守；但遲遲站不上交界她就會走。
  - q: Shawnnnn 跟進這筆多單時，進場點是怎麼抓的？
    o:
      - 等價格站上交界後，回測交界不破再進
      - 1 分 K 出現 BUY 後，拉回碰到白線就進
      - 等 5 分雙線黃金交叉確認後，市價追進
      - 掛在 5 分 60 均線上，碰到就自動成交
    a: 1
    e: Shawnnnn 說他是 1 分 K 出現 BUY 訊號後，剛好拉回碰白線就進去。
