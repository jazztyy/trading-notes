quiz:
  - q: 覺得多空來回做很累的人，Shawnnnn 提供的「只做一邊」方法是？
    o:
      - 先看2分K定方向，再到1小時K找同方向的進場點
      - 只做開盤第一根K棒的方向，之後同方向進場
      - 先看1小時K的趨勢，再到2分K找同方向進場點
      - 只做多不做空，空單訊號出現時一律不碰
    a: 2
    e: Shawnnnn 說先看1小時K的趨勢，例如還在多頭上彎就去2分K找做多的位置，勝率會高一些。
  - q: 依 Shawnnnn 的做法，判斷1小時K時要看哪一根K棒？
    o:
      - 收K後的完整K棒
      - 正在跑的即時K棒
      - 前一天收盤的那根K棒
      - 當下成交量最大的K棒
    a: 0
    e: Shawnnnn 特別提醒1小時K請看收K後的完整K棒，不要看還沒收完的。
