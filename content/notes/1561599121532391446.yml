quiz:
  - q: 有人問「日盤要是跌破夜盤低點該怎麼辦」，Alina 和 Shawnnnn 的態度是？
    o:
      - 先預想好各種劇本，事先決定每種情況怎麼做
      - 當下一步一步看線辦事，猜太多只會更焦慮
      - 跌破夜盤低就代表程式單啟動，要立刻反手空
      - 夜盤低點沒有實質支撐，日盤不用特別理會它
    a: 1
    e: Alina 說當下一步一步看、看線辦事不要想太多，Shawnnnn 也說要猜猜不完只會更焦慮；Alina 補充想太多會讓出場判斷的雜訊變多。
  - q: 震盪盤時，Alina 建議怎麼處理部位？
    o:
      - 留一口底倉過夜，其餘部位日內出場
      - 拉長到 15 分 K 操作，減少被來回洗
      - 停損放寬一點，等震盪結束後再加碼
      - 像女神一樣日內結清，每筆獨立分開
    a: 3
    e: Alina 說震盪盤可能要像女神那樣日內結掉，每一筆都獨立分開，過了就過了。
