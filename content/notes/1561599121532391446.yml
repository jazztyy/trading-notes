summary: 維尼貼出別人的問題：「高點和回測低點都出現在夜盤，如果哪天日盤跌破夜盤低點該怎麼辦？」Alina 的理解是夜盤負責回測支撐、日盤防守，日盤要是跌破夜盤低就代表慣性改變，可能觸發程式單。但她認為當下一步一步看線辦事就好，不要想太多；Shawnnnn 也說「要猜猜不完，只會讓自己更焦慮」。Alina 補充想太多會讓出場判斷的雜訊變多，回頭看線其實都告訴你該怎麼做。震盪盤可以學女神日內結清，每一筆獨立分開，過了就過了。
