quiz:
  - q: 夜盤急殺後，Alina 從哪個跡象判斷下跌力道變弱了？
    o:
      - 趨勢表從 1 分到 4 小時全部翻多
      - 5 分 K 低檔連續插了很多根針
      - 成交量明顯放大，出現止跌長紅 K
      - KD 在低檔出現黃金交叉的訊號
    a: 1
    e: Alina 指出 5 分 K 低檔插很多針，所以說下跌力道有變弱；當時趨勢表其實還是全數偏空。
  - q: 維尼想在日 K 斐波 0.382 附近接多，Alina 為什麼勸她別衝動？
    o:
      - 0.382 回撤太淺，至少要等 0.618 才接
      - 日 K 斐波參考性低，應該改看 30 分 K
      - 季線還在下方，要等跌到季線再來接
      - 這個支撐剛剛測過，再測會越來越弱
    a: 3
    e: Alina 說價格剛剛才去過 0.382，前一天也測過，下一次再測只會越來越弱，所以別在那裡硬接。
