quiz:
  - q: Alina 搭配籌碼選股的順序是？
    o:
      - 先看外資買超名單，再看技術面
      - 先從技術面挑均線順向，再看籌碼
      - 先看族群新聞題材，再看分點進出
      - 只看大哥分點成本，不看技術面
    a: 1
    e: Alina 說通常先從技術面挑均線順向，再看籌碼：掃外資買超、厲害大哥分點與成本、族群金流。
  - q: Alina 說看族群金流時，有的族群很團結，該怎麼用？
    o:
      - 領頭羊漲上去後就去買同族群的其他股
      - 領頭羊漲上去後就去放空領頭羊本身
      - 等全族群都漲起來確認團結後才進場
      - 只買族群裡漲幅最多的那一檔強勢股
    a: 0
    e: Alina 說團結的族群如果領頭羊漲上去，就是去買其他的。
