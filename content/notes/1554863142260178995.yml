quiz:
  - q: 維尼昨天在 EMA50 做空、今天在 EMA50 做多，Shawnnnn 認為問題在哪？
    o:
      - 今天那單停損設太小，才會被洗出場
      - EMA50 本身不適合台指期，要換別條線
      - 應該改用 1 分 K 進場，位置會更精準
      - 策略不一致，要固定做順勢才看得出勝率
    a: 3
    e: Shawnnnn 說不能今天順勢做多、明天逆勢做，跳來跳去策略會失真；今天那單照策略停損是正確的交易。
  - q: Shawnnnn 建議復盤盡量做一個月，理由是？
    o:
      - 一個月才夠算出平均停損點數
      - 一定要涵蓋震盪盤跟趨勢盤
      - 一個月後指標參數才會穩定
      - 月初和月底的盤性不同
    a: 1
    e: Shawnnnn 說可以的話盡量一個月，因為一定要有震盪盤跟趨勢盤。
