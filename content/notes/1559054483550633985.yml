quiz:
  - q: nick_AJ 用帝王指標看 3 分K，早上是在等什麼訊號才沿線做多？
    o:
      - 等價格跌到 EMA200 下方，再出現長下影線
      - 等聰明錢指標的紅色壓力區被帶量突破才進
      - 等 1 分K 連續三根紅K，確認多方動能出來
      - 等白線黃金交叉，並觀察藍色 EMA200 的交會
    a: 3
    e: nick_AJ 說早上他就是在等白線黃金交叉，也在等藍色 EMA200 跟下面的線交接，之後一路沿線做多；Alina 也認同黃金交叉後沿路做。
  - q: 回踩時要進多，nick_AJ 怎麼確認和設停損？
    o:
      - 看 1 分K 收紅就進，停損固定抓 60-70 點
      - 不另外確認直接進，停損放在當天開盤價下方
      - 用 5 分K 再看一兩根，停損設在前面不遠的交叉點
      - 等 15 分K 收紅再進，停損設在前一天的最低點
    a: 2
    e: nick_AJ 說回踩後再用 5 分K 看一兩根確認，停損設在前面不遠的交叉點附近，就算被騙也不會賠太多點。
