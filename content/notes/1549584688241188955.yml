quiz:
  - q: 價格在當日壓力線下、還沒站穩的「打架位」，Alina 和 Shawnnnn 傾向怎麼做？
    o:
      - 在打架位兩邊各掛一張，誰先突破就留誰
      - 直接在壓力線下放空，壓力線通常會有效
      - 先重倉做多，賭價格很快會站上壓力線
      - 等趨勢明確或真的轉折再做，不然很容易被巴
    a: 3
    e: Alina 說安全的話是真的轉折下降途中再做，不然很容易被巴；Shawnnnn 也說等趨勢明確再進場。
  - q: 被問到 BOS 指標有沒有幫助時，Alina 怎麼回答？
    o:
      - 覺得還好，她通常只看支撐壓力色塊
      - 非常有用，她都靠 BOS 決定進場
      - 只在結算日才會參考 BOS
      - BOS 可以取代兩線策略
    a: 0
    e: Alina 說 BOS「我覺得還好」，她通常只看支撐壓力色塊；ROCH 則說 BOS 是趨勢延續，多少有點用。
