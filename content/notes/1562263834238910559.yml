quiz:
  - q: 結算日期貨跳空開高，Alina 判斷是跌深反彈，她開盤怎麼做？
    o:
      - 開盤直接追多，因為今天應該是多方趨勢
      - 開盤小空，等 9:00 現貨開盤回測時回補
      - 開盤先觀望，等站上 30 分 200MA 再做多
      - 開盤小多，等 9:00 現貨開盤上衝時停利
    a: 1
    e: Alina 說 9:00 現貨開盤應該會往下回測，因為跳太遠了，所以開盤小空等 9:00 回補，再反手看走向；跳空開盤正是好空點。
  - q: Alina 這天對 11 月和 12 月合約的分工是？
    o:
      - 11 月分批佈空單抱波段，12 月只做短進短出
      - 11 月和 12 月同時佈空，口數各分一半控管
      - 12 月往缺口一格一格分批空，11 月做短進短出
      - 12 月一次空滿等缺口，11 月反手做多來對沖
    a: 2
    e: Alina 說近月過 47422 後，往上到缺口一坎一坎陸續下 12 月微台空單，11 月還是留著做短進短出，符合她近月短衝、遠月做趨勢的原則。
