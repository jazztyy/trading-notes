quiz:
  - q: Alina 為什麼覺得載板股現在這個位階好防守？
    o:
      - 因為已經跌破季線，下檔空間有限不怕跌
      - 因為成交量創新高，代表有主力進駐
      - 因為均線糾結，進去蹲等它翹尾巴拉季線
      - 因為法人連續買超，籌碼面相對安定
    a: 2
    e: 她說「均線糾結好防守」，形態上季線下彎、等死貓跳一根，至少拉一下季線。
