summary: Alina 在日 K 畫出 7 月以來的震盪箱型：上緣約 47400–47500 是魔王壓力，也是好空點，往上不過就再加空；下緣約 44000，跌破就看下一個框，約 39000。她說 Q4 創新高的任務已經達成，估計要再震盪一季來消化壓力，現在價格在框中段，季線附近應該會有反彈。框內的做法是上緣空、下緣不追空；接多要慢慢接，或在框內來回做。帳面虧損時別想攤平撿便宜，一路接到框底就是接刀子。她也反省：39000 那次在框底追空、這次在框上緣做多，犯的是同一個錯。
