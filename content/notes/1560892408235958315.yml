quiz:
  - q: 依 Alina 的日 K 箱型框架，價格在框內時應該怎麼操作？
    o:
      - 上緣附近找空點，到了下緣不追空
      - 突破上緣才追多，跌破下緣才追空
      - 在框中段先建倉，上下緣再各加碼
      - 碰下緣就追空，碰上緣就追多單
    a: 0
    e: Alina 說框上緣是魔王壓力、好空點，不過就再加空；下緣不追空，接多要慢慢接或在框內來回做。她也反省自己曾在框底追空、框上緣做多，是同一個錯。
  - q: 帳面虧損時想攤平「撿便宜」，Alina 怎麼看？
    o:
      - 只要還在框內就能攤，破框再停損
      - 可以攤平，但每次加碼的口數減半
      - 那是接刀子，一路接到框底會很慘
      - 先等季線止跌，再分批往下攤平
    a: 2
    e: Alina 說帳面負的時候會想攤一下、以為在撿便宜，其實是接刀子，一路接到框底會很慘。
