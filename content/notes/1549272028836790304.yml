quiz:
  - q: 依 Shawnnnn 的說法，期貨均價線指標該怎麼用？
    o:
      - 價格碰到均價線一定會反彈，可直接重倉逆勢
      - 價格在均價線上就做空、線下就做多
      - 先判斷多空照著做，均價線只是參考位置
      - 只要價格穿過均價線就立刻反手
    a: 2
    e: Shawnnnn 說均價線是一個參考位置，先判斷多空照著做；如果快到均價做逆勢單，也一樣要跑很快。
  - q: 加上當月均價線後，Shawnnnn 說出現什麼情況基本上盤勢就是空方？
    o:
      - 當日均價線下穿當月均價線
      - 當月均價線上穿當日均價線
      - 價格碰到當月均價線後反彈
      - 當日均價線和當月均價線黏在一起
    a: 0
    e: Shawnnnn 說當日均也穿過月均，那基本上盤勢就是空方了，這是解讀趨勢的另一種方式。
