quiz:
  - q: 10/21 早盤進入震盪，Alina 怎麼框出區間、決定方向？
    o:
      - 用前一天夜盤的高低點框區間，突破就反向做
      - 用日盤那根的高低點框區間，等突破再跟進
      - 用 5 分 K EMA200 上下 50 點框區間來回做
      - 用斐波 0.382 和 0.618 框區間，碰到就進場
    a: 1
    e: Alina 說抓日盤高點加低點做區間震盪，看往上還往下突破；不破低就可能震盪到中午，她自己做會守日盤那根的低點。
