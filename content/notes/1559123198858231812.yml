quiz:
  - q: Shawnnnn 說現在進多他會守 49200，但他提醒為什麼不該照抄他的停損？
    o:
      - 他的成本本來就低於現價，隨口說的停損對他不痛不癢
      - 他用的是 1 分K，週期不同，停損位置不適合別人用
      - 他當天只是試單一口，停損本來就會抓得比較寬鬆
      - 他之後會在 49200 再加碼攤平，所以停損位置會變
    a: 0
    e: Shawnnnn 說他本來就有單、成本低於現價，現在說一個停損對他不痛不癢，大家成本不同，不該一起損一起賺。
  - q: Alina 在多空交界進的多單，停損條件是什麼？
    o:
      - 2 分K 雙線糾結時就先出場，等方向明確再進
      - 跌破進場價 30 點就停損，不論均線位置如何
      - 3 分K 價格掃過 EMA 就出場，不等 5 分K 確認
      - 5 分K 出現實體K下穿 EMA200 就出場
    a: 3
    e: Alina 守 5 分 EMA200，說「五分出現實體K下穿 EMA200 我就閃」；同理在還沒下穿前她也不敢空。
