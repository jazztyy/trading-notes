quiz:
  - q: "殺得很快時，Shawnnnn 看1分K是要做什麼？"
    o:
      - 等反彈到白線或藍線做空，但反彈很兇就不做
      - 搶反彈做多，跌越快反彈越大，但只做一口
      - 等跌破前低再追空，反彈到線上就先不做
      - 等1分K黃金交叉再做多，殺太快就不追空
    a: 0
    e: "Shawnnnn 說不是搶反彈，是反彈到白線或藍線就做空；但如果上去很兇就不要做。"
