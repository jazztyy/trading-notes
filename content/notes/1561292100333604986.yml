quiz:
  - q: tawpas 的多單重傷還在凹，Alina 說下一次反彈該怎麼看待？
    o:
      - 是攤平的好機會，可以趁反彈加碼
      - 代表底部已經到了，可以繼續抱多
      - 要等站回前高再出，才能少賠一些
      - 是給你逃命的，反彈就先減碼出場
    a: 3
    e: Alina 說「下一個反彈是給你逃命的，不是給你抱多發大財的」，反彈要先減碼。
  - q: tawpas 想出清股票去凹期貨、賭身家，Alina 的建議是什麼？
    o:
      - 可以凹，但要先把停損設在前低下方
      - 先降槓桿、空手，等真正的低點支撐再買
      - 賣股票補保證金沒問題，只要不再加碼
      - 改成反手做空，把虧損從空單賺回來
    a: 1
    e: Alina 說現在不是要先降槓桿嗎，這個時間點不該賭身家；先保本、空手，等真的低點支撐出現再買。
