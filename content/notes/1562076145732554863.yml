quiz:
  - q: 台指跌到季線附近卡住時，Alina 為什麼覺得在這裡追空很危險？
    o:
      - 季線附近容易被反彈打到，等於賭方向
      - 季線是長期多空線，跌到這裡一定會反轉
      - 季線附近量能不足，空單容易成交不了
      - 季線下方沒有支撐，停損會設得非常遠
    a: 0
    e: Alina 說季線不守會溜滑梯，但這個位置追空被扒的機率高、感覺在賭方向，不如等更低的位置搶低接反彈單；後來季線果然出現大反彈。
