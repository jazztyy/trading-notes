quiz:
  - q: 依 Shawnnnn 的說法，為什麼要花時間做復盤？
    o:
      - 找出哪些點位一定會反轉，下次就能直接放大口數
      - 找出每天固定開始拉抬的時間，提前進場等待
      - 驗證策略勝率能否達到八成，達標後才可以上線
      - 確認自己耐不耐得住洗、停損痛不痛、能扛幾筆連虧
    a: 3
    e: Shawnnnn 說交易沒有絕對、都是機率，復盤是為了知道這個策略自己耐不耐得住洗、停損會不會很痛、能接受連續幾筆虧損。
  - q: 維尼認為「只有及時反手和無感情的參數才是賺的」，Shawnnnn 怎麼回應？
    o:
      - 同意，所以照參數跟著做就好，不必再花時間看盤
      - 反手可以，但參數要依當天盤勢隨時手動調整才行
      - 不認同，因為反手太頻繁，手續費會吃掉大部分獲利
      - 要自己復盤，事後看都賺，但沒算到被洗時的心態
    a: 3
    e: Shawnnnn 提醒事後回頭看好像都賺，但沒想到中間洗盤時自己實際的心態跟心情，所以這個也要親自復盤。
