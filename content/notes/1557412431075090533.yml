    text: 交易沒有絕對，都是機率問題唷，所以才說為什麼要復盤的原因就在這，你要知道說這個策略我到底可不可以耐得住洗，我停損會不會很痛，也要問我可以接受連續幾筆虧損
  - id: "1557414033307476099"
    author: Shawnnnn
    teacher: true
    time: "2026-10-07 23:27"
    text: 所以我對於那些會把話講很死的人都感到懷疑，為什麼可以這麼篤定的說一定到哪或是幾點之後開始拉，並不是質疑他們的實力，而是會擔心很多人會因為他們的篤定直接開槓桿進去，結果受傷了
