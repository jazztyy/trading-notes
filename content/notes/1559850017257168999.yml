quiz:
  - q: 學員猶豫要不要把單子留到 CPI 公布，Kai 的建議是什麼？
    o:
      - 數據前全部平倉，等公布後再重新進場
      - 先加碼，數據方向對了才有大波段可吃
      - 掛一口反向單對鎖，數據出來後再解開
      - 會怕就先出幾口，或設能接受的移動停利
    a: 3
    e: Kai 說會怕的話可以先出幾口，不然就設個自己可以接受的移動停利點，並不是要全部平倉或加碼賭方向。
  - q: CPI 前 Alina 和 Shawnnnn 最後選擇空手，主要理由是什麼？
    o:
      - 位置夾在中間難判斷，數據爆拉爆跌才有空間
      - 30 分 K 已跌穿聰明錢藍框，空方已經確立
      - 盤中波動太小，進出的手續費會吃掉獲利
      - 1 小時 K 仍在上升通道內，多空方向不明
    a: 0
    e: Alina 說現在夾在中間、像在賭方向，數據公布後的爆拉爆跌比較有空間做；30 分 K 其實只是插針沒跌穿，1 小時 K 也已跌破上升框。
