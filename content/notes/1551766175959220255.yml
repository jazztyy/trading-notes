quiz:
  - q: 壓力突破後回測（壓轉撐），Alina 認為要怎樣才算成立？
    o:
      - 回測時量縮、沒有再往下殺就算成立
      - 只要收盤站上壓力線一次就算轉撐成立
      - 要撐住，最好帶量上；沒撐住就還是壓力
      - 回測不要碰到原本的壓力線才算成立
    a: 2
    e: Alina 說壓轉撐要撐住，沒撐住表示還是壓，而且最好有帶量上。
  - q: Shawnnnn 問「支撐轉壓力？」時，Alina 怎麼判斷這個位置？
    o:
      - 跌破過一次就一定變成壓力，不用再觀察
      - 要看 30 分 K 收盤才能決定
      - 只要沒出量跌破就還算支撐，不用擔心
      - 沒過就變壓力、挑戰失敗；有過會撐住回彈
    a: 3
    e: Alina 的判斷是看能不能過：沒過就變壓力，有過就會撐住回彈。
