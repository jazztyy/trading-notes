quiz:
  - q: Alina 週末復盤，檢討自己在日 K 大級別已經反轉時犯了什麼錯？
    o:
      - 太早順勢放空，被短線反彈軋出場
      - 只看日 K 不看小週期，錯過進場點
      - 心裡一直掛著往上目標，逆勢摸底
      - 停損設得太寬，單筆虧損超出預期
    a: 2
    e: Alina 說大級別都在反轉、小級別只是搶短多，她心裡卻一直想著往上的短多目標，結果逆勢摸底「鬼遮眼」。
  - q: Alina 提醒下單前要先想賺賠比，她當時對做多的評估是什麼？
    o:
      - 往上空間比往下大，所以適合做多
      - 往上只差幾百點，往下空間卻不只
      - 上下空間差不多，所以先空手觀望
      - 往下已經跌夠深，摸底賺賠比很高
    a: 1
    e: Alina 說仔細想想賺賠比，往上只差幾百點、往下卻不只，逆勢摸底並不划算。
