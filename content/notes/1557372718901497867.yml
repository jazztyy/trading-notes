summary: 10/7 下午台指沿著均線下跌：沿 5MA 走，跌破 15 分 200MA 後就沒有站回。Shawnnnn 說照線做很簡單，現在完全看不到止跌跡象。止跌有兩種：一是橫盤一段時間；二是區間內開始「跌少漲多」，也就是紅 K 比綠 K 多。之後回踩前段高點的位置可以試多單，他習慣看 5 分 K。若反彈上去又被打下來，一根紅 K 之後馬上又下來，代表還是空方強。Alina 則看到有打底的感覺，觀察會不會先去補缺口。
