quiz:
  - q: Shawnnnn 說的兩種止跌情況是哪兩種？
    o:
      - 出現兩根大紅 K，或 KD 黃金交叉
      - 跌到季線，或碰到布林下軌
      - 橫盤一段時間，或區間內開始漲多跌少
      - MACD 翻紅，或量能突然放大
    a: 2
    e: Shawnnnn 說一種是橫盤一段時間，另一種是漲多跌少（整個區間紅 K 比綠 K 多）；維尼問看到兩根大紅 K 就進，他說不是。
  - q: 出現止跌跡象後，依 Shawnnnn 的做法哪裡可以嘗試多單？
    o:
      - 回踩前段高點的位置
      - 第一根紅 K 出現時直接追
      - 跌破前低時抄底
      - 突破後的第 3 根 K 棒
    a: 0
    e: Shawnnnn 說漲多跌少後，回踩前段高點的地方都可以嘗試多單，他習慣看 5 分 K。
