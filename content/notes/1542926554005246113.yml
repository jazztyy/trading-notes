quiz:
  - q: 搶反彈單時，Shawnnnn 的停利態度是？
    o:
      - 搶反彈要抱到前高才出場
      - 停利不會看太遠，有賺就很爽了
      - 搶反彈一定要2R以上才值得做
      - 搶反彈不設停利，抱到反手訊號
    a: 1
    e: Shawnnnn 說搶反彈他不會看那麼遠，有賺就很爽；現在玩的話停利點也不會很大。
  - q: 激進派觀察白線準備掛單時，Shawnnnn 提醒什麼？
    o:
      - 提早先掛好等，避免價格來了來不及成交
      - 改用市價單直接追，不要等價格回到白線
      - 快到再掛；反彈很猛時可能要改掛EMA價位
      - 只要白線還沒上彎，就反過來改做多
    a: 2
    e: Shawnnnn 說還沒到先不要掛、快到再掛；反彈有時猛猛一根上去，那就要掛EMA那價位。
