quiz:
  - q: Alina 說多方要拿回局勢，需要滿足什麼條件？
    o:
      - 碰到綠色下降趨勢線就算，碰到即可接多
      - 突破綠色下降趨勢線後回踩站穩，否則只是反彈
      - 5 分K 連續三根紅K 收在布林中軌之上就算
      - 跌到 60 分K 下布林出現止跌K棒就算轉多
    a: 1
    e: Alina 說要突破過綠線、過完回踩穩才是拿回多方局勢，不然都只是反彈。
  - q: 這條下降趨勢線的位置，Alina 說大概可以參考什麼？
    o:
      - 60 分K 的上布林，但布林會動要記點位
      - 5 分K 的 EMA200，會隨價格一起移動
      - 日K 的月線位置，每天收盤後再更新一次
      - 1 小時 K 的前高連線，畫好之後就不用改
    a: 0
    e: Alina 說下降趨勢線大概參考 60 分K 的上布林（當時約 49187），並提醒布林會動，大概記這個點位就好。
