    time: "2026-08-29 11:38"
    text: 市場上會說每次的大跌就是財富重新分配，主要是因為你隨著大盤下修的股票不一定會隨著大盤上漲跟著上漲
quiz:
  - q: Shawnnnn 用虧損與回本報酬對照表想提醒什麼？
    o:
      - 虧損多少百分比，就只要賺回同樣的百分比
      - 只要大盤漲回來，個股就一定會跟著回本
      - 虧損超過30%之後，要打回來的難度就很高
      - 虧損越多，之後要回本反而會越容易
    a: 2
    e: Shawnnnn 說看表格就知道虧損超過30%之後要打回來的難易度很高，而且跟著大盤下修的股票不一定會跟著大盤漲回來。
