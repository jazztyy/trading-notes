quiz:
  - q: Alina 說的「雙線＋EMA200」，EMA200 要怎麼設？
    o:
      - 把 Shawnnnn 雙線裡的 EMA25 長度改成 200
      - 把雙線裡的 McGinley 白線長度改成 200
      - 另外多加一條 EMA，長度設成 200
      - 另外加一條 SMA，長度設成 200 即可
    a: 2
    e: Alina 說不是把 EMA25 改成 200，而是多加一條 EMA200：TradingView 搜尋 EMA 選第一個 Exponential moving average，長度改 200。
  - q: 依 Alina 的說法，EMA200 和雙線要怎麼搭配判斷多空？
    o:
      - 雙線在 EMA200 上方上穿做多，在下方下穿做空
      - 價格碰到 EMA200 就反向進場，雙線只看出場
      - 雙線下穿就做空，不必管價格在 EMA200 哪一側
      - EMA200 往上彎就做多，雙線交叉只是雜訊參考
    a: 0
    e: Alina 說 EMA200 是分 K 的多空分水嶺，雙線上穿在上做多、下穿在下做空，再搭配撐壓點位機器人的點位參考。
