summary: Annahui 問 Alina 的「雙線＋EMA200」是不是把 Shawnnnn 的 EMA25 改成 200。Alina 說不是，是另外多加一條 EMA200：在 TradingView 搜尋 EMA，選第一個 Exponential moving average，長度改成 200。EMA200 可以當分 K 的多空分水嶺，價格跌破它、雙線又下穿，就是走空方。tawpas 問怎麼知道多空界線在哪、多單跌破點位該不該停損，Alina 答用雙線判斷：EMA200 是多空分水嶺，雙線在上方上穿就做多、在下方下穿就做空，再搭配撐壓點位機器人算出的點位參考。維尼補充雙線就是 Shawnnnn 分享的那套。
