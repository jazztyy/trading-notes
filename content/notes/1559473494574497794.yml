quiz:
  - q: Alina 這次在 5 分K 進多的依據是什麼？
    o:
      - 價格跌到 EMA200 下方，出現長下影線止跌
      - 價格站上多空交界位，紅藍雙線看起來要交叉
      - 價格突破上方紅色壓力區，而且帶量收長紅
      - 1 分K 和 2 分K 趨勢都已經翻成偏多才進
    a: 1
    e: Alina 說價格站上交界、雙線看起來有要交叉的味道，所以在交界位附近做多。
  - q: 進多之後，Alina 預期價格在哪裡會出現反應？
    o:
      - 5 分K 上方第一個紅色壓力區的下緣
      - 回到下方藍色支撐區的上緣附近
      - 碰到 1 小時 K 的 EMA200 那條線
      - 前一天收盤價所在的整數關卡
    a: 0
    e: Alina 說 5 分K 第一個紅色區塊下緣碰到就會有反應；後來價格帶量撞過去，策略在今日壓力前觸發 TP1。
