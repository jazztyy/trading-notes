quiz:
  - q: Shawnnnn 雖然屬於右側交易，他對「突破」的進場方式是？
    o:
      - 突破當下立刻市價追進，避免錯過行情
      - 突破後連續第 3 根 K 棒再追進確認
      - 等日 K 連跌 5 根後才開始找多單
      - 不是突破就追，一定等回踩才進場
    a: 3
    e: Shawnnnn 說「我不是突破就追，我都是一定等回踩才會進」，也澄清自己不會追在第 3 根。
  - q: 依 Shawnnnn 自己的做法，趨勢轉變後的回踩他用什麼週期、掛在哪裡？
    o:
      - 用 2 分 K，掛在白線
      - 用 5 分 K，掛在藍線
      - 用 15 分 K，掛在均價線
      - 用 1 分 K，掛在前低
    a: 0
    e: Shawnnnn 說給維尼看的是 5 分 K，他自己是用 2 分 K，趨勢轉變後回踩「就是掛白線」。
