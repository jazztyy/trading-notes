quiz:
  - q: Alina 為什麼價格一跌破開盤價，就把多單全部出掉？
    o:
      - 開盤價要守，沒守就轉弱，且價格都在 EMA200 下
      - 跌破開盤價代表虧損已達 60 點停損，照紀律出場
      - 開盤價通常是當天低點，跌破代表當天會收長黑K
      - 跌破開盤價時成交量放大，代表主力正在倒貨出場
    a: 0
    e: Alina 說開盤價要守，沒守就弱了，而且當時價格都在 EMA200 之下，所以跌破開盤價就全部出場。
  - q: 雖然順勢看起來是空，Alina 對進空單的提醒是什麼？
    o:
      - 順勢就該立刻追空，晚了就會錯過整段跌幅
      - 要先等 1 小時 K 雙線死亡交叉才能開始空
      - 進空位置要等、要找好位置，避免空在地板
      - 先空一口試單，跌越深就越往下分批加碼
    a: 2
    e: 有人怕自己空在地板，Alina 說進空位置就要等、要找好位置，不是看到偏空就馬上追。
