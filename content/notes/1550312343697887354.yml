quiz:
  - q: nick_AJ 用什麼資料判斷 468-472 一帶壓力重重？
    o:
      - 前一日 K 棒的上影線很長，賣壓都在上面
      - 選擇權 T 字報價的未平倉，一堆人在上面賣
      - 三大法人期貨未平倉淨空單，外資在上面空
      - 均價線與月均線的位置
    a: 1
    e: nick_AJ 貼選擇權未平倉圖，說「OP 來看目前壓力位，468-472 壓力重重，一堆人在上面賣」。
  - q: Alina 說自己什麼情況下不太會做？
    o:
      - 價格剛好在點位附近時
      - 早盤開盤前 15 分鐘
      - 離點位太遠的時候
      - 週五結算日
    a: 2
    e: 她說「點位附近好抓筍，離點位太遠我就不太會」，所以傾向在點位附近進出。
