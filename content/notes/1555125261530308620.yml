quiz:
  - q: Shawnnnn 說看 2 分 K 的優缺點是？
    o:
      - 訊號比較少但比較準
      - 適合抱波段，不適合當沖
      - 進場機會多，但遇到洗盤被洗的次數也多
      - 跟 5 分 K 差不多，只是習慣問題
    a: 2
    e: Shawnnnn 說 2 分進場機會多，遇到洗盤被洗的次數也多，要有能耐遇到洗盤盡量別進場。
  - q: Alina 在 60 分 K 上怎麼找強撐位？
    o:
      - 找一堆插針的位置，表示主力有要守
      - 找成交量最小的 K 棒
      - 找 EMA200 與價格最近的點
      - 找連續三根紅 K 的起點
    a: 0
    e: Alina 說 60 分 K 一堆插針的位置是強撐位，表示主力有要守，要多可以在那個位置。
