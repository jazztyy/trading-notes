quiz:
  - q: Alina 持有封測族群時，現股和股期怎麼分工？
    o:
      - 全部用股期，資金效率比較高也方便進出
      - 股期長抱放著不動，現股拿來做短線進出
      - 現股和股期各半，互相避險降低波動風險
      - 現股可以放，有發動才打幾口股期，股期不放
    a: 3
    e: 她說「現股，有發動在打幾口股期」「現股才可以放，股期不敢」。
