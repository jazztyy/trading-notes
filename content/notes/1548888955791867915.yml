quiz:
  - q: Alina 的多單遇到她心中「不能破的關鍵位」被跌破，她怎麼處理？
    o:
      - 在關鍵位下方加碼，攤平多單的平均成本
      - 先不動，等下一個支撐位看會不會反彈
      - 沒收回去就視為多頭結構破壞，停損出場
      - 改看更大週期，大週期沒破就繼續抱
    a: 2
    e: Alina 說如果忙完發現沒收往上，就表示多頭結構破壞，她會停損。
  - q: Alina 每天抓壓力、交界、支撐後，怎麼決定做單？
    o:
      - 交界上偏空做、交界下偏多做，中間區間來回做
      - 交界上偏多、交界下偏空，點位附近進好抓停損
      - 只在壓力和支撐中間進場，成交機會最多
      - 不管交界，只看兩線訊號決定多空
    a: 1
    e: Alina 說交界上偏多做、交界下偏空做，點位附近進比較好抓停損，中間就是區間震盪。
