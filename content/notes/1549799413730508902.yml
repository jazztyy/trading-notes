quiz:
  - q: 夜盤急漲時，Shawnnnn 反手空一口的依據是什麼？
    o:
      - KD 高檔鈍化，MACD 翻綠
      - 成交量突然萎縮，判斷多方力竭
      - 價格到壓力、碰到月均線
      - 選擇權未平倉顯示上方賣壓重
    a: 2
    e: 他先說「到壓力囉」，再貼圖說「月均線到站」，才反手空，並且因為盤很強把停損設得很近。
  - q: Alina 為什麼覺得要空的話等日盤再看比較好？
    o:
      - 夜盤收高的話，日盤才好出貨
      - 夜盤量小，停損容易被掃
      - 日盤有法人進場，方向比較明確
      - 夜盤只能做多，日盤才適合做空
    a: 0
    e: Alina 說「感覺要空要日盤看看，夜盤收高，日盤就好出貨」；同時她也觀察 60 分 K 插針區的撐壓轉換。
