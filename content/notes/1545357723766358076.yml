quiz:
  - q: Alina 說明她順勢加倉的做法是？
    o:
      - 一開始就重倉進場，價格拉開後再分批出場
      - 先上單，點數拉開靠近線再加倉，並搭配訊號確認
      - 等價格突破前面的大壓力後，再一次追價加倉
      - 價格往不利方向走時往下攤平，拉低平均成本
    a: 1
    e: Alina 說「先上，點數拉開靠近線就加倉」，另外要搭配信號確認；她不是攤平虧損單，也不是等突破才追。
