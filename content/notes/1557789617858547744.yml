quiz:
  - q: 消息面急拉後，Alina 看到什麼才馬上放空？什麼情況她就不敢空？
    o:
      - 看到紅K帶量突破今日高才空；若量縮就不敢空
      - 看到那根紅K沒力留長上影；若沒針、下一根又帶量紅K就不敢
      - 看到雙線死亡交叉才空；若雙線還沒交叉就不敢空
      - 看到價格碰到 EMA200 就空；若站上 EMA200 就不敢空
    a: 1
    e: Alina 說她是看那根紅K沒力（留長上影）馬上空，如果那根沒有針、下一根又是有量紅K她就不敢了。
  - q: Alina 這筆空單偏空的理由和停損怎麼設？
    o:
      - 跌破前低就偏空，停損設在急拉那根紅K的最高點
      - 雙線死亡交叉就偏空，停損固定抓進場價上方 60 點
      - 日K 乖離過大就偏空，停損設在當天開盤價之上
      - 支撐站不回且在 EMA200 下就偏空，停損抓站回支撐
    a: 3
    e: Alina 說支撐沒站上、價格在 EMA200 之下她偏空看，停損自己抓站上支撐的位置。
