    time: "2026-09-14 15:57"
    text: 我絕對不強，你要看各路大神都可以~他們勝率應該很高或是目標價都預估的很準，只是說呢會覺得痛苦的點是你不會每次都跟到他的，因為你可能在忙，然後好不容易跟到的時候剛好是他輸的一次，你就會痛苦加倍~我也是以前愛看各路大神的，只是後面發覺好痛苦，他免費分享人很好可是他也在忙他不可能一直更新，你也不知道他到底走了沒，有的也不會跟你說他的防守點位，最後只留下自己在那懊惱到底要走了沒
