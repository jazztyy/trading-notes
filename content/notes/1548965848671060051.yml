summary: 討論部分喊單者不停損、區間無限放大（無限金幣凹單戰術）、不說多空；提醒有期貨分析師牌照還需簽投顧契約才能帶單，非法帶單可檢舉；Shawnnnn 提醒追隨大神的痛點是無法每次跟到、不知道何時出場，主張自己復盤。
