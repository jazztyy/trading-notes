quiz:
  - q: Shawnnnn 認為跟著各路大神的喊單做，最痛苦的地方是什麼？
    o:
      - 大神的勝率通常很低，跟著做大多數都會賠
      - 大神喊的點位太精準，掛單常常掛不到成交
      - 不會每次跟到，也不知道對方走了沒、防守在哪
      - 大神大多要收費，訂閱成本會吃掉大部分獲利
    a: 2
    e: Shawnnnn 說大神勝率可能很高，但你不會每次都跟到，對方也不一定更新、不說防守點位，最後只剩自己懊惱要不要走。
