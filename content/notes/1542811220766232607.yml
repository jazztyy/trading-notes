quiz:
  - q: Shawnnnn 對下午盤的操作態度是？
    o:
      - 波動不大，除非拉一段又下來、量也OK才進
      - 下午趨勢最穩定，是他最主要的進場時段
      - 下午只做空不做多，因為台指容易收低
      - 下午一律用市價單追突破，抓尾盤行情
    a: 0
    e: Shawnnnn 說下午波動基本不大不太進場，除非拉一段上去有下來、量也OK；下午獲利抓50-60點就很不錯。
  - q: 被問到「影線沒碰到白線就不進場嗎？」時，Shawnnnn 怎麼回答？
    o:
      - 不用碰到，方向對就先進，停損抓前低就好
      - 碰到白線或EMA25才進，或掛兩者中間價
      - 只能等碰到EMA25才進，白線碰到不算數
      - 要連續兩根K棒碰到白線，確認支撐才進場
    a: 1
    e: Shawnnnn 說要碰到白線或EMA25，掛兩者中間的價格也可以，只要停損抓好該跑就跑。
