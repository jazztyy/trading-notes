quiz:
  - q: 雙線快要穿過 EMA200 時，依 Alina 的說法算不算黃金交叉？
    o:
      - 不算，要真正穿過才算，像 2 分K 那樣穿過
      - 算，雙線靠近 EMA200 就可以提前佈局做多
      - 算，只要其中一條線先穿過就已經成立了
      - 不算，要等日K 也黃金交叉才算數成立
    a: 0
    e: Alina 說穿過才是黃金交叉，並以 2 分K 雙線向上穿過 EMA200 為例；大級別都下穿 200 時，大級別 EMA200 的位置就是壓力。
  - q: Shawnnnn 說各週期看起來很混亂代表什麼？什麼時候比較好做？
    o:
      - 代表快要大漲，只要看 1 分K 找進場就好做
      - 代表趨勢反轉，以最小週期的方向為準才好做
      - 代表在震盪，30M、1H、4H、日K 同方向才好做
      - 代表指標失靈，換成看量價關係判斷才好做
    a: 2
    e: Shawnnnn 說大週期看趨勢、小週期看進場位置；各週期很混亂就代表在震盪，30M、1H、4H、日K 都同一方向時才比較好做。
