quiz:
  - q: 維尼以為月線在 47850，Alina 怎麼解釋月線的位置為什麼會變？
    o:
      - 月線是月 K 開盤價，每個月初會重新設定
      - 月線是日 K 的 20MA，會隨交易日往前滾動
      - 月線是週 K 的 20MA，每週結算後才會更新
      - 月線是 60 日均線，大約每一季調整一次
    a: 1
    e: Alina 說月線就是日 K 的 20MA，日子在過、20 個交易日的平均會一直滾動，所以才有扣抵值。
  - q: Alina 這次翻多後，為什麼特別設了智慧單？
    o:
      - 她每一筆單都固定會設智慧單當停損
      - 夜盤流動性比較差，限價單容易不成交
      - 月線已被實體 K 跌破，要先鎖住獲利
      - 盤勢太恐怖，理智告訴她不設會後悔
    a: 3
    e: Alina 說一般她都不設智慧單，這次是盤勢太恐怖、覺得不設會後悔，結果跌破時自動停損，避開了後面的大跌。
