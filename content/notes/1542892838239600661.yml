quiz:
  - q: 剛開盤時 Shawnnnn 為什麼不馬上進場？
    o:
      - 開盤前的掛單還沒成交完，價格還不準
      - 開盤震幅劇烈，兩條線還沒開容易被洗
      - 開盤成交量還太小，指標訊號不可靠
      - 要先等1小時K收完第一根才看方向
    a: 1
    e: Shawnnnn 說開盤一定會劇烈震幅，兩條線還沒開很大、平平的時候容易被洗，所以會等一段時間再看。
  - q: 線有點黏、但維尼問的位置停損很好抓時，Shawnnnn 怎麼建議？
    o:
      - 線黏就絕對不進場，停損再好抓也一樣
      - 停損小所以可以重倉進場，賺比較多
      - 有點黏，但停損好抓，可以試單看看
      - 改用市價追單進場，避免錯過這段
    a: 2
    e: Shawnnnn 說線有一點點黏，但那位置停損也算好抓，還可以試單看看。
