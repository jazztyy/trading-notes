quiz:
  - q: 有人在 60 分K 設「200T」，Alina 認為 200T 指的是什麼？
    o:
      - 60 分K 上 200 根的成交量均線
      - 聰明錢指標畫出的藍色支撐區塊
      - 換算到日線上的 200 日簡單均線
      - 就是她 TV 上設的 EMA200
    a: 3
    e: Alina 說如果沒理解錯，200T 就是她 TV 設定的 EMA200，nick_AJ 也覺得是一樣的。
  - q: 依 Alina 分享的均線檔案，35 週線、200 週線附近有什麼意義？
    o:
      - 價格突破這兩條線，代表短線將出現急漲
      - 這兩條線交叉時，就是長線多空翻轉的訊號
      - 價格急跌到附近時，會有長線買盤撐住
      - 價格跌破這兩條線，就該全數停損出場
    a: 2
    e: 檔案摘錄說股價急跌到 35 週線或 200 週線附近，是長線買盤抵抗的強支撐區；Alina 也說目前用「雙線 + EMA200 + 支撐壓力」就很好用。
