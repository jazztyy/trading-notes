quiz:
  - q: 對合晶這檔股票，Alina 建議用什麼方式買比較不會受傷？
    o:
      - 追紅 K 動能，突破就上
      - 等跌破十日線再撿便宜
      - 沿著五日線買綠 K
      - 突破布林上軌時追進
    a: 2
    e: Alina 說沿著五日線、買綠比較不會受傷，追動能容易受傷，她七月就是追動能死很慘。
  - q: 因為矽晶圓族群已連漲多天，Alina 提醒要注意什麼？
    o:
      - 資金輪動，追的話要看族群金流、手腳要快
      - 融資餘額過高，之後一定會大跌要避開
      - 族群已經過熱，應該直接反手放空
      - 法人一定會倒貨，漲多的股票不能碰
    a: 0
    e: Alina 說族群漲滿多天，可能要注意資金輪動，追的話要注意族群金流、手腳要快，或壓回守均線再買。
