quiz:
  - q: "Shawnnnn 怎麼決定當天用哪個週期？"
    o:
      - 固定只看7分K，不管盤勢都不換週期
      - 用7分K找方向進場、再用2分K出場
      - 前一天哪個週期賺錢，今天就用哪個
      - 開盤半小時、一小時後看哪個週期較有反應
    a: 3
    e: "Shawnnnn 短線會看1/2/5/7/15/30，開盤半小時、一小時後看那天哪個週期比較有反應；也提醒不要看7分進2分出。"
  - q: "用2分K、價格離白線還有段距離時，Shawnnnn 建議怎麼掛單？"
    o:
