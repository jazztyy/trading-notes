quiz:
  - q: 依 JJ 分享的布林通道當沖法，要用哪條線來判斷多空？
    o:
      - 15 分K布林上軌，突破上軌才確認多方
      - 1 分K布林中軌，站上中軌就追多進場
      - 15 分K布林中軌，站上中軌、拉回做多
      - 5 分K布林下軌，守住下軌就偏多看待
    a: 2
    e: JJ 說以 15 分K布林中軌為界看多空，站上中軌、拉回做多；Shawnnnn 也歸納為只要記 15 分K中軌當交界，1 分K只是進出場用。
  - q: Mikey 問改用 5 分K進出可不可以，依 JJ 的做法，出場要怎麼看？
    o:
      - 一律回到 15 分K中軌，跌破才出場
      - 用 5 分K進場，就看 5 分K的位置出
      - 進場用 5 分K，出場改看 1 分K寶塔線
      - 用 5 分K進場，碰到 15 分K上軌再出
    a: 1
    e: JJ 的原則是用哪個週期進場就用那個週期出場，例如 1 分K進就看 1 分K寶塔線停損停利，5 分K進就看 5 分K的位置出。
