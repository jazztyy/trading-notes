url: https://discord.com/channels/1542520115562545162/1542520116078583921/1562123411566895187
summary: JJ 分享前輩教的布林通道當沖法：15 分K以布林中軌為多空交界，站上中軌、拉回做多，一直在中軌之上代表多方勢沒被破壞，跌破中軌代表趨勢可能轉空，可以切到 1 分K靠近上軌做空。方向看完後用哪個週期進場就用那個週期出場，例如 1 分K碰下軌接多、快到上軌出，搭配寶塔線停利可以抱更久；用 5 分K進場就看 5 分K的位置出。貼著下軌往下卻沒跌破代表是有效支撐，多單守住、空單可先停利；JJ 也提醒他在上軌試空是逆勢單，用 1 分K進出也會比較頻繁，Shawnnnn 歸納為「只要記 15 分K的中軌當作交界」。
