quiz:
  - q: 依 Shawnnnn 的定義，什麼情況才算「站穩」130？
    o:
      - 價格一突破 130 就直接噴上去
      - 先突破 130，回測不跌破再往上
      - 價格在 130 上下來回洗了好幾次
      - 5 分 K 收在 130 之上一根就算
    a: 1
    e: Shawnnnn 說要先突破、回測不跌破再上去才算站穩，「直接噴出去哪叫站穩」。
  - q: 如果價格一直在那條線上下洗，99 建議怎麼做？
    o:
      - 在線上做多、線下做空來回賺
      - 縮小停損多試幾次
      - 不要進場，等明確有背離時再試單
      - 改用更小的 1 分 K 找進場點
    a: 2
    e: 99 說一直上下洗就不要進場，等明確背離再試單，不然會一直多空多空、幫營業員賺手續費。
