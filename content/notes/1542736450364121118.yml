quiz:
  - q: Shawnnnn 進場多用限價單而不用市價單，理由是什麼？
    o:
      - 限價單手續費比較便宜，長期能省成本
      - 怕市價單滑點太多，沒掛到就算了
      - 限價單成交速度比市價快，不怕追不到
      - 市價單在夜盤無法使用，只能掛限價
    a: 1
    e: Shawnnnn 說不太用市價是怕滑點太多，有掛到就掛到、沒有就算了，因為2分K的機會很多。
  - q: Shawnnnn 出場停利的習慣是？
    o:
      - 所有口數都抱到出現反手訊號才一起出場
      - 第一口固定賺150點出場，其餘抱到600點
      - 第一單先賺80-100點，其餘抓當日前高前低
      - 每口都固定50點停利，不看當日前高前低
    a: 2
    e: Shawnnnn 說第一單喜歡先賺80-100點讓自己安心，後面的抓當日前高或前低；150/330/600是帝王策略的分層方式。
