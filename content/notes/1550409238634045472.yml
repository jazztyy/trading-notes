quiz:
  - q: 依 Shawnnnn 的說法，什麼情況下才需要檢討是不是策略有問題？
    o:
      - 連續虧損三筆以上時
      - 不凹單還是賠的時候
      - 勝率低於五成的時候
      - 單筆停損超過 100 點時
    a: 1
    e: 他說把凹單的筆數拿走績效基本上都會大幅提升，「如果你不凹單還是賠，那才要考慮是策略的問題還是你獲利都抱不住的問題」。
  - q: Shawnnnn 為什麼建議練習時微台最好只做一口？
    o:
      - 一口沒有加碼或攤平的機會，最好練停損
      - 一口手續費最低，比較容易累積出獲利
      - 一口才能用智慧單設停損停利
      - 一口比較容易吃到完整波段
    a: 0
    e: 他說「最好就是一口，不要有什麼加碼還是攤平的機會，一口是最好練停損的機會」，微台練穩才去小台。
