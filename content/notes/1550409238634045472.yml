    author: Shawnnnn
    teacher: true
    time: "2026-09-19 22:54"
    text: 如果你不凹單還是賠，那才要考慮是策略的問題還是你獲利都抱不住的問題
  - id: "1550882939007541329"
    author: wenwen0128.
    teacher: false
    time: "2026-09-19 22:55"
    text: 確實 要給個最大停損點 不能無限凹下去
  - id: "1550883163973230744"
    author: Shawnnnn
    teacher: true
    time: "2026-09-19 22:56"
    text: 你信不信今天有人專門報點位給你你還是會賺不到全程甚至還是虧損
  - id: "1550884315724783629"
    author: Shawnnnn
    teacher: true
    time: "2026-09-19 23:00"
    text: 我自己以前也是這樣呀，可能今天有人跟我說成本8000抱到10000，我自己認知覺得到9000我就覺得滿足我先跑，但下一筆成本8000他說抱到10000，但這筆先下去到6000在上來10000，我可能到6500我受不了先跑，負1500，這兩筆加起來我負500
