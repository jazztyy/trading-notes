quiz:
  - q: 討論 BOS 順勢、CHoCH 反向做時，ROCH 的看法是？
    o:
      - CHoCH 比 BOS 可信，反向做勝率較高
      - 兩個都很準，可以直接當進場訊號
      - BOS 比 CHoCH 可信，BOS 就是順勢
      - 兩個都沒用，完全不該看
    a: 2
    e: ROCH 說他覺得 BOS 比 CHoCH 可信，BOS 就是順勢；CHI 補充這類只是輔助性質。
  - q: Alina 為什麼不把 BOS、CHoCH 這類指標當判斷關鍵？
    o:
      - 因為只適用於日 K，不適用於 2 分 K
      - 有滯後性，資訊太多反而影響判斷，她比較喜歡關鍵位
      - 因為 TradingView 上要付費才能使用
      - 因為它和兩線策略的訊號完全相反
    a: 1
    e: Alina 說這類指標有滯後性，大概參考就好，太多資訊反而影響判斷；她比較喜歡關鍵位，看量能跟裸 K 可能還好點。
