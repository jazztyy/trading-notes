quiz:
  - q: Doobe 擔心三角收斂後會突然來一根大的，Alina 怎麼回答？
    o:
      - 不會，收斂代表沒量，之後會繼續窄幅震盪
      - 會，而且收斂後大 K 幾乎都是往上突破
      - 會，但事先不知道往上還是往下突破
      - 不一定，要看收斂時間夠不夠長才會發動
    a: 2
    e: Alina 說收斂後會來一根大 K，只是往上往下不知道；她只提到最近幾次收斂都往下。
  - q: 遇到三角收斂，Alina 認為最安全的做法是？
    o:
      - 先在收斂下緣掛多單，跌破再停損反手
      - 依最近幾次收斂的方向，先試一口單
      - 收斂兩邊各掛一張突破單，等觸價成交
      - 空手等方向出來，再順著方向進場操作
    a: 3
    e: Alina 說安全點就是空手，等方向出來再順勢；她雖然依最近收斂結果試空一口遠月，但那不是最安全的做法。
