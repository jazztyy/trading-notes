quiz:
  - q: 在 Alina 的流程裡，二線和 EMA200 貼得很近代表什麼？
    o:
      - 即將噴出，應該提前布局
      - 是最好的進場點，停損最小
      - 偏多格局，可以找低點做多
      - 多空還不明
    a: 3
    e: 她說二線上穿 EMA200 看多、下穿看空，「很貼就是多空還不明」。
  - q: Alina 用什麼來確認整體趨勢的多空？
    o:
      - 30 分 K 參數加八弟儀表板
      - 日內三個點位的交界加 EMA200
      - 選擇權未平倉加三大法人籌碼
      - 成交量均線加 1 小時 K 方向
    a: 0
    e: 她的流程是先抓日內三點位、用二線加 EMA200 判斷進場點，再用 30 分 K 參數和八弟儀表板確認整體趨勢多空，避免逆勢和亂凹。
