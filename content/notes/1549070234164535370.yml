quiz:
  - q: Shawnnnn 說現在做多好防守，但如果覺得價格離前低很遠，他建議怎麼做？
    o:
      - 等更好的價格再進也 OK
      - 直接進場，停損設在前低下方即可
      - 先進一半，離前低近再補另一半
      - 改做空單，等回到前低再翻多
    a: 0
    e: Shawnnnn 說前低就在那很好守，如果覺得現在離前低很遠，那就等更好的價格再進也 OK。
  - q: Shawnnnn 分享的另一個簡單觀察是看什麼？
    o:
      - 日 K 成交量連續三天放大，代表要轉向
      - 日 K 連續幾根綠 K，連五根的機率很低
      - 日 K 連續三次測試同一個低點沒破
      - 2 分 K 連續幾根紅 K，連五根就要反轉
    a: 1
    e: Shawnnnn 說可以觀察日 K 有幾根綠 K，當時是第四根，發生連續五根的機率很低。
