quiz:
  - q: Alina 空在壓力位時為什麼用限價單？
    o:
      - 限價單手續費比市價單便宜，成本較低
      - 可以避免急拉時被系統強制平倉出場
      - 市價單在夜盤不能用，只能掛限價單
      - 遲疑一秒都會變燃料，先掛好就不會錯過
    a: 3
    e: Alina 說「遲疑一秒都是燃料」，她怕變燃料，所以抓 TV 5 分壓力先掛限價試空。
  - q: Alina 空到壓力回落後，為什麼很快就回補？
    o:
      - 本來只想吃碰壓回落那段，往下都可能回彈
      - 因為價格已經碰到她事先設好的停損點
      - 因為空單不能留過夜，收盤前要先平掉
      - 因為 MACD 翻正，代表空方力道結束
    a: 0
    e: 她說本來就是想吃碰壓被壓回的豆腐，往下碰到的都是可能回彈的位置，所以不賭、快回補。
