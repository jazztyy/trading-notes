    text: 還有如果我固定停損-50點，今天可以讓我連續虧損4筆沒問題的，但我剛剛凹單-200我一筆就沒了，但我說過我自己統計這勝率大概7成爛一點打個8折5成6我時常連續虧4筆的機率是很低的
