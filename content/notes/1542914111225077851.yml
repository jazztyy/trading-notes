    text: 然後時常拉一個下引線給你希望然後在送你下去
quiz:
  - q: 突然大量灌一根、直接衝破停損位時，Shawnnnn 會怎麼做？
    o:
      - 等下一根K棒收完看會不會反彈
      - 先加碼攤平成本
      - 果斷停損，不去賭會不會馬上拉回
      - 移動停損到更遠的前低
    a: 2
    e: Shawnnnn 說他會果斷停損，不想去賭會拉回還是繼續下去，那是僥倖心態、不健康。
  - q: 依 Shawnnnn 的說法，凹單除了虧錢還有什麼缺點？
    o:
      - 浪費等待中的交易機會，凹回來也只想賣在成本
      - 進出次數變多，手續費和交易稅會跟著變高
      - 會讓勝率統計失真，但其實對獲利沒什麼影響
      - 凹單只要有找到利多消息撐腰就沒有缺點
    a: 0
    e: Shawnnnn 說凹單浪費的不只金錢，還有中間的交易機會；凹成功時心裡只想趕快在成本價跑掉。
