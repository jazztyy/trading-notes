summary: 遇暴衝穿過停損應果斷停損，不賭反彈；凹單心理(找利多安慰、越凹越想回本)會錯過機會，凹成功也只想賣在成本；固定停損50點可承受連虧4筆，勝率7成下連虧機率低；低於5成勝率才需思考賺賠比，短打更重停損紀律；可使用智慧單。
