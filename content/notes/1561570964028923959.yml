quiz:
  - q: 價格從下方碰到 5 分 K 的 EMA200 時，Alina 怎麼判斷算不算站上？
    o:
      - 盤中只要一碰到 EMA200，就算站上了
      - 連續三根 K 棒都在線上，才算站上
      - 看站上那根 K 棒的實體收上和量能
      - 等 15 分 K 也站上 EMA200 才算數
    a: 2
    e: Alina 說價格在下方時 EMA200 會先壓，要看站上的 K 棒和量；之後也強調要實體 K 收在 200ma 之上才算數。
  - q: 21:40 一根長黑回測 5 分 EMA200 後撐住，Alina 怎麼判斷？
    o:
      - 回測沒破是誘空長相，這裡要進多
      - 長黑帶量代表空方轉強，應該追空
      - 方向不明，先等 EMA200 跌破再說
      - 等 K 棒站回前高確認後，才進多單
    a: 0
    e: Alina 說 200ma 撐住、覺得是誘空長相，這種長相要進多，在 200ma 做比較安全；Kai 也指出 19:35 有一樣的回測沒破後上漲。
