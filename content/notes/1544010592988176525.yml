quiz:
  - q: 夜盤一直盤整時，nick_AJ 的做法獲得 Shawnnnn 肯定，他是怎麼做的？
    o:
      - 看不出方向的盤整區不做，等回踩後才進場
      - 在盤整區上下緣來回做多做空，賺區間價差
      - 1號大K棒出現時立刻追進，搶突破第一段
      - 每次反彈都進場試一口，避免錯過行情
    a: 0
    e: nick_AJ 看不出方向的盤整區都沒做，2號圈回踩後才進；看到行情沒跟到但不符標準就作罷，Shawnnnn 說心態很正確。
