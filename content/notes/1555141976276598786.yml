quiz:
  - q: 維尼看到 MACD 轉綠想做多，但 Shawnnnn 判斷多單「被壓制」時是看什麼？
    o:
      - 5 分 K 的 MACD 是否在零軸之上
      - 布林通道上軌有沒有被突破
      - 30 分或 1 小時的線有沒有壓在上方
      - 當天均價線和開盤價的距離
    a: 2
    e: Shawnnnn 說壓制「就是看 30M 或 1 小時的線」，被壓住時不要亂多；MACD 顏色多空大家定義還不一樣。
  - q: 對於同時看布林、均線壓力、MACD、兩條線和裸 K，Shawnnnn 的看法是？
    o:
      - 指標越多越能互相確認，勝率會越高
      - 還沒穩定前不要同時看那麼多，先選順手的
      - 只要 MACD 和兩條線同向就可以無腦進場
      - 新手應該先學布林，再慢慢加入其他指標
    a: 1
    e: Shawnnnn 說還沒穩定前不可能同時看那麼多，Alina 也補充策略會互相打架；要選自己操作起來舒服的方法。
