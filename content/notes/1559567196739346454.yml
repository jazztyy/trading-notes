quiz:
  - q: Alina 多單有獲利後，為什麼改用對鎖，而不是平倉再掛空？
    o:
      - 對鎖的手續費比平倉再進場便宜很多
      - 對鎖先保住獲利，可以用平常心看方向
      - 她確定會反轉向下，對鎖可以多賺空單
      - 平倉後就不能再掛空，只能用對鎖代替
    a: 1
    e: Alina 說原本要平倉再掛空，後來改成對鎖先保利，這樣可以比較平常心看方向；她也承認自己是猜不出方向。
  - q: 關於對鎖的做法，nick_AJ 給了什麼建議？
    o:
      - 要開遠月合約來鎖，口數多用微台比較好調整
      - 用同月份合約反向對鎖，口數全換成小台操作
      - 對鎖只能用大台，微台流動性太差不適合用
      - 不必開新合約，直接把原本的多單掛停損即可
    a: 0
    e: nick_AJ 提醒對鎖要進遠月來鎖，並建議多用一些微台比較好操作；Alina 也說她小台遠近月都有時會再搭微台。
