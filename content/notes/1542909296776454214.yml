summary: 假設459進場，先設停損(抓前面引線約50點)、停利(引線附近70點)，在停損停利附近設價格警示，響了再回來看；盤整15-25分鐘(7-13根K)或白線往反方向彎就先離場，小損20-30點即可；TV不串券商，不顯示部位。
