  - id: "1542910189718478988"
    author: Shawnnnn
    teacher: true
    time: "2026-08-28 22:54"
    text: 停利停損附近掛個警示
  - id: "1542910217518317588"
    author: Shawnnnn
    teacher: true
    time: "2026-08-28 22:54"
    text: 警示響了回來看
  - id: "1542910240922673263"
    author: Shawnnnn
    teacher: true
    time: "2026-08-28 22:54"
    text: 現在就做自己的事情
  - id: "1542910528320569496"
    author: Shawnnnn
    teacher: true
    time: "2026-08-28 22:55"
    text: 然後過個15-25分鐘都沒有警示那勢必就是在盤整2分K大概已經跑了7-13跟K棒了
  - id: "1542910588881997938"
    author: Shawnnnn
    teacher: true
    time: "2026-08-28 22:55"
    text: 有時候你會發現白線慢慢往你做的反方向彎了
  - id: "1542910602970796112"
    author: Shawnnnn
    teacher: true
    time: "2026-08-28 22:55"
    text: 那你就先離場
  - id: "1542910643231920259"
    author: Shawnnnn
    teacher: true
    time: "2026-08-28 22:56"
    text: 也不用一定要到40點停損
  - id: "1542910670230659184"
    author: Shawnnnn
    teacher: true
    time: "2026-08-28 22:56"
    text: 可能小損個20-30點而已
  - id: "1542910688706568212"
    author: Shawnnnn
    teacher: true
    time: "2026-08-28 22:56"
    text: 不會痛的
