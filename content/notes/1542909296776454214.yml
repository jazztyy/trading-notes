  - id: "1542909646376009801"
    author: Shawnnnn
    teacher: true
    time: "2026-08-28 22:52"
    text: 我就抓前面比較多引線的地方大概50點
  - id: "1542909775736610959"
    author: Shawnnnn
    teacher: true
    time: "2026-08-28 22:52"
    text: 停利我就抓前面引線附近70點
  - id: "1542910137344466974"
    author: Shawnnnn
    teacher: true
    time: "2026-08-28 22:54"
    text: 然後現在就是讓他跑
  - id: "1542910156222763219"
    author: Shawnnnn
    teacher: true
    time: "2026-08-28 22:54"
    text: ""
    images:
      - src: /img/1542910156222763219-image.jpg
