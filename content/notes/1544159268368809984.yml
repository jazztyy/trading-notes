quiz:
  - q: 遇到開盤爆大量時，Shawnnnn 的態度是？
    o:
      - 爆量代表方向明確，要加大口數追進
      - 爆量時一律不交易
      - 會保守一些，觀察是否可能回測比較深
      - 爆量後一定反轉，要反向操作
    a: 2
    e: Shawnnnn 說爆量方向會比較明顯，但已經爆那麼大量就會觀察是否回測深一點，所以會保守一些。
  - q: Shawnnnn 怎麼觀察當天是否爆量？
    o:
      - 看2分K開盤第一根的成交量是否特別大
      - 開盤一小時後看1小時K，和前幾天同時段比
      - 看前一天夜盤總成交量，跟平常比較
      - 看日線成交量是否超過5日均量來判斷
    a: 1
    e: Shawnnnn 說開盤後一小時他會去看1小時K，跟過去幾天開盤的量比較。
