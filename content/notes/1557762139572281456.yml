quiz:
  - q: Shawnnnn 為什麼說往上補缺口的壓力很大？
    o:
      - 缺口位置剛好是前一天的最高點，套牢賣壓重
      - 日K 已經連漲多天，量能明顯開始萎縮
      - 5 分K 已經跌破 EMA200，短線轉為偏空
      - 缺口位置同時有 60 分K 的 20MA 壓著
    a: 3
    e: Shawnnnn 說要站穩 5 分 200MA 才能去補缺口，但缺口那裡還有 60 分K 的 20MA，所以壓力很大，Alina 也同意「所以都被壓著」。
  - q: 有人問現在能不能追多，Alina 的做法是什麼？
    o:
      - 先小口追進，跌破 5 分 EMA200 再停損出場
      - 改看 1 分K，找到 EMA 黃金交叉就追進
      - 等站上缺口、突破 60 分 20MA 才追多
      - 這位置離停損點太遠不判斷，等回踩再進
    a: 3
    e: Alina 說現在這個位置停損抓得很遠、她不會判斷，所以等回踩再進，不在離停損很遠的地方追。
