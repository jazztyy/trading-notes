quiz:
  - q: Alina 為什麼說剛剛回測的交界位是漂亮的加碼位？
    o:
      - 價格跌破交界後馬上站回，代表剛剛是假跌破
      - 交界位原本是壓力，突破後已經轉成支撐
      - 沒貫穿交界，又和 5 分 EMA200 重疊
      - 30 分 K 雙線剛黃金交叉，交界位在線上方
    a: 2
    e: Alina 指出價格下跌沒有貫穿交界位，而且那裡大概也是 5 分 K 的 EMA200，兩者重疊是雙重支撐。
