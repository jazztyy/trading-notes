quiz:
  - q: Alina 停損出場後為什麼反手做多？
    o:
      - 停損後情緒不甘心，想把虧損賺回來
      - 30 分 K 參數已經翻多，照訊號進場做多
      - 價格已經遠離交界，追強勢比較安全
      - 還在交界上，比較上下的風報比後加入多軍
    a: 3
    e: 她說「今天筍完反手多也是因為位置都在交界上」，看往上和往下的風報比才加入多軍；如果最後在交界站不穩就停損。
  - q: nick_AJ 說要先果斷進場再同步設損，Alina 補充了什麼條件？
    o:
      - 要看位置，很靠近壓力、離交界遠就保守一點
      - 一定要等 K 棒收盤確認後才能進場下單
      - 停損要設在進場價下方固定 50 點不變
      - 只有開盤第一根才適合果斷進場
    a: 0
    e: Alina 說「但要看當下位置，如果已經很靠近壓力離交界遠我就會保守一點」，要找離停損好抓的方向做，夾在中間容易被巴。
