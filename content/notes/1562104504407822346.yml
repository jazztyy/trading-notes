quiz:
  - q: 夜盤急拉衝過盤中說的壓力後，Alina 認為真正的大壓看哪裡？
    o:
      - 日 K 插針很多、密集出現上影線的地方
      - 盤中撐壓點位機器人算出的當日壓力
      - 5 分 K EMA200 和交界位重疊的地方
      - 前一天夜盤的最高點，也就是前高位置
    a: 0
    e: Alina 說最大的壓力還是日 K 插針很多的地方，例如 47400-47500 那一帶。
  - q: Shawnnnn 在 15 分 K 圈出的壓力，是依據什麼？
    o:
      - 斐波 0.618 回撤和整數關卡的重疊處
      - 前高和往下彎的長均線形成的壓力區
      - 成交量最大的價位和當日開盤價附近
      - 交界位和 EMA200 黃金交叉的位置
    a: 1
    e: Shawnnnn 在 15 分 K 圈出前高與下彎長均線形成的壓力，另外也標了 30 分 K W 底上方的壓力區。
