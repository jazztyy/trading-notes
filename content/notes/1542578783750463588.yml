quiz:
  - q: 進場後成本已經拉開、獲利約150點時，Shawnnnn 怎麼處理這張單？
    o:
      - 立刻全部停利出場，避免150點獲利回吐
      - 趁成本拉開加碼第二口，把部位放大
      - 已經拉出去就先放著，滿足停利也可以
      - 把停損移到進場價保本，之後就不再管它
    a: 2
    e: Shawnnnn 說賺了150點覺得已經拉出去就放著，但如果你滿足了停利也OK，停利方式你舒服就好。
  - q: 盤整中突然跳出一根大K棒時，Shawnnnn 建議怎麼做？
    o:
      - 立刻市價追進，避免錯過這段行情
      - 不要急，照說明書的方式等進場點
      - 反向操作，賭它很快會回到盤整區
      - 改看1小時K確認方向後再追價
    a: 1
    e: Shawnnnn 說盤整跳一根不要急，看說明書就知道怎麼進場；雖然有時會一直噴上去，那也沒轍。
