quiz:
  - q: 急跌後最後一根 K 棒只留很短的下影線，Shawnnnn 怎麼解讀？
    o:
      - 代表賣壓已經出盡，可以準備反手做多
      - 代表空方還是很強，但市場不能說得絕對
      - 代表多空打平，接下來大概會橫盤整理
      - 代表有大戶在低檔承接，跌勢即將結束
    a: 1
    e: Shawnnnn 說短下影線代表空方仍強，但市場沒辦法說死；Alina 也補充多方力量不夠、可以再多看幾根。
  - q: 依 Shawnnnn 的說法，什麼情況代表買方很強、很多人在低檔接？
    o:
      - 下影線很短，同時成交量明顯縮小
      - 收長黑 K，同時成交量明顯放大
      - 下影線很長，同時成交量又很大
      - 上影線很長，同時成交量又很大
    a: 2
    e: Shawnnnn 舉例 K 棒留下長下影線、量又很大時，代表買方很強、有很多人承接；短下影線則代表承接力道弱。
