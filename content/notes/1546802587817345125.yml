quiz:
  - q: 1 分、2 分 K 都在收斂、又沒什麼量時，Shawnnnn 建議怎麼做？
    o:
      - 收斂代表快變盤，先進場卡位等突破
      - 沒把握就等它跑出方向再做
      - 多空各掛一張，哪邊突破就留哪邊
      - 改看 30 分 K，用大週期的方向進場
    a: 1
    e: Shawnnnn 說現在沒啥量、1 分 2 分都在收斂，沒把握就等出方向再做，至少讓它跑個方向出來。
  - q: 收斂盤中如果只想賺個 20-30 點，依 Shawnnnn 的說法停損要怎麼抓？
    o:
      - 停損抓 60-70 點，給收斂盤足夠空間
      - 不設停損，等方向出來再處理
      - 碰到線做做看，停損抓 15-25 點就要走
      - 停損抓 5 點，一碰就出場
    a: 2
    e: Shawnnnn 說要賺 20-30 點可以碰到線就做做看，但停損也要抓個 15-25 點就要走。
