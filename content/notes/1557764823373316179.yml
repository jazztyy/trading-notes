quiz:
  - q: Alina 這次預掛多單的位置是依據什麼決定的？
    o:
      - 斐波那契回撤的 0.618 和 0.5 位置
      - 5 分K 的 EMA200 和前一波低點
      - 聰明錢指標畫出的藍色支撐區塊
      - 日K 缺口下緣和月線所在的位置
    a: 0
    e: Alina 參考斐波那契回撤，在 0.618 和 0.5 的位置都有預掛多單，結果 0.618 一次回測到位成交。
  - q: Shawnnnn 說「做空都來的很急走得也快」，Alina 的空單是怎麼處理的？
    o:
      - 抱到 0.618 位置再一次全平，吃滿整段跌幅
      - 不掛平倉單，改用移動停損讓獲利自己跑
      - 事先掛好平倉單分批平，不去貪更深的目標
      - 先轉成對鎖，等反彈確認之後再決定平不平
    a: 2
    e: Alina 空單事先掛單分批平倉，事後說「好險空單有掛平」；Shawnnnn 也提醒空單來得急走得快，有獲利要記得平。
