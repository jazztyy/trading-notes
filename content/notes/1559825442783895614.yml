quiz:
  - q: Alina 做多時防守藍色上升趨勢線，她設定的出場條件是什麼？
    o:
      - 價格一碰到藍線，就先減碼一半
      - 出現實體 K 跌破藍線才出場
      - 盤中插針跌破藍線就立刻出場
      - 跌破藍線後等反彈回測再出場
    a: 1
    e: Alina 說「守這根藍線，出現實體 K 跌破就出場」；碰線或插針不算，要 K 棒實體收到線下才離場。
  - q: 如果價格乖乖沿著上升通道走，Alina 打算怎麼做？
    o:
      - 在通道中間先空，賺回落到下緣的空間
      - 跌破通道下緣後再追空，目標看前低
      - 漲到通道上緣、接近今日壓力再來空
      - 續抱多單，等突破通道上緣再加碼
    a: 2
    e: Alina 說照通道走的話「到上面再來空」，也就是等到通道上緣、摸到壓力線附近再考慮做空。
