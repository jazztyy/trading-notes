quiz:
  - q: 遇到三角收斂時，Shawnnnn 建議怎麼進場？
    o:
      - 在收斂區內先試單，等突破再加碼
      - 不要急著下單，等出方向後的回踩再去試單
      - 一突破收斂區就馬上追價進場
      - 收斂時多空各掛一張，突破後砍掉反向單
    a: 1
    e: Shawnnnn 說三角收斂不要急著下單，看它出方向後的回踩去試試看，停損好設、勝率也會高一些。
  - q: 三角收斂突破回踩進場後，Shawnnnn 把停損設在哪裡？
    o:
      - 下方那條上升趨勢線
      - 收斂區的上緣
      - 這一段起漲的低點
      - 固定抓進場價下方 100 點
    a: 2
    e: 被問到是否設在上升趨勢線時，Shawnnnn 說他會設在起漲的低點，這樣大概 44 點而已。
