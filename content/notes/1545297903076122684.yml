quiz:
  - q: "Alina 三口多單是怎麼出場的？"
    o:
      - 到600一次全部平倉，三口同進同出比較單純
      - 先加碼到五口拉低成本，到650再一起全部平倉
      - 設保本後放著不管，等650停利單自動成交
      - 分批：600先平一口，650掛一口，剩下隨時跳車
    a: 3
    e: "Alina 三口中600先平一口、650再掛一口排隊，最後一口隨時跳車，是分批停利。"
