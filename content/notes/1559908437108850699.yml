quiz:
  - q: CPI 公布後先爆拉到 900 又急跌，Alina 仍決定追空，她的依據是什麼？
    o:
      - 爆拉到 900 卻站不穩，代表多方已經力竭
      - 上方壓力很大，而且已經跌破上升趨勢框
      - 數據偏空，消息面確定會繼續往下砸盤
      - 5 分 K 雙線剛死亡交叉，空方訊號出現
    a: 1
    e: Alina 說理智告訴她「壓力很大，而且破上升趨勢」，從破框起就想當空軍，所以半路追空。
  - q: 追空後價格又被凹上來，Alina 怎麼處理這筆空單？
    o:
      - 相信下跌趨勢沒變，續抱並在高點再加空
      - 停損出場後反手做多，跟著反彈往上做
      - 先減碼一半，剩下的停損移到前高上方
      - 反彈到成本附近就保本出場，等拉高再空
    a: 3
    e: Alina 說「上去換我保本出」，之後想等拉高再空；雖然 nick_AJ 認為往下的趨勢沒變，她並沒有硬抱或加空。
