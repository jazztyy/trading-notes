quiz:
  - q: "依 Shawnnnn 的說法，線「下彎再變平」代表什麼？要做多該等什麼？"
    o:
      - 代表空轉多；線一變平就可以直接進場做多
      - 代表空方還在；要等線上彎後的回踩再做多
      - 代表進入盤整；兩條線中間多空兩邊都能做
      - 代表多方力竭；應該順勢追空不用等回踩
    a: 1
    e: "Shawnnnn 說下彎再變平代表空方還在，真的要多要上彎，進場點是上彎後的回踩。"
  - q: "盤整時 Shawnnnn 怎麼看在兩條線中間掛單？"
    o:
      - 在兩條線中間掛單都OK，盤整適合短打
      - 盤整時完全不該掛單，要等方向明確再做
      - 只能掛在兩條線外側，等突破再順勢進場
      - 要改看30分K帝王訊號，2分K先不掛單
    a: 0
    e: "Shawnnnn 說在兩條線中間掛單都OK，現在盤整就適合短打。"
