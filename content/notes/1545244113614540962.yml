quiz:
  - q: "Shawnnnn 為什麼覺得緩跌比急跌還可怕？"
    o:
      - 緩跌會給人希望，再慢慢下去讓你凹單
      - 緩跌通常量縮，代表後面還會有大跌
      - 緩跌時指標會失靈，訊號都不準
      - 緩跌容易突然急拉，空單會被嘎
    a: 0
    e: "Shawnnnn 說緩跌會給大家一種希望，然後再下去慢慢讓你凹單。"
  - q: "Shawnnnn 怎麼比較順勢單和逆勢單？"
    o:
      - 順勢單勝率低但機會多；逆勢單要耐心等價、勝率較高
      - 兩者勝率其實差不多；差別只在個人習慣和盯盤時間
      - 順勢單要耐心等價、勝率較高；逆勢單勝率低但機會多
      - 逆勢單勝率較高；所以手癢想進場時可以多做逆勢單
    a: 2
    e: "Shawnnnn 說做順勢單要有耐心等待價格、勝率比較高；做逆勢單勝率比較低但進場機會多。"
