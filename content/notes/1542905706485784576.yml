quiz:
  - q: 關於白線和藍線，群組裡的說明何者正確？
    o:
      - 白線只用來做多，藍線只用來做空，不能混用
      - 白線激進、藍線保守，看線上彎做多、下彎做空
      - 白線較保守、藍線較激進，兩條都上彎才做多
      - 掛白線就是做多，掛藍線就是做空，不看方向
    a: 1
    e: ROCH 說白線是激進派、藍線相對保守；維尼補充要看上彎才能多，白線也能空，看趨勢方向。
  - q: 停利沒到、價格反向時，Shawnnnn 舉例停損可以怎麼抓？
    o:
      - 抓前面綠K最高價（約45點）或固定60點
      - 一律抓當日開盤價，跌破開盤價就出場
      - 抓到前低附近，約160點才停損出場
      - 等兩條線交叉、確認趨勢反轉後再停損出場
    a: 0
    e: Shawnnnn 說可以抓前面綠K的最高價，大概45點，或是固定點數60點都OK；160點是他原本想賺的停利。
