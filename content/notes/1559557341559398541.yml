quiz:
  - q: Alina 為什麼認為 845-883 這一帶的壓力很重？
    o:
      - 那裡是前一天的高點，上方有大量套牢賣壓
      - 那裡是聰明錢指標的紅色區塊，空方都在那等
      - 那裡是斐波那契 0.618 位置，通常會反轉向下
      - 那裡有 1 小時和十幾分K 的 EMA200 一起壓著
    a: 3
    e: Alina 說 845-883 有 1 小時跟十幾分K 的 200 壓著，所以壓力應該挺重，她先看那裡的反應。
  - q: 拿各週期 EMA200 當壓力參考時，Alina 認為哪一條的壓力比較強？
    o:
      - 2 分K 的 EMA200，因為反應最快最靈敏
      - 5 分K 的 EMA200，因為最常被大家使用
      - 1 小時 K 的 EMA200，衝過後下一關就看它
      - 10 分K 的 EMA200，因為最接近現在價格
    a: 2
    e: Alina 說 200 壓力線參考，1 小時的比較強，衝破 800 站穩後下一關就看它；凌晨反彈也正好碰到 1 小時 EMA200 的壓力。
