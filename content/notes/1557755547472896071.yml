quiz:
  - q: 關於支撐被踩的次數，Alina 怎麼決定要不要試單？
    o:
      - 踩越多次代表支撐越強，次數越多越適合加碼
      - 第一次踩容易假跌破，要等第二、三次踩穩才試
      - 第一次踩通常不會破，試單安全；踩多次就不一定試
      - 次數不重要，只要價格回到撐位就照常試單進場
    a: 2
    e: Alina 說支撐第一次踩通常不會爆，試單比較安全；被踩很多次她就不一定會試。
  - q: Alina 說她的進單原則是什麼？
    o:
      - 停損要好抓，在撐位進、破了就閃，免得凹太大
      - 等突破壓力確認後再追進，避免被假突破洗掉
      - 先小口試單，被套時往下攤平拉低成本再出場
      - 聰明錢指標出現紅色壓力時，直接反向放空進場
    a: 0
    e: Alina 在藍色撐位進是因為停損好抓、破了就閃，她說進單原則都要好抓停損，不然自己會凹太大。
