quiz:
  - q: 早盤被 30 分、1 小時的線壓住時，Shawnnnn 怎麼看？
    o:
      - 這裡要站穩，不然就繼續洗
      - 壓力在就直接放空
      - 不管壓力，直接追多
      - 改看 1 分 K 找突破
    a: 0
    e: Shawnnnn 說遇到 30M、1 小時的線壓住，這裡要站穩，不然就繼續洗，目標是過前高。
  - q: 價格到第一個壓力目標後，Shawnnnn 怎麼處理部位？
    o:
      - 全部平倉出場，當天就不再進場了
      - 加碼一口去追突破，停損設在壓力下
      - 先平一口，等衝上去回踩這壓力再進去試
      - 反手做空一口，賭這個壓力會擋住
    a: 2
    e: Shawnnnn 到目標先平一口，等衝上去回踩這個壓力時再進場嘗試。
