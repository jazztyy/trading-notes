quiz:
  - q: 常被洗的人，Shawnnnn 建議怎麼做單？
    o:
      - 改看 1 分 K 做單，進出場反應更快、停損更小
      - 只要價格突破前高壓力就立刻追進，不等回踩確認
      - 看 30 分 K 以上做單邊，上彎後再用短週期找點
      - 多空兩邊都做，降低單邊被洗的機率和停損次數
    a: 2
    e: Shawnnnn 說常被洗的人至少看 30 分 K 以上做單邊，等上彎再去短週期找進場點，因為沒等上彎遇到假突破就會受傷。
  - q: 不擅長多空交換做的人，Shawnnnn 建議怎麼搭配週期？
    o:
      - 30 分或 1 小時定多空，能看盤用 2 分 K、不能用 5 分 K
      - 先看 2 分 K 決定多空，再用 30 分 K 的線找進場點
      - 只看日 K 決定多空，進場也用日 K 的線，不看短週期
      - 先看 30 分定多空，能看盤用 5 分 K、不能看盤用 1 分 K
    a: 0
    e: Shawnnnn 建議先看 30 分鐘或 1 小時的趨勢決定做多做空，能看盤用 2 分 K 找進場點，不能看盤就用 5 分 K 之類。
