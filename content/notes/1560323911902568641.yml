    text: |-
      1.當懂得多頭排列的回測撐作多
      2.當懂得空頭排列的反彈壓作空
      以日線格局作多空方向
      60k15k作進場點
      以撐壓上下50點為停損
      突破或跌破作爲加碼點
      勝多賠少為原則
      遵守操作SOP
      你會是長期的贏家
