quiz:
  - q: nick_AJ 分享的操作 SOP 中，停損設在哪裡？
    o:
      - 進場價往反方向固定 100 點
      - 前一根 60K 的高低點再外推
      - 撐壓位置的上下 50 點
      - 日線格局的前高或前低之外
    a: 2
    e: SOP 寫「以撐壓上下 50 點為停損」，停損是跟著撐壓位置設，而不是固定點數或前高前低。
  - q: 依這份 SOP，多空方向和進場點分別看什麼週期？
    o:
      - 日線定方向，60K、15K 找進場
      - 60K 定方向，5K、1K 找進場
      - 週線定方向，日線、60K 找進場
      - 15K 定方向，日線突破時才進場
    a: 0
    e: SOP 寫「以日線格局作多空方向，60K、15K 作進場點」；多頭排列回測撐做多、空頭排列反彈壓做空。
