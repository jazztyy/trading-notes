quiz:
  - q: Alina 的日內撐壓算法，日高、日低、收盤取的是哪段時間的數據？
    o:
      - 前一天 15:00 到當天 13:45 的全盤
      - 只看夜盤 15:00 到隔天 5:00
      - 只看 8:45-13:45 的純日盤
      - 最近五個交易日的平均
    a: 2
    e: Alina 說「只看 8:45-13:45 的，就是純日盤的」，日盤收盤後就算出夜盤到隔日日盤適用的撐壓。
  - q: Shawnnnn 把公式寫成腳本回測後，對它的使用時機有什麼心得？
    o:
      - 震幅越大越準，盤整時訊號太雜就不要拿來用
      - 只適合股票，台指期波動太大所以參考性低
      - 只能在夜盤用，日盤要用前一天的資料重新計算
      - 震幅不大時好用，震幅大時可參考前幾天的交界撐壓
    a: 3
    e: Shawnnnn 說「在震幅不大的時候蠻好用的，震幅大一點的盤其實把前幾天的交界壓力支撐拿來參考也是不錯」。
