    text: |-
      我自己目前抓的日內撐壓點位算法是
      交界=(日高點+日低點+收盤x2)/4
      壓力=交界+0.75x(日高-日低）
      支撐=交界+0.75x(日高-日低）
      依據前一個交易日的日盤收盤結果推算
