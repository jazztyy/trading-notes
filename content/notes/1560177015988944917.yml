quiz:
  - q: Doobe 看到 KD 一路低檔鈍化、想抄底又沒把握，Alina 建議怎麼做？
    o:
      - 等 KD 脫離鈍化、黃金交叉後再進多
      - 要做多就用小分 K 的雙線判斷進出
      - 低檔鈍化就是見底訊號，可分批買進
      - 改看日 K 的 KD，日線轉強才可抄底
    a: 1
    e: Alina 建議要做多就看小分 K 的雙線判斷進出，至少心裡有依據；Kai 也提醒低點鈍化之後可能繼續鈍化，不能當成見底訊號。
  - q: Shawnnnn 檢討這種大波動行情，他說自己最後不敢做的原因是什麼？
    o:
      - 大波動時指標容易失真，所以不敢相信
      - 當時沒有盤前規劃，臨時不知怎麼下手
      - 怕被軋的心大過信任指標，所以不敢做
      - 資金都還卡在空單上，沒有餘力去做多
    a: 2
    e: Shawnnnn 說這種大波動應該看更小的週期去做，但「害怕被軋的心 > 信任指標的心」，最後就不敢做了。
