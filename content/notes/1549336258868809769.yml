quiz:
  - q: Alina 說的「灰色帶」是什麼？她在灰色帶怎麼設停損？
    o:
      - 價格剛突破壓力就確認轉多的區域，停損可以設小一點
      - 突破的壓力能否轉支撐、多空不明的雙巴帶，停損給大一點
      - 均線走平、價格來回整理的區間，停損固定抓 15 點
      - 日 K 跳空缺口所在的區間，停損設在缺口的另一側
    a: 1
    e: Alina 定義灰色帶是突破的壓力能不能有效轉為支撐、方向不明確的雙巴帶，因為好洗，她給的停損空間大一點。
