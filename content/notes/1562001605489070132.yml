quiz:
  - q: Shawnnnn 要 tawpas 答應下次進場前先做什麼？
    o:
      - 先在群裡問大家意見，多數同意再進
      - 先規劃好停損點位，再按計畫進場
      - 先看日 K 方向，只做順大趨勢的單
      - 先用一口試單，確定方向對了再加碼
    a: 1
    e: Shawnnnn 說沒人說得準，要 tawpas 進場前先規劃好停損點位；問大家意見的話，100 個人會給 100 種意見。
  - q: Shawnnnn 說自己為什麼做短單？
    o:
      - 短單手續費成本低，長期下來比較划算
      - 短單不用留倉，假日比較能夠安心休息
      - 波段看不遠，只看大概壓力支撐做短單
      - 短單勝率比較高，比波段更容易累積獲利
    a: 2
    e: Shawnnnn 說自己沒能力看那麼遠，只會看大概的壓力支撐，所以做短單；認清自己的缺點不是壞事。
