quiz:
  - q: tawpas 想把多口部位一次掛在單一價位平倉，Alina 建議怎麼做？
    o:
      - 全部掛在更高的價位，耐心等它漲上去
      - 先全部平掉，等回檔再重新進場加碼
      - 打散掛在不同價位，分批出場比較好
      - 留一口抱波段，其餘全部用市價出場
    a: 2
    e: Alina 建議多口分散掛在各個價位，才不會多口一起抱上抱下；漲上去沒賣到會 FOMO，下跌沒賣也會 FOMO。
