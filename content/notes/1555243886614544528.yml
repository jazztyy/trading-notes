quiz:
  - q: Shawnnnn 教單看 K 棒判斷趨勢，趨勢向上的結構是？
    o:
      - 漲跌幅度差不多、來回震盪
      - 跌多漲少，一路往下
      - 漲多跌少，一段一段往上
      - 每根都是長紅 K、沒有回檔
    a: 2
    e: Shawnnnn 說橘色是漲多跌少、紫色是跌多漲少，結構從跌多漲少變成漲多跌少就是趨勢開始轉變。
  - q: 看到結構開始改變、突破後出現回踩，Shawnnnn 怎麼看待？
    o:
      - 代表假突破，應該反手放空
      - 是一個機會，他會觀察看看
      - 趨勢已確定，直接加碼滿倉
      - 要等日 K 確認後才能考慮
    a: 1
    e: Shawnnnn 說「以前提到的突破後回踩就是一個機會我就會觀察看看」，但當時空方仍有優勢，不急著逆勢。
