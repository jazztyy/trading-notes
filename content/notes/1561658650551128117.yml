quiz:
  - q: Alina 用近月、遠月分工的原則是什麼？
    o:
      - 近月做短衝、遠月做趨勢，因為短衝需要流動性
      - 近月做趨勢、遠月做短衝，因為遠月波動比較大
      - 近月做多、遠月做空，兩邊對沖可以降低風險
      - 近月只做小台、遠月只做大台，分開控管保證金
    a: 0
    e: Alina 說「近月做短衝、遠月做趨勢」，短衝要有流動性，而遠月流動性比較差；所以她順勢短沖看近月，佈空單則用遠月。
  - q: JJ 的 10 月、11 月單都被套，Alina 認為最佳解是什麼？
    o:
      - 全部轉倉到 12 月，繼續抱到解套為止
      - 用選擇權做對沖，先把虧損鎖住再說
      - 趁低點再加碼攤平，把成本拉近市價
      - 找好位置減碼保本，不然也沒保證金加倉
    a: 3
    e: Alina 雖然提了轉倉 12 月，但說有好位置減碼保本才是最佳解，不然要加倉也不夠保證金；她自己不玩選擇權。
