summary: JJ 的 10 月空單和 11 月多單都被套，想等反彈全力佈 11 月空單。Alina 建議 10、11 月都卡的話可以改做 12 月（只是比較吃保證金）；10 月剩沒幾天，如果部位不打算減碼停損，就轉倉到 12 月。沒有要抱波段的話，差別只是開在不同月份，但遠月流動性比較差。她的原則是「近月做短衝、遠月做趨勢」，短衝需要流動性。不過最佳解還是找好位置減碼保本，不然也沒有保證金可以加倉。她不玩選擇權，用近遠月和小台、微台搭配。實際操作上，她順勢短沖看 10 月近月，要加空或佈空單就改用遠月，例如 10/20 收盤後計畫在 5 分 K EMA200 附近慢慢佈遠月空單，比較安全。
