  - q: Alina 抓出大範圍壓力、交界、支撐後，還在練習怎麼搭配使用？
    o:
      - 只看交界，其他兩個點位當參考
      - 配著一關一關的壓力支撐來看
      - 跟選擇權最大未平倉一起看
      - 只在夜盤開盤時使用
    a: 1
    e: 她說大範圍點位要「配著一關一關壓力支撐之類的，還在練習」。
