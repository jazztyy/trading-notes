quiz:
  - q: Shawnnnn 說 Alina 停損設得很大，Alina 為什麼敢設這麼寬？
    o:
      - 因為她只下一口微台，風險本來就小
      - 因為大範圍支撐離很遠，停損自然要放寬
      - 因為她是拿前面的獲利做擔保
      - 因為她判斷這單勝率很高，不會打到停損
    a: 2
