    text: 剛剛有夥伴私訊我說為什麼他很容易就打到保本，聊了一下之後才發現他一進場下單之後就會去設定保本的動作，一進場後上下2.30點跑都有可能，不太可能一進場就往上噴，所以我要跟大家說設定保本的動作是適用在價格有拉開的情況，例如拉開5.60點以上，才會去設定保本然後剩下的就讓他跑，如果繼續拉開那可能就可以設定至少獲利100點之類。
quiz:
  - q: Shawnnnn 認為什麼時候才適合設定保本？
    o:
      - 一進場就馬上設保本，避免任何虧損
      - 價格拉開 50-60 點以上才設保本
      - 價格拉開 10 點左右就設，越早越安全
      - 獲利到 100 點以上才第一次設保本
    a: 1
    e: Shawnnnn 說進場後上下 20-30 點都有可能，一進場就設保本容易被打到，要拉開 50-60 點以上才設，再拉開可設至少獲利 100 點。
