quiz:
  - q: nick_AJ 和 Alina 說的「短多長空」是指什麼情況？
    o:
      - 日線偏多但分 K 偏空，要等分 K 轉多再做多
      - 小週期轉多但大時區仍偏空，長趨勢還是空
      - 早盤偏多但夜盤偏空，日內要分開兩段操作
      - 近月偏多但遠月偏空，可以近多遠空做價差
    a: 1
    e: nick_AJ 指出 1-5 分 K 轉多，但大時區還是偏空、價格在多空線下方；Alina 補充短多、長趨勢還是空，半年線勢必還是要測。
  - q: 短多長空時，Alina 用什麼判斷能不能低接多單？
    o:
      - 價格要先站上半年線，才可以低接多單
      - 大時區全部翻多之後，才可以低接多單
      - 看回測時線有沒有彎下去，沒彎就能接
      - 看 1 分 K 有沒有出現 BUY，出現就接
    a: 2
    e: Alina 說看現在的回測狀況，線沒彎下去就可以低接多。
