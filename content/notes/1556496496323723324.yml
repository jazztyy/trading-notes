quiz:
  - q: Shawnnnn 拆解 Q 姊目標價的第一個算法是？
    o:
      - 日 K 高點加上回測低點，再除以 2
      - 日 K 高點減回測低點的差，乘 0.618 加回低點
      - 日 K 高點減回測低點的差，加上區間高點
      - 前一日收盤價加上當日振幅
    a: 2
    e: Shawnnnn 說是日 K 高點跟回測後低點相減（1316），加上區間高點（48946）得到目標價；Alina 指出這就是斐波延伸 2 倍。
  - q: 談到回檔位置時，Alina 的看法是？
    o:
      - 一定要等回到 0.382 才進場做多
      - 先守 0.618，回到 0.786 她就會進單
      - 跌破 0.618 代表目標價失效，不能做多
      - 斐波回檔不準，只看目標價就好
    a: 1
    e: Shawnnnn 認為踩 0.382 最好，Alina 說那是無腦多位置，應先守 0.618 為主，給她 0.786 就進單。
