    teacher: true
    time: "2026-09-03 11:47"
    text: 如果你會自己判斷壓力那可能就不會去做，但如果只看線做事就不會去管什麼壓力支撐，所以我才說有時候策略多不一定好也不一定壞，壞的地方就是有可能會打架矛盾導致少做單，好的話也有可能幫助你判斷該筆不能做或是逆勢做反向賺錢，市場沒有那麼的絕對，對我來說看的太多對我的操作會很不舒服，然後雖然我都說可以看各個周期，但千萬不要跳來跳去，一下看5一下看2一下看7，如果你有能耐那沒問題的!
