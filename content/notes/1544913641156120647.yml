quiz:
  - q: "Shawnnnn 雖然說可以看各週期，但特別提醒什麼？"
    o:
      - 週期越多越好，要全部週期對齊才進場
      - 只能看1分K，大週期的訊號都太慢了
      - 千萬不要跳來跳去，不要做7分看2分
      - 每天都要換一個新週期，避免被洗盤
    a: 2
    e: "他說可以看各週期，但千萬不要一下看5一下看2一下看7，所以不要做7分看2分。"
  - q: "關於同時用很多策略，Shawnnnn 的看法是？"
    o:
      - 策略越多越準，訊號互相確認一定要多加幾個
      - 策略多一定不好，會互相打架，只能留一個用
      - 只要把壓力支撐加進去，策略之間就不會矛盾
      - 不一定好壞，可能打架少做單，也可能幫忙過濾
    a: 3
    e: "Shawnnnn 說策略多可能互相矛盾導致少做單，也可能幫你判斷該筆不能做；他自己看太多會不舒服。"
