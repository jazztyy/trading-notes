quiz:
  - q: 依 ROCH 的解釋，固定停損50點時，獲利100點是幾R？
    o:
      - 0.5R
      - 1R
      - 2R
      - 5R
    a: 2
    e: ROCH 說固定停損50時盈利50是1R、盈利100就是2R，R是以停損點數為單位。
  - q: 被問到風報比時，Shawnnnn 怎麼說？
