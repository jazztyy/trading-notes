quiz:
  - q: "2分K下跌時出大量，群組怎麼解讀？"
    o:
      - 量大代表進入盤整，多空都先不要做
      - 出量代表有人在接，可以準備進場抄底
      - 出量後一定會有反彈，可以先搶反彈
      - 下跌放量是要下去的節奏，看不到支撐
    a: 3
    e: "ROCH 說這是要下去的節奏、下跌放量，Shawnnnn 也說現在很兇應該不會看到支撐；要支撐可能得大量加T Bar。"
  - q: "想找支撐時，Shawnnnn 建議看什麼？"
    o:
      - 日K的白線或藍線有沒有守
      - 2分K的前低有沒有被跌破
      - 成交量最大的那根K的低點
      - 15分K的紅線有沒有守住
    a: 0
    e: "Shawnnnn 說想看支撐可以去看日K的白線或藍線有沒有守；他的策略是順勢，逆勢摸底要停損。"
