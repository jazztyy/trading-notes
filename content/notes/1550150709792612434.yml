      Alina 的作品稍微優化版
      【日盤撐壓換算 + 量能均線 v10.1】
      依據前一個交易日「日盤」(08:45～13:45)的高、低、收，推算當日的壓力、交界、支撐三條參考線，並搭配量能均線判斷力道。
      ▍計算方式
      交界 ＝(日高 ＋ 日低 ＋ 收盤×2)÷ 4
      壓力 ＝ 收盤 ＋ 0.75 ×(日高 − 日低)
      支撐 ＝ 收盤 − 0.75 ×(日高 − 日低)
      ※ 壓力與支撐以「收盤價」為中心上下展開，交界則是加權平均，所以交界不一定落在壓力和支撐的正中間。
      ※ 以 9/7～9/21 實際資料驗算，11 天中有 10 天誤差在 ±25 點以內。

      ▍主要功能
      ・日盤收盤(13:45)後立刻換上新的一組撐壓，不必等夜盤或隔天開盤
      ・標籤自動切換「日盤／夜盤」，也可改成「今日／明日」或自訂文字，並標註計算來源日期
      ・換線處有垂直虛線分隔，舊的一組會變灰並截斷，避免新舊看混
      ・資訊表並列「目前」與「前一組」數值，並顯示現價與三條線的距離
      ・可開啟 ±N 點誤差帶，提醒撐壓是區間而不是精確價位
      ・成交量副圖：日、夜盤分開計算量能均線，爆量 K 棒以橘色標示
      ・警報：突破壓力、跌破支撐、站上／跌破交界、爆量
      ・另外提供「直接沿用」、「Floor Pivot」等公式可切換比較

      ▍使用注意
      ・請使用 60 分 K 以下的分鐘圖(2 分、5 分 K 最適合)，日 K 無法切出日盤資料
      ・預設時段是台指期日盤 08:45～13:45；用在加權指數或個股時，請到設定改成 09:00～13:30
      ・如果圖上沒有 13:45 那一根 K 棒，請取消勾選「含結束時間那一根 K 棒」
      ・每月結算日(第三個週三)有換月問題，當天算出的撐壓可能失真，指標會標示「⚠結算」
      ・撐壓線僅供參考，請搭配自己的進出場規則與風險控管使用

      目前仍是持續優化中的版本，歡迎大家使用並提供建議！共好!
