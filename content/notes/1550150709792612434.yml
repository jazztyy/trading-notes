      每日交界撐壓換算參數半成品，若有人可以優化更好就太棒了!!
      我自己目前抓的日內撐壓點位(指數&股票)算法邏輯是
      交界=(日高點+日低點+收盤x2)/4
      壓力=交界+0.75x(日高-日低）
      支撐=交界+0.75x(日高-日低）
      都是依據前一個交易日的日盤(8:45-13:45)收盤結果推算
