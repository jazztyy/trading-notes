quiz:
  - q: 價格黏在多空分水嶺、看不出要不要下穿時，Alina 怎麼看？
    o:
      - 容易多做多錯，改成上壓下撐的區間操作
      - 代表即將噴出，應提早押方向、順勢加碼
      - 以收盤在分水嶺上或下來決定當天多空
      - 分水嶺已失效，改看更小週期的均線方向
    a: 0
    e: Alina 說黏著看不出方向、這位置容易多做多錯，上有壓下有撐就區間來玩，要空可掛在壓力那。
