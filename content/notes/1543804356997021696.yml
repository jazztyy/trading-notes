quiz:
  - q: 還不太會進出場時，Shawnnnn 建議進出場週期怎麼搭配？
    o:
      - 什麼週期進就什麼週期出，如5分K進5分K出
      - 一律用1小時K進場，再用1分K找點出場
      - 用2分K進場、日線出場，讓獲利奔跑
      - 進出場週期無所謂，看當下盤感決定就好
    a: 0
    e: Shawnnnn 說還不熟就什麼週期進去什麼週期出來；厲害一點才做一小時進、5分K出這類搭配。
  - q: 1小時K是空方趨勢、價格反彈到紅圈處時，空手的人該怎麼做？依 Shawnnnn 的說法？
    o:
      - 上多車搶這段反彈，停損設在前低下方
      - 先多空各一口對沖，等方向出來再平倉
      - 有多單就加碼攤平，空手則等突破再追
      - 空手絕不上多車；有單可先收錢離場觀望
    a: 3
    e: Shawnnnn 說空手的話絕對不是上多車，有單就看要不要先收錢離場觀望，因為大趨勢向下。
