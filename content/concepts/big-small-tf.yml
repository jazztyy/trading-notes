slug: big-small-tf
title: 大週期定方向、小週期找進場
topic: 多週期判斷
order: 1
summary: 先用大週期（30 分K、1 小時以上）判斷趨勢，只做和它同方向的單；再到小週期（2、5 分K）等價格拉回線附近才進場。進場看哪個週期，出場就看同一個週期。
sections:
  - heading: 先只做一邊
    text:
      - 這是 Shawnnnn 給「多空多空做很累」的人的方法：先只做一邊。打開大週期的圖找出明顯的趨勢，只在那段趨勢裡，到小週期找同方向的進場點，勝率會高一些。大週期還在多頭上彎，就只在小週期找地方做多；是空方趨勢，就只找空。他的口訣是「大週期看趨勢，小週期看進場位置」。
      - 分工的道理在於：Shawnnnn 說週期越大的線一定越有支撐，不管套在平均線、布林還是其他技術指標都一樣，所以方向交給大週期判斷；小週期反應快、進場機會多，拿來抓位置。
    items:
      - 大週期：至少 30 分K 以上，最常用的是 1 小時K；日K 也可以拿來觀察。
      - 小週期：能看盤就用 2 分K 找進場點，不能一直看盤就用 5 分K 之類。
      - 適合的人：新手、常被洗的人、不擅長多空一直交換做的人。新手可以先用 1 小時看趨勢、2 分或 5 分K 做單邊的單。
      - 不一定要進單，對照大小週期觀察，本身也是一種練習。
    figures:
      - src: /img/1542733118111219752-image.jpg
        caption: 什麼叫明顯的趨勢：微台 1 小時K 上的紅色箭頭標出兩段下跌、一段上漲，每段白線和藍線都朝同一個方向走。Shawnnnn 的做法是只在這些時段裡，到 2 分K 找同方向的單。
        from: "1542732481499758663"
  - heading: 怎麼讀大週期的方向
    text:
      - 看大週期要看收完的完整 K 棒，不要被盤中還在跑的那根影響。多頭上彎時，看價格回落到線附近有沒有守住；守住了，就繼續只找多單。
      - 方向要等線真的彎了才算。Shawnnnn 提醒常被洗的人，用 30 分K 定方向時要等線上彎，再去短週期找進場；線還平的時候就進場，遇到假突破就會受傷。他也說這是給保守的人參考，手癢想先下單、而且有賺錢的話也沒關係。
    items:
      - 多頭上彎、回落有守住：只在小週期找多單。
      - 空方趨勢：反彈回到綠線或白線，可以視為反彈差不多結束，或是要開始震盪了。空手的人這時絕對不是上多車；手上有多單的，看要不要先收錢離場觀望。
      - 線走平：先不要搶，等它彎出方向。
      - 很洗：價格在兩條線之間上上下下、沒有明確方向。這時到 2 分K 一樣找得到位置，但停利停損要抓得比趨勢單小。
    figures:
      - src: /img/1543871492629069865-5C080FB4-D2A1-44E7-AD32-574E166B978A.jpg
        caption: 空方趨勢裡的反彈：微台 1 小時K 出現 SELL 之後一路往下，紅圈處一根長紅反彈碰到綠線。Shawnnnn 說這種位置空手絕對不上多車，有多單的可以考慮先收錢。
        from: "1543804356997021696"
      - src: /img/1547472908673224725-image.jpg
        caption: 線還平就進場會被假突破傷到：30 分K 綠線走平整理時（黃框），K 棒幾次往上穿，接著一根長黑殺下去。所以要等線真的彎了，再到短週期找進場。
        from: "1547413112620187709"
  - heading: 回到小週期等進場位置
    text:
      - 大週期給的是方向，不是進場點。Shawnnnn 的說法是「30 分的參數訊號，5 分看進場位置」：不能看到 5 分K 出訊號就進去。15 分K 翻多之後，也要等 5 分K 拉回到白線附近才進場，不是看到訊號就追。
      - 好的進場點通常是「拉回到線、線還朝原方向」。例如空方時，2 分K 反彈站回白線時掛空單，這時藍線、白線都還在下彎，勝率比較高。下殺一大段接盤整時不要急著下單，先看它往哪邊出；反彈碰到白線或 EMA 再開始嘗試，做多反過來。
      - 小週期和大週期方向相反時要特別小心。5 分K 已經轉空還想做多很危險；真的要做多，Shawnnnn 建議改看 15 分或 30 分K 的白線去掛單。Alina 補充可以參考推播機器人給的多空交界位，進場就要抓好防守位，並等 5 分K 收 K 確認。
    items:
      - 小週期兩條線還很黏時，就算回到白線，Shawnnnn 也不會進場（純看 5 分K、不看參數的情況）。
      - 2 分K 本身也會很洗：區間最高最低大約 135 點的盤整，Shawnnnn 不會想做，一來很累，二來時間磨很久不划算。
      - 2 分K 兩條線很黏的日子，能做的單就是不多，不要硬找。
    figures:
      - src: /img/1557407852602327122-image.jpg
        caption: 大週期翻多、小週期等回踩：左邊 15 分K 出現「平空進多」，右邊 5 分K 紅箭頭就是 15 分K 翻多的那一根。Shawnnnn 不追這根，而是等價格回到 5 分K 的白線（黃圈）再進場。
        from: "1557406069842509835"
      - src: /img/1542757361230553132-image.jpg
        caption: 2 分K 的好空點：下殺（黃色箭頭）後反彈到白線（紅圈），這時白線、藍線都還在下彎，在這裡掛空，之後又跌了約 120 點。
        from: "1542754406452305920"
  - heading: 出場看同一個週期
    text:
      - 還不太知道怎麼進出場的人，一開始就是什麼週期進去、什麼週期出來：5 分K 進就 5 分K 出。熟練之後才做搭配，例如 Shawnnnn 舉的 1 小時進、5 分K 出，但那只是進階的例子，不是新手的做法。
      - JJ 的說法一樣：用 1 分K 進場，就用 1 分K 的寶塔線停損停利；用 5 分K 進場，就看 5 分K 的位置出場。
    items:
      - 1 小時K 很洗時做的單，停利停損要比趨勢單小。
      - 停損方式可以自己選：C 姊是訊號出來就進，看 3 根 K 的表現決定要不要停損；也有人用跌破布林中線出場。Shawnnnn 的建議是選自己覺得合理的那一種，照著做。
  - heading: 換成別的工具也是同一套
    text:
      - 「大週期定多空、小週期找進場」不限於 Shawnnnn 的雙線。nick_AJ 轉貼一位期指前輩的操作 SOP，說它就是 Shawnnnn 的策略邏輯：以日線格局作多空方向，60 分和 15 分K 找進場點。
      - JJ 分享前輩教的布林通道當沖法，用 15 分K 的布林中軌當多空交界，再用 1 分K 進出。Shawnnnn 把它歸納成一句：「只要記 15 分K 的中軌當作交界。」
    items:
      - 期指前輩的 SOP：多頭排列回測支撐做多，空頭排列反彈到壓力做空；停損放在撐壓上下 50 點，突破或跌破時加碼；以勝多賠少為原則，遵守 SOP。
      - JJ 的布林做法：15 分K 站上中軌、拉回做多；一直在中軌之上，代表多方勢沒被破壞，拉回可以試接多。
      - 15 分K 跌破中軌，表示趨勢可能轉空，可以切到 1 分K，靠近上軌做空、碰到下軌停利；搭配寶塔線停利可以抱更久。
      - 價格貼著下軌往下卻一直沒破，代表是有效支撐：多單守住這個支撐，空單可以先停利。
      - 15 分K 還在中軌之上時去 1 分K 上軌試空，是逆勢單，JJ 自己也這樣提醒；用 1 分K 進出也會比較頻繁。
cautions:
  - 只看 5 分K 的參數訊號就進場，常常剛進去就被打下來；方向要回到 30 分K 確認。
  - 大小週期同時出訊號就追高，進場成本會很差；15 分K 翻多後要等 5 分K 拉回白線再進。
  - 大週期是空方趨勢時，空手看到反彈就去做多，是在做逆勢單。
