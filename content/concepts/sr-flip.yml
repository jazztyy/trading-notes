slug: sr-flip
title: 撐壓轉換與突破確認
topic: 撐壓點位
order: 3
summary: 碰到壓力先看量和 K 棒：帶量衝破就不空，衝破後軟掉回到壓力下才算假突破。壓力被突破後要守住才會變成支撐，沒守住就還是壓力；支撐跌破後反彈過不去就變壓力。還沒轉換好、方向不明的灰色帶要把停損放大，或乾脆不做。
sections:
  - heading: 碰到壓力先看反應
    text:
      - 價格走到算出來的壓力時，很多人第一個念頭是空。Alina 說這裡要「反人性思考」一下：先盯著那條線看 K 棒和量。帶量衝破，她就不敢空了；衝破之後軟掉、又回到壓力下面，才考慮要不要空，Shawnnnn 把這種情形叫假突破。帶量一根上去，就先算它突破。
      - 這種位置做多做空常常都不對，Shawnnnn 的建議是沒單的人就等待。他也提醒，離下一個關鍵價只剩五六十點時，不要為了吃那幾十點就貿然進場，他以前就是這樣吃停損；到了關鍵價也要看反應，有時候會直接往上噴。
    items:
      - 帶量衝破、站上：不空。
      - 衝破後軟掉、回到壓力下：假突破，才考慮空。
      - 還在線附近磨：看 K 棒和量，沒單就等。
    figures:
      - src: /img/1551407864181161986-image.jpg
        caption: 衝破就不空：K 棒一路往上推到今日壓力 47850（紅色粗線），最後一根實體站到線上。Alina 原本到壓力想空，看到「有衝破站上的感覺」就放棄，改成在 47850 這條線觀察 K 棒和量。
        from: "1551405045961203824"
  - heading: 壓轉撐要守住
    text:
      - 壓力被突破，不代表它已經變成支撐。價格回頭測這條線時要撐住，才算壓轉撐；沒撐住，表示它還是壓力。Alina 也說最好是帶量上去，如果看起來都是賣比較強，就要看後面的量能有沒有進來。
      - 判斷時也要看大一點的週期。那次 5 分K 回測看起來踩得很漂亮，Alina 小試了多單，但 Shawnnnn 提醒價格還是被 30 分K 的快線壓著；後來果然下穿，而且有出量。
    items:
      - 突破後回測守住：壓轉撐成立。
      - 突破時最好帶量；量沒進來的突破容易掉回來。
      - 回測時出量下穿：要警覺，壓轉撐失敗。
    figures:
      - src: /img/1551766468486496296-Screenshot_20260922_092546_TradingView.jpg
        caption: 壓轉撐的回測：台指 2 分K，開盤衝過紅色的日盤壓力 48523，之後一路回落到這條線上測試，nick_AJ 說這裡是壓轉撐、所以要撐住。這天後來出量下穿，壓轉撐失敗。
        from: "1551766175959220255"
  - heading: 撐轉壓看反彈過不過
    text:
      - 反過來也一樣。支撐被跌破之後，價格反彈回來測這條線：沒過，它就變成壓力，代表挑戰失敗；有過，它就會撐住、價格回彈。所以支撐跌破的當下還不用急著下結論，看反彈回來的那一次過不過。
    figures:
      - src: /img/1552532970471034954-image.jpg
        caption: 支撐轉壓力？微台 2 分K，紅框原本是下方的支撐區，價格跌破後反彈回到框裡。Shawnnnn 問這是不是撐轉壓，Alina 的判斷標準是：沒過就變壓力，有過就會撐住回彈。
        from: "1551766175959220255"
  - heading: 灰色帶：多空不明的雙巴區
    text:
      - Alina 自己定義了「灰色帶」：剛突破的壓力能不能有效轉成支撐還不確定，方向也還不明確的那段區域，白話說就是雙巴帶。在這裡多空都容易被洗，所以她會把停損空間給大一點；不想放大停損，就等它轉換完成再做。
    items:
      - 灰色帶裡停損放大，因為好洗。
      - 價格上去了卻沒有量能站穩，Alina 可能會在那附近想空。
    figures:
      - src: /img/1549363777798012958-image.jpg
        caption: 還在灰色帶：微台 2 分K，價格衝進 Shawnnnn 說的壓力帶（約 45728-45762，指標畫成紅色區塊）後在裡面橫盤，白線、紅線從下方跟上來。Shawnnnn 說要看有沒有撐住，突破的壓力還沒確認轉成支撐，就是 Alina 說的灰色帶。
        from: "1549336258868809769"
cautions:
  - 指數和權值股偏多時別亂空（Shawnnnn 舉的例子是聯發科創新高也沒走弱）；櫃買和加權不同步，常是在拉權值股，做個股要看櫃買。
  - 一碰到壓力就空、一突破就追，都是還沒等到確認；先看是守住、帶量衝破，還是軟掉回來。
  - 灰色帶停損給太小很容易被洗掉。
