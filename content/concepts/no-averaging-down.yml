slug: no-averaging-down
title: 停損紀律：不凹單、不攤平、不報復
topic: 交易心態
order: 1
summary: 凹單和報復性下單是毀滅的開始。Shawnnnn 說把凹單的交易拿掉，績效幾乎一定大幅提升；每一單當獨立事件、設好最大停損，價格穿過停損就走，用哪個週期進場就用哪個週期出場。
sections:
  - heading: 凹單是怎麼越凹越深的
    text:
      - Shawnnnn 用自己以前的經驗描述過凹單的心理：虧到 -70 點開始焦慮；價格回到原本預設的停損 -50 點時，又冒出「等等就要上去了」的念頭，於是繼續凹；接著去找利多消息安慰自己；跌到 -100、-200 點之後反而變輕鬆，因為開始催眠自己「下禮拜就上去」。他以前一口微台凹到 -25000 過，也曾經把 10000 點凹不見。
      - 凹單常常是在期待支撐反彈；到了支撐沒彈，又往下找下一個支撐，期待在那裡反彈。市場也常常拉一根下引線給你希望，然後再送你下去。
    items:
      - 浪費的不只是錢，還有凹單期間錯過的交易機會。
      - 凹回來了也只想賣在成本價趕快跑，根本賺不到錢。
      - 虧越深越心急，心急就打得更爛：-200 點要打到 +120 點要多久？
      - 固定停損 50 點時，凹一筆 -200 點就吃掉 4 筆停損的額度。
  - heading: 穿過停損就走
    text:
      - 遇到大量一根灌下來、直接衝破停損位，Shawnnnn 會果斷停損，不去賭它會不會馬上拉回；等反彈是僥倖心態，不健康。他的做法是短打，短打不用太在意賺賠比，但要非常在意停損紀律。他也舉蕭大為例：蕭大有時候進單也是用追的，但不對就走，停損超快；停損不果斷就會很慘。
    items:
      - 價格衝破停損位，立刻停損，不看反彈。
      - 每一單都設最大停損，不能無限凹下去。
      - 每一單當作獨立事件，不糾結上一單（Alina）。
      - 可以用智慧單讓停損自動執行（nick_AJ）。
  - heading: 用幾分K進場，就用幾分K出場
    text:
      - Shawnnnn 說參考其他策略沒問題，但週期混著看就會打架。看 2 分K 進場、已經跌到 2 分K 該走的位置，卻改去看 30 分K，發現快到 30 分K 的線就不走、期待反彈，有時候會成功，但這其實就是凹單。正確做法是 2 分K 該停損就停損；真的想做 30 分K，就在 30 分K 的線進場，一樣不對就走。
  - heading: 不報復，用微台一口練停損
    text:
      - Shawnnnn 以前虧損凹單後就會報復性下單，他說那就是毀滅的開始。把 10000 點凹不見之後，他花了大約兩個月變成「無情的看線機器人」，才有後來一個月 12000 點的成績。
      - 他也說，把凹單的交易筆數拿掉，績效基本上一定大幅提升；如果不凹單還是賠，才要考慮是策略的問題，還是獲利都抱不住的問題。抱不住的例子：兩筆一樣成本 8000、目標 10000，第一筆到 9000 就滿足先跑；第二筆先跌到 6000 再上 10000，卻在 6500 受不了停損，兩筆加起來反而虧 500。所以就算有人專門報點位，沒有內化成自己的東西，一樣可能賺不到全程甚至虧損。
    items:
      - 先用微台練穩，再去做小台。
      - 最好只做一口，沒有加碼、攤平的機會，是最好練停損的方式。
      - 不要頻繁交易，選有把握的位置進（Alina）。
      - 用 TradingView 的重播功能復盤，練習判斷；Shawnnnn 到現在沒事也會復盤。
cautions:
  - 價格回到原本的停損位時，最容易冒出「等等就上去」的念頭而繼續凹。
  - 拿大週期的線當不停損的藉口：2 分K 進場，卻改看 30 分K 等反彈。
  - 凹單常常是在期待支撐反彈，但到了支撐也可能繼續往下找下一個支撐。
