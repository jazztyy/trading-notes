slug: pullback-entry
title: 右側交易：等回踩再進場，不追
topic: 進場時機
order: 1
summary: Shawnnnn 是右側交易：突破或噴出之後不追，等價格回踩到線（白線、5 分K 均線、交界、壓力框）再進；進場前先看停損和出場位置好不好，不好就不進。
sections:
  - heading: 為什麼不追，要等回踩
    text:
      - Shawnnnn 是右側交易，但他強調自己「不是突破就追」，一定等回踩才進。噴出去只代表這個方向要開始關注；趨勢轉變之後第一次拉回到線上，才是他的進場點，不會在已經連噴好幾根之後追在第 3 根。
      - 原因是快速上漲或下跌一段之後，休息是正常的。Shawnnnn 提醒，現在不像去年到今年年初那種行情，看到噴就隨便進去都能吃一大段；追在噴出的末端，常常一進場就碰上休息的回檔。
    items:
      - 底部方向還不明時先空手，等它噴出來再開始關注。
      - 噴出時手上已經有單，nick_AJ 的做法是先獲利，再等回踩重新進。
      - 沒單就不要亂追，Shawnnnn 的說法是「有回踩都是機會」。
    figures:
      - src: /img/1555148521261506600-image.jpg
        caption: 事後看一整段：微台 5 分K 從 48400 附近噴到 48600 以上，藍圈是途中拉回碰白線的位置。Shawnnnn 等的是這種回踩，而不是在長紅後面追。
        from: "1555146991812616233"
  - heading: 回踩到哪裡進場
    text:
      - 回踩是回到線上，不是隨便跌一點就接。群組裡常用的位置有白線、5 分K 的均線、交界和壓力框，週期依各人習慣。Shawnnnn 自己用 2 分K，直接把單掛在白線等價格回來；分享給學員看時，他會換成大家常用的 5 分K。
      - Alina 比較看 5 分K 的線和交界：開盤開在交界之上、兩條線又都在 EMA200 之上，她就偏多看，價格沿著 5 分K 的 5MA 往上走時，回到線附近就是進場點；1 分K 也可以守著均線慢慢疊上去。她的心得是盡量在點位附近進場，比較好抓。
    items:
      - 2 分K：BUY 出現、趨勢轉變後，回踩白線就進，可以直接掛在白線上等（Shawnnnn）。
      - 1 分K：BUY 之後拉回碰到白線就進（Shawnnnn）。
      - 5 分K：雙線交叉、價格離交界很近時進（Alina）；沿 5MA 上行時，回到線附近再進。
      - 推播的壓力、支撐點位，也適合盤中拿來抓進場位置（Alina）。
    figures:
      - src: /img/1562021904104300654-image.jpg
        caption: 碰白線就進：Shawnnnn 的 1 分K，左下 BUY 出現後價格拉回，藍圈是 K 棒碰到白線的位置，他在這裡跟著 Alina 進多，之後一路往上。
        from: "1562015377754554409"
  - heading: 進場前先看出場位置
    text:
      - Shawnnnn 說：「進場的位置就要去看出場位置好不好，如果出場位置不好乾脆不要進。」也就是下單前先想好停損放哪、離目標還有多遠；算起來不划算，型態再漂亮也不進。
      - 回踩進場的好處，正是停損好放。Alina 碰白線進多時說得很清楚：5 分K 雙線剛交叉、價格離交界很近，停損距離短、好防守；反過來，如果價格遲遲站不上交界，她就出場，不會一直等下去。
    items:
      - 下單前先在圖上標好進場價、停損價和目標價，看停損距離能不能接受。
      - 回踩到線上進場，停損放在線或交界的另一邊，距離短、好判斷。
      - 價格遲遲站不上交界、走得跟預期不一樣，就先出場。
    figures:
      - src: /img/1555149760594317352-image.jpg
        caption: 先算好再進：Shawnnnn 的 2 分K 進場，BUY 之後在價格回踩白線的位置進多（左下藍圈），停損 60 點、目標 336 點，風險報酬比 5.6。紅色區塊是停損距離，綠色區塊是目標。
        from: "1555146991812616233"
  - heading: 做空也一樣：等反彈再空
    text:
      - 順勢做空的邏輯相同：不在低點追空，而是等價格反彈到壓力框或線再進。nick_AJ 的例子是 3 分K，白線已經在橘線下方，趨勢表 1 分到 4 小時也全部偏空，他還是等價格回踩到上方的壓力框才進空；之後就跟著線走，價格再反彈上去碰到壓力，還可以接著空。
      - 他也提醒，整體偏空的時候，做多只能當短多看。
    figures:
      - src: /img/1559929576375980212-Screenshot_20261014_220256_TradingView.jpg
        caption: 回踩壓力再空：台指期 3 分K 白線在橘線下方往下走，價格反彈到紫色壓力框（約 48560）時出現做空三角，nick_AJ 就是在這裡進空；右上趨勢表 1 分到 4 小時全部偏空。
        from: "1559929576375980212"
cautions:
  - 回踩沒來就算了，不給機會就不追。耐心是用來等正確方向的回踩；方向已經錯了還在「耐心等」，Shawnnnn 說那就變成凹單，該停損還是要停損。
  - 事後看圖，每一段好像都撿得到；Shawnnnn 說盤中捏不捏得住是另一回事，不要拿事後看到的完美進場來要求自己去追。
