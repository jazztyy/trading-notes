slug: pick-tf
title: 依當天盤勢選週期，洗盤時換週期
topic: 多週期判斷
order: 3
summary: 每天適合的週期不一樣：開盤半小時到一小時後，看哪個週期的線比較有反應就用哪個。盤很洗時換週期或把停利停損縮小，大波動行情改看更小的週期，並每天復盤記下當天適用的週期。
sections:
  - heading: 每天適合的週期不一樣
    text:
      - Shawnnnn 短線會看 1、2、5、7、15、30 分K，但不是固定只用一個，而是看那天盤勢哪個週期比較有反應。他建議開盤半小時到一小時後去觀察：不管當天有沒有進單，都可以想想目前哪個週期比較適用。像 7 分K 就是他以前把週期翻來翻去時，覺得特別有反應才開始看的，有一天他就說「今天是 7 分K 的局」。
      - 適用的週期每天都不同。同一天 Annahui 切到 7 分K、跟著白線掛單做到約 100 點，nick_AJ 卻覺得 7 分K 有點黏、一直黏著白線走；另一天 Shawnnnn 則觀察到 2 分K 碰綠線做的勝率比較好。
      - 要練出判斷哪個週期好用的能力，Shawnnnn 的方法是每天復盤：把當天的盤面截圖起來，看一下適用什麼 K，訓練到變成肌肉記憶，就是別人說的「盤感」。他自己平日至少復習 4 小時、假日至少 10 小時，筆記超過 3000 頁。
    items:
      - 常看的短線週期：1、2、5、7、15、30 分K。
      - 開盤半小時到一小時後，觀察當天哪個週期的線比較有反應，就用那個週期。
      - 選定之後用同一個週期進出。不要「看 7 分進、2 分出」，除非你已經很進階。
      - 7 分K 的線價格差異不會太大；用 2 分K 時如果價格離白線還有點距離，最好快到了再掛單。
      - 點位沒到不要追，跟著白線掛單、等球來再打。
    figures:
      - src: /img/1544609582062768189-image.jpg
        caption: 「7 分K 的局」：微台 7 分K 從開盤一路往下，反彈大多被壓在白線、綠線之下，兩條線一路下彎。Shawnnnn 那天就覺得 7 分K 特別好用。
        from: "1544609582062768189"
  - heading: 2 分K 還是 5 分K
    text:
      - Shawnnnn 習慣看 2 分K，Alina 和不少人主要看 5 分K，兩者沒有標準答案，Shawnnnn 的說法是「看你呀」。差別在於：2 分K 進場機會多，但遇到洗盤，被洗的次數也多，要有能耐在洗盤時盡量別進場。他也說 2 分K 很適合看殺深之後的反彈到哪裡結束，他喜歡這種位置做空。
      - 週期不同，同一時間看到的位置也不同。有一次學員看 5 分K 問碰白線能不能空，Shawnnnn 說 5 分還沒碰到白線要注意一點，而他看 2 分K 已經進場空了。所以問進場點時要先講清楚是看幾分K。
    items:
      - 2 分K：進場機會多、反應快，但洗盤時被洗的次數也多。
      - 5 分K：反應比 2 分K 慢，同一段走勢可能 2 分K 已經到點進場，5 分K 還沒碰到線。
      - Annahui 觀察到：兩條線拉得太開（乖離過大）時，反而要等一等再進。
    figures:
      - src: /img/1555131669600542761-image.jpg
        caption: 用 2 分K 看殺深後的反彈：微台 2 分K 急殺之後反彈，碰到白線（藍圈）就結束、繼續往下，這就是 Shawnnnn 喜歡的空點。
        from: "1555125261530308620"
  - heading: 盤很洗時換週期或縮小停利停損
    text:
      - Shawnnnn 復盤一個洗盤日時說，那天如果照 2 分K 策略進場，不是找不太到地方進場就是虧損。要先認知到今天的盤面就是洗；如果一定要出手，就得想辦法賺震盪盤的錢。他提出兩個方向，並說只是拋磚引玉，讓大家自己想想還有什麼方式。
    items:
      - 改看 1 分K：相較 2 分K，應該有比較多點位可以介入。
      - 照樣用 2 分K，但把停利停損抓小，例如 1:1，賺 40 點、賠 40 點試試看。
      - 不管用哪個方法，當天收盤後都把洗盤的圖截下來復盤，看哪個週期適用。
  - heading: 大波動看更小的週期
    text:
      - Shawnnnn 檢討一次急跌後的反彈：這種大波動行情本來應該看更小的週期去做，但「害怕被軋的心大於信任指標的心」，最後就不敢做了。
      - Alina 那次的做法是先看 1 分K：急跌後趨勢表上只有 1 分K 翻成偏多，5 分到 4 小時都還偏空；同時 15 分K 有守住日K 的上升趨勢線（雖然中間 5 分K 一度跌破）。之後 1 分K 上穿，她再等 2 分K 跟上、價格先在多空交界站穩。想在這種時候做多，就用小分K 的雙線判斷進出，至少心裡比較有個依據。
    items:
      - 順序：1 分K 先轉強 → 1 分K 上穿 → 等 2 分K 跟上 → 站穩多空交界。
      - 不要只因為 KD 低檔鈍化就抄底，Kai 提醒低點鈍化之後也可能繼續鈍化；要看小分K 雙線是不是真的轉多。
    figures:
      - src: /img/1560210574678171758-image.jpg
        caption: 急跌後先看 1 分K：小台 1 分K 止跌後雙線翻多、K 棒往上走，但右上趨勢表只有 1 分K 偏多，5 分到 4 小時都還偏空。Alina 這時只先看 1 分K，等 2 分K 跟上、站穩今日交界位（47133）再說。
        from: "1560177015988944917"
  - heading: 用 60 分K 找強撐和區間
    text:
      - 做短線時，Alina 也會用 60 分K 看大的支撐位置。60 分K 上一堆插針（長下影線）的地方，表示主力有要守，像一隻無形的手在撐；上面頭頂也會有無形的手在壓。要做多可以在強撐位附近做，兩條線之間的區間也可以來回做。
      - 區間一旦跌破，就會跑到下一個區間。Shawnnnn 的看法是把兩個大區間框出來：上面那個區間跌破基本上就很醜，可能要下去整理更久，除非有事件，不然需要時間。
    items:
      - 強撐位：60 分K 大量插針的位置，主力在守。
      - 區間：上下兩條線之間可以做；跌破下緣就往下一個區間看。
      - 空單成本不好的人要小心強撐位，怕又一根拉上去。
    figures:
      - src: /img/1555137123663749172-IMG_3562.jpg
        caption: 插針代表主力在守：小台 60 分K 紅線那一帶有很多下影線插針，Alina 說這是主力要守的強撐位，要做多可以在這個位置。
        from: "1555125261530308620"
      - src: /img/1555138473625657374-image.jpg
        caption: 兩個大區間：微台 1 小時K 上 Shawnnnn 框出上下兩個整理區間，當時價格在上方區間（約 48200 到 48600）裡來回；上方區間一旦跌破，就容易回到下方區間整理更久。
        from: "1555125261530308620"
cautions:
  - 連續做對不要膨脹，停損還是要照做，不要把獲利一下子輸完。
  - 「害怕被軋的心大於信任指標的心」，就會看到訊號也不敢做；大波動行情反而要看更小的週期、照指標做。
  - 洗盤日還照平常的週期和停利停損硬做，容易找不到位置或連續虧損。
