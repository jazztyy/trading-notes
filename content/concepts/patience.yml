slug: patience
title: 耐心少做：不追、看不懂就空手
topic: 交易心態
order: 4
summary: 不必每一段都賺。沒有好位置就忍住手指，看不懂的盤空手就是對的；只賺自己認知內的錢，要跟單就筆筆都跟，手感不好就停手，Alina 每月達到獲利目標就克制下單。
sections:
  - heading: 沒有好位置就不硬上
    text:
      - Alina 說她一直在練習忍住手指：沒有好位置就不要硬上。Shawnnnn 也提醒，不要看到價格離某個關卡（例如 48000）還有 50、60 點，就覺得還能吃一點而貿然追進去；他以前就是這種人，結果吃了停損。
      - 99 的心態是可以錯過一次波段，等下一次程式單訊號出現再下單，反正每天都有賺錢的機會，不用每一段都賺到；Shawnnnn 說這個心態很正確。
    items:
      - 錯過就等下一次訊號，不追。
      - 想摸頭（猜頂做空）也可以，但停損一定要設好（Alina）。
  - heading: 只賺認知內的錢
    text:
      - Shawnnnn 說，只能賺到認知內的錢，賺到認知外的都是幸運，不是你的實力，這點要搞清楚。拉高之後賣飛也沒關係，有賺到才是真的賺到；不要糾結在賣最高、買最低，不然做交易會很痛苦。
  - heading: 看不懂就空手，要跟就筆筆跟
    text:
      - 盤面一度很像可以做空、又覺得可能被軋上去的時候，nick_AJ 選擇空手，結果被軋上去。Shawnnnn 說那也很棒，代表你沒有在看不懂的盤面亂下單；nick_AJ 也說，會有不準的時候才正常。
      - 如果要跟別人的單或程式訊號，就要筆筆都跟，像程式單一樣不能害怕；挑單跟的話，多半會挑到輸的，最後就變成「怎麼我跟都輸」。回撤的時候，就是考驗信仰的時候。
    items:
      - 看不懂的盤：空手，被軋也不是錯。
      - 要跟一個人的單，先統計他的勝率（Shawnnnn）。
      - 決定跟了就筆筆跟，回撤時也照跟。
  - heading: 手感不好就停手
    text:
      - Alina 覺得手感不好的日子可以停手。她每個月給自己設獲利目標，達標之後就克制下單，避免硬交易，雖然還是會手癢；她也花了好幾個月，才把之前賠的打回來。Shawnnnn 以前也會這樣設，他說多做真的會多錯，Alina 補充：尤其是連續好幾單都不順的時候。
    items:
      - 每月設獲利目標，達標就收手。
      - 連續幾單都不順，就停手，不要硬做。
cautions:
  - 摸頭（猜頂做空）的單一定要設好停損。
  - 挑單跟：只跟自己覺得會贏的那幾筆，常常剛好挑到輸的。
  - 連續好幾單不順還一直做，多做就是多錯。
