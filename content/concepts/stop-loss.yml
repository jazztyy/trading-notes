slug: stop-loss
title: 停損設在哪：固定點數、前高前低與關鍵線
topic: 停損停利
order: 1
summary: 進場前就要先規劃好停損。新手先用自己能承受的固定點數（例如 50 點）復盤練習；進階再用發動點、前高前低或關鍵線（5 分K EMA200、開盤價）當停損，算出來太遠就放棄這單。
sections:
  - heading: 進場前就先想好
    text:
      - Shawnnnn 的要求很簡單：沒人說得準行情會往哪走，所以每次進場前都要先規劃好停損點位。不要等到要進場了才問大家意見，100 個人會給你 100 種意見，你要聽誰的？
      - 停損設好之後就照做。Shawnnnn 做空時停損設 60 點，碰到就走、不會眷戀；他也說止損設好就不用害怕，怎麼虧都不會比凹單虧得多。停損還算好學，真正難的是停利。
    items:
      - 下單前先決定停損點位，跟進場價一起想好。
      - 碰到停損就走，不要留戀。
      - Shawnnnn 自己沒有掛智慧單，有單就盯著盤，碰到停損價就出場。
  - heading: 新手：先用固定點數
    text:
      - 停損要設幾點，Shawnnnn 說要回到自己身上：看你幾點會痛。如果連續停損 4、5 筆的點數你會痛，就把停損縮小。還不會判斷起漲點、起跌點也沒關係，復盤時先用固定點數停損就好，例如每筆都 50 點。
      - 固定點數的好處是單純、好執行。Jessie 停損設 50 點，Shawnnnn 用過 60 點；只要停損還沒被碰到，就不用因為 K 棒短暫跌破某條線就嚇得不敢進或急著跑。
    figures:
      - src: /img/1544728891535392769-image.jpg
        caption: 固定 50 點的停損範圍：微台 7 分K 在紅線附近進多，下方紅色區塊是約 50 點的停損。價格一度往下跌破紅線，但沒碰到停損，之後出現 BUY 往上，Shawnnnn 用這張圖告訴 Jessie「50 的話還沒到」。
        from: "1544728316211105942"
  - heading: 進階：發動點、前高前低
    text:
      - 熟練之後，可以改用圖上的位置當停損。Shawnnnn 習慣在白線進單，停損抓起漲的低點或起跌的高點，也就是這波趨勢的發動位置；nick_AJ 說這就像股票裡的前高前低：做空被嘎過前高就停損，做多跌破前低就停損。
      - 用位置當停損，點數就不是固定的，所以進場前要先量距離。Shawnnnn 的標準是：算出來停損要 70 點，超過他的預期，這單就不做；只要 55 點，他能接受就做。
    items:
      - 做多：停損放在起漲的低點或前低。
      - 做空：停損放在起跌的高點或前高。
      - 區間的頭尾也可以當停損：nick_AJ 會等價格靠近一個區間的頭或尾、趨勢出來才進場，停損就設在那個頭或尾，損益比比較好，前提是這個區間要準。
      - 回踩單也是先算好再等：Shawnnnn 規劃一筆 30 分K 的回踩單時，先算出回來進場的話停損大約 55 點，能接受才準備進。
    figures:
      - src: /img/1554878257310998649-image.jpg
        caption: 停損太遠就不做：微台 5 分K 在白線做空，停損放在黃線（起跌的高點），量出來要 71 點（黃框），超過 Shawnnnn 能接受的範圍，這單就放棄。
        from: "1554876419262128129"
      - src: /img/1554878333630677113-image.jpg
        caption: 換一個白線進空的位置，停損一樣放在上方黃線的高點，只要 55 點（黃框），Shawnnnn 能接受，這單就做。
        from: "1554876419262128129"
  - heading: 用關鍵線當停損
    text:
      - Alina 常拿關鍵線當停損。她在交界進多時守 5 分K 的 EMA200，條件是 5 分K 出現實體 K 下穿 EMA200 就出場。她也看開盤價：開盤價要守，沒守住就轉弱，再加上價格都在 EMA200 下，她就把多單全部出掉。
      - 出場之後她也不急著反手。順勢看是偏空沒錯，但進空的位置要等、要找好位置，不要空在地板；2 分K 還完全糾結、5 分K 還沒下穿 EMA200 的時候，她也不敢空。
    items:
      - 做多守 5 分K EMA200：實體 K 下穿就出場（Alina）。
      - 開盤價沒守住、價格又在 EMA200 下：多單全部出場（Alina）。
    figures:
      - src: /img/1559133707896623114-image.jpg
        caption: 在交界進多、守 EMA200：小台 5 分K 回到今日交界位 49283 附近，Alina 在這裡進多一口，停損看下方紫色的 EMA200（約 49191）。
        from: "1559123198858231812"
      - src: /img/1559205623911157883-Screenshot_20261012_220604_TradingView.jpg
        caption: 停損條件出現：同一天晚上台指 5 分K 白線、橘線翻空，一根帶量長黑實體跌破藍色 EMA200（約 49204），就是 Alina 說的「實體 K 下穿 EMA200」。
        from: "1559123198858231812"
cautions:
  - 手上有單時會一直懷疑「真的會跌下去嗎？」而遲遲不停損。Kai 的回答是：不一定，也可能噴上去，但停損就是要設，不然會無限循環；Shawnnnn 也點出，這種念頭是有單的時候才會冒出來。
  - 不要照抄別人的停損。Shawnnnn 舉自己為例：他的成本本來就比現價低，隨口說一個停損對他不痛不癢，對剛進場的人卻是實打實的虧損。
