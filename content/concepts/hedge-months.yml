slug: hedge-months
title: 對鎖保利與近遠月合約的分工
topic: 資金與風險
order: 2
summary: 近月多單成本很好又怕賣飛時，Alina 會空一口遠月對鎖，先把獲利鎖住，等方向明確再處理；平常的分工是「近月做短衝、遠月做趨勢」，口數用小台、微台搭配調整。不過真正的最佳解，還是在好位置減碼保本。
sections:
  - heading: 對鎖：先把獲利鎖住
    text:
      - 對鎖是手上有單時，另外開一口反方向的單，讓兩邊的盈虧互相抵銷。Alina 用它的情境是：近月多單成本很好、捨不得賣，又怕自己賣掉後被來回巴，就等價格反彈上去，空一口遠月對鎖，至少到結算前先保住獲利，等方向明確再來處理。
      - 她說對鎖先保利，可以比較平常心看方向；看不出方向、原本打算平倉再掛空的時候，也可以改成對鎖。
    items:
      - 時機：手上有成本很好的單，看不出方向，又不想平倉。
      - 位置：等反彈上去再空遠月，不是隨手開。
      - 解鎖：方向出來再處理。Alina 有一次對鎖後價格直接回到她的成本，她就回補空單，再加一口多。
  - heading: 口數與底單
    text:
      - 對鎖要開遠月合約。口數方面，nick_AJ 認為多用微台比較好調整，除非本金比較厚；Alina 則是小台遠近月都有的時候，再用微台搭配。
      - 有「底單」時加碼比較有底氣。底單就是成本比較低的單，例如 Shawnnnn 加碼一口多時就說「但我有底單」，前面便宜的部位墊著，加碼的壓力就小很多。
    items:
      - 對鎖開遠月。
      - 口數用微台微調；小台遠近月都有時，再拿微台搭配。
      - 底單＝成本低的單，有底單再加碼。
  - heading: 近月做短衝、遠月做趨勢
    text:
      - Alina 的分工原則是「近月做短衝、遠月做趨勢」。短衝需要流動性，所以順勢的短沖看近月；趨勢空單、往上加空的單，她會開在遠月，覺得比較安全。要佈空單時，她會在 5 分K 的 EMA200 附近慢慢佈遠月空單，或直接把單開在 EMA200。
    items:
      - 近月：順勢短沖，流動性好。
      - 遠月：趨勢單、加空、佈空單。
      - 佈空位置：5 分K EMA200 附近分批佈。
    figures:
      - src: /img/1561979687809458278-image.jpg
        caption: 遠月佈空的位置：小台 5 分K 收盤時價格在紫色 EMA200（46683）下方，右上趨勢表 5 分到 4 小時都偏空。Alina 打算等反彈到 EMA200 附近，再慢慢佈遠月空單。
        from: "1561658650551128117"
  - heading: 快結算時：轉倉或減碼
    text:
      - 近月快結算、部位又不打算減碼停損時，可以轉倉到更遠的月份。Alina 的看法是，如果不是要抱波段，開在哪個月份差別不大，只是倉位不同；但越遠的月份越吃保證金，流動性也比較差。
      - 她也提醒，轉倉、對鎖都只是處理部位的方法，最佳解還是找好位置減碼保本；不然保證金一直被卡住，要加倉也不夠。
cautions:
  - 對鎖不是解套：被套的部位最好還是找好位置減碼保本，否則保證金卡住，想加倉也沒有錢。
  - 遠月流動性比近月差，不適合拿來做需要快進快出的短衝。
