slug: golden-cross
title: 黃金交叉要上穿 EMA200 才算標準
topic: 指標設定
order: 3
summary: 雙線黃金交叉要真正向上穿過 EMA200 才算標準型態，之後可以沿線做多、回踩加碼；交叉在 EMA200 下方、只是擦邊或兩線很黏都還不算。上方還有大週期的 EMA200 壓著時，要先過那道壓力。
sections:
  - heading: 怎樣才算標準的黃金交叉
    text:
      - 這裡說的黃金交叉，是 Shawnnnn 的雙線（白線、藍線，有人設成紅藍）往上交叉，而且同時向上穿過 EMA200。EMA200 是多空分水嶺，Alina 的看法是在它之上偏多看、之下偏空看，可以用來分辨自己現在是順勢還是逆勢。
      - nick_AJ 畫圖說明：雙線交叉後直接穿過 EMA200 的是標準型態，上去就可以一路做多；如果交叉的位置還在 EMA200 下面，就要等雙線繼續往上彎、真正穿過 EMA200 之後，才能說是黃金交叉、進場做多。Alina 說直接穿上去的最漂亮；另外，價格往上碰到 EMA200 時通常會先被壓一下。
    items:
      - 標準：雙線黃金交叉，並且直接上穿 EMA200。
      - 還不算：交叉發生在 EMA200 下方、還沒穿過，「快要穿過」不算。
      - 還不算：只是擦邊、兩條線很貼很醜的交叉（Alina）。
      - 穩一點的做法是等真的交叉才做，中間那段可以放棄，吃一段大的就夠了（Alina）；nick_AJ 也認為交易次數越少，期望值越好。
    figures:
      - src: /img/1555250012466847794-image.jpg
        caption: 標準與不標準：台指 5 分K 左邊黃圈是標準的黃金交叉，白線、藍線交叉後直接穿過橘色 EMA200，之後一路往上；右邊雙線還在橘線下面，要等它照黃色箭頭往上彎、穿過橘線才算。中間那段雙線很黏、在橘線附近糾纏，Alina 說除非很靈活，不然別做。
        from: "1555248696797434007"
  - heading: 交叉之後沿線做、回踩加碼
    text:
      - 標準的交叉出來之後，就順著線做。Alina 的做法是：站上 EMA200 之後，只要雙線離 EMA200 還有距離，過程中價格往下跌都不用怕，甚至回踩都可以加多，她的加碼單都是這種長相才順勢加；走到轉折時再分批停利。
      - nick_AJ 分享他用 3 分K 的流程：早上先等白線黃金交叉，同時觀察 EMA200 跟下方線的交會；交叉後沿著線做多，價格回踩時再用 5 分K 看一兩根確認；停損設在前面不遠的交叉點附近，就算被騙也賠不多。他說這是「Alina 的判斷法加上 Shawnnnn 的策略」。Shawnnnn 當天則是看 1 分K，單純看線辦事。
      - 同樣的邏輯也可以搭配每天的多空交界位：Alina 看 5 分K，價格站上當天的交界位、雙線看起來要交叉，她就在交界上方進多；之後碰到上方壓力區有反應，但最後帶量撞過去，策略訊號在今日壓力前觸發第一個停利。
    items:
      - 進場：雙線黃金交叉上穿 EMA200，或站上交界又出現雙線交叉。
      - 加碼：雙線離 EMA200 還有距離時的回踩。
      - 停損：前面不遠的交叉點附近（nick_AJ）。
      - 停利：走到轉折時分批停利（Alina）。
    figures:
      - src: /img/1559079592210333736-Screenshot_20261012_134527_TradingView.jpg
        caption: 沿線做多：nick_AJ 的台指 3 分K，開盤後白線、橘線一起往上穿過藍色 EMA200，回踩白線時出現「多-白線 +1」進場訊號，之後價格沿著白線一路往上，回踩都沒有跌破線。
        from: "1559054483550633985"
      - src: /img/1559483358705352704-image.jpg
        caption: 站上交界、雙線交叉：小台 5 分K 價格回到橘色虛線「今日交界位」之上，紅藍雙線交叉往上，右上趨勢表的 1、2 分K 也轉成偏多。Alina 就是在交界上方進多。
        from: "1559473494574497794"
  - heading: 兩條線很黏時不做
    text:
      - 雙線貼在一起、在 EMA200 附近來回糾纏的時候，Alina 的建議是不要做，除非你很靈活。這種盤也會有人在裡面上下洗，但除非已經抓出有規律的區間，不然觀察就好；真的要做，就在區間上下緣、自己知道停損放哪裡的位置進，比較好判斷。
      - nick_AJ 提到這種盤的難處：就算看出規律，已經來回三次了，心裡就會想還會不會有第四次。Mikey 只看藍白線被巴過之後，Alina 建議他加一條 EMA200 來輔助判斷。
  - heading: 上方還有大週期 EMA200 時
    text:
      - 5 分K 出現黃金交叉，不代表就能一路做多，還要看上面有沒有更大週期的壓力。有一次早盤急拉後，Alina 指出上方還有 10 分K 的 EMA200 壓著，5 分K 的雙線也只是擦邊，沒有漂亮的交叉；Shawnnnn 同時提醒 5 分K 已經連續 6 根紅K，要小心。
      - 這時 Alina 的判斷是：只要 5 分K 先守住 EMA200（交界）就還有機會，Shawnnnn 也說收在關鍵價之上就還有機會。之後價格回測守住、走出 N 字，雙線黃金交叉上穿，而且在交界之上；但她說還是要先過上方的大壓並站穩，才能往下一階看。Shawnnnn 另外在 15 分K 標出前高密集的壓力區。
    items:
      - 先看大週期：10 分K、15 分K 上方有沒有 EMA200 或壓力區壓著。
      - 5 分K 先守住 EMA200（交界），再等雙線黃金交叉上穿。
      - 過了上方大壓並站穩，才看下一階。
    figures:
      - src: /img/1561919417649070183-image.jpg
        caption: 上面還有壓力：小台 10 分K 開盤急殺後拉回，碰到上方紫色的 10 分K EMA200（約 46859）就被壓住。這時就算 5 分K 要交叉，也得先過這道壓力。
        from: "1561915340739321857"
      - src: /img/1561933921724272650-image.jpg
        caption: 守住交界後的黃金交叉：小台 5 分K 回測橘色虛線交界位守住，紅藍雙線準備往上交叉、穿過紫色 EMA200，價格也在交界之上。Alina 說接下來要先過 47000 大壓站穩，才看下一階。
        from: "1561915340739321857"
cautions:
  - 交叉後實際能賺多少、停損放哪，要自己復盤驗證。Shawnnnn：「你知道怎麼操作是一回事，復盤有沒有獲利、停損放哪又是另一回事。」
  - 200 那條線要設成 EMA，不是 SMA。維尼發現自己 10 分K 的 200 線和大家的不一樣，原來是設成 SMA。
  - 急拉時 5 分K 已經連續好幾根紅K，就算要交叉也別急著追，Shawnnnn 看到連續 6 根就提醒要小心。
