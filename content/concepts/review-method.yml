slug: review-method
title: 復盤方法：重播、截圖筆記與勝率統計
topic: 復盤回測
order: 1
summary: 用 TradingView 的重播功能復盤，把看到的進場依據和防守點位截圖寫成筆記，日K 的趨勢盤和震盪盤都要記；統計勝率時先分清楚策略單和手癢單，一次只用一套策略、固定一個方向，至少復盤一個月。
sections:
  - heading: 用 TradingView 重播復盤
    text:
      - Shawnnnn 復盤都是自己用 TradingView 的重播功能，週末就可以挑日子重播，他到現在沒事也會復盤。操作步驟如下：
    items:
      - 先把週期切到日線（天），按上方的「重播」。
      - 選要重播的日期（手機版的日期選擇在畫面下方）。
      - 週期調回 2 分K，在下方設定每次跳多少，Shawnnnn 設一次一分鐘。
  - heading: 截圖寫筆記
    text:
      - Shawnnnn 以前的做法是把看到的圖截下來，寫上當時的進場依據和防守點位，存起來三不五時翻一下。看久了大概會記得，但很多細節還是要常複習；這樣精實地記錄 3-5 個月，會進步不少。下次遇到一樣的長相，就知道怎麼面對。
      - 日K 的趨勢盤和震盪盤都要記錄，因為兩種盤的狀況差很多。
    items:
      - 每則筆記寫兩件事：進場依據、防守點位（停損放哪）。
      - 可以用 TradingView 的倉位工具標出目標和停損，例如目標 100 點、停損 60 點，風報比 1.67。
      - 把關鍵濃縮成一句話，例如回踩進場的重點就在「沒有被灌破」。
      - 趨勢盤、震盪盤分開記。
    figures:
      - src: /img/1549090388953006231-image.jpg
        caption: 一則筆記的樣子：微台 2 分K 拉了一根帶量的上引線（黃框），下來後沒有跌破起漲紅K 的低點（黃線）。筆記上寫明可以嘗試做多，防守點在起漲紅K 低點附近。
        from: "1549085069019320473"
      - src: /img/1549093524354629805-image.jpg
        caption: 把重點寫成一句話：價格到壓力下緣（黃框）沒有被強勢灌破，又回到 EMA 附近，可以嘗試進場，停損抓起漲紅K（黃線）。Shawnnnn 說重點就在「沒有被灌破」這幾個字。
        from: "1549085069019320473"
  - heading: 統計勝率：先分清楚策略單
    text:
      - 照策略做還是連續虧了 5、6 筆時，Shawnnnn 說要先區分是策略本身有問題，還是只有今天有問題；如果只是今天，那只是今天的盤勢不適合你，大谷翔平就算是神也有低潮。要做這個判斷，前提是分得出哪些是策略單、哪些是手癢單。Kai 補充可以想想：進出場是不是同一個策略？是不是常 FOMO，或停損後馬上想賺回來又下單？
      - 策略也要一致，統計才有意義。Shawnnnn 舉 EMA50 的例子：如果你的策略是踩 EMA50 進場，就不能今天順勢在白線做多、明天逆勢也在白線做多，這樣跳來跳去策略會失真，你會不知道它到底有沒有用。應該只看自己設定的那條線、固定做順勢方向，看「每次都在順勢白線做多」的勝率。照策略進場、到停損點就停損，就是一筆正確的交易，不用怪自己。
    items:
      - 先分出策略單和手癢單，只統計策略單。
      - 一次只用一套策略；兩套都想用（例如 H 大的點位和兩條線），先擇一，看哪個用起來舒服、勝率高。
      - 固定一個方向（例如只做順勢）統計勝率；nick_AJ 說這樣比較能比較出進出場位置的差別。
      - 至少復盤一個月，才會同時包含震盪盤和趨勢盤；Alina 建議也可以先挑一天，用一種策略試試看判斷有沒有跟期望一樣。
    figures:
      - src: /img/1554875000530407494-image.jpg
        caption: 只看一條線、一個方向：兩張圖都只看成員設定的白色 EMA50（黃箭頭），價格上去再回來碰到白線的位置（紅箭頭）都應該做多。先不管線平不平，照同一個規則做，統計出來的勝率才有意義。
        from: "1554863142260178995"
  - heading: 練習單和實戰不一樣
    text:
      - 用模擬單測試時可以像機器一樣無情下單，真金白銀就很難做到（Alina）；Shawnnnn 也說心態一定會受影響。光是微台和小台，心情就不一樣，資金大小的操作差很多，所以 Shawnnnn 現在還是在操作微台。重點還是風險在自己可承受的範圍內。
cautions:
  - 圖表縮放會改變均線斜率的觀感：同一張圖拉扁了，怎麼看都是平的。復盤和看盤時版面比例要一致。
  - 「接在這裡吃不到大段」常常是事後看才有的感覺，不要用事後的結果否定照策略做的單。
  - 同一條線今天順勢做、明天逆勢做，統計出來的勝率會失真。
