slug: tangled-lines
title: 兩線糾結、線很密集就不做
topic: 盤整震盪
order: 1
summary: 這套策略吃的是單邊行情；兩條線貼在一起、走平或線很密集時方向不明，照策略做容易被洗。沒單就不進，有單看到線靠近可以先走，等線展開、方向跑出來，再找回踩白線或 EMA 的位置進場。
sections:
  - heading: 單邊才好做，糾結時不要猜
    text:
      - ROCH 說得直接：Shawnnnn 這個策略本來就吃單邊行情，盤整就不好做。Alina 也有同樣的體會：方向一致的日子跟著 2 分K 訊號進場勝率滿高，做起來很順；盤沒方向的時候就不好做。
      - 所以線糾結時不進場，不是因為沒肉，而是像 Shawnnnn 說的「趨勢我不知道他要往上還往下」。不知道方向就不要猜，等它跑出下一段行情再找買點。
    figures:
      - src: /img/1542896052485754960-image.jpg
        caption: 什麼能做、什麼不能做：微台 2 分K，1 和 3 是白線、藍線拉開而且方向明確的段落，Shawnnnn 喜歡做；2 是剛殺下來、兩條線剛擠在一起的位置，方向不明確，不做。
        from: "1542892838239600661"
  - heading: 怎麼看出線在糾結
    text:
      - 判斷的重點是兩條線之間的關係：線有展開、有角度，方向就明確；線貼在一起、走平，或好幾條線擠成一團，就是方向不明。開盤要特別小心，Shawnnnn 說開盤一定會有劇烈震幅，兩條線還沒開很大的時候最容易被洗，所以他開盤前不進單，開盤後也不會馬上進，大概再等個 20 分鐘才看。
    items:
      - 兩條線還沒展開、平平的：不進場（Shawnnnn）。
      - 剛殺下來、兩條線剛擠在一起：方向不明確（Shawnnnn）。
      - 線很密集、趨勢沒很明確：不要亂進多（Shawnnnn）。
      - 5 分K 量能萎縮、震幅變小：不是不能進，是進場後時間會拖很久，不要浪費時間（Shawnnnn）。
      - 雙線和多空分水嶺（EMA200）黏在一起、看不出要不要下穿：這種位置容易多做多錯（Alina）。
      - ROCH 看的指標有 3 個都在盤整時，他就不進場。
    figures:
      - src: /img/1542895045458272286-image.jpg
        caption: 開盤兩條線還沒展開：微台 2 分K 開盤後先殺再急拉，BUY 出現後白線、藍線還貼在一起（紅圈），Shawnnnn 說這裡容易被洗，平平的不要進場。
        from: "1542892838239600661"
      - src: /img/1555158355431923732-image.jpg
        caption: 線很密集：微台 5 分K 白線和 EMA 擠在一起走平，K 棒在線上來回穿，最後一根長黑往下。Shawnnnn 提醒這種趨勢不明確的時候不要亂進多。
        from: "1555158355431923732"
  - heading: 有單時：線靠近就準備走
    text:
      - 線開始糾結時，手上有沒有單做法不同。Shawnnnn 說，兩條線慢慢靠近時，原本沒單的話他就不會進場；原本有單的話，他會先觀察、不會馬上跑，但收 K 前剩 30 秒還不對勁，他可能就先跑了。那次他看到收了一根下引線，又繼續觀察，最後還是停損 40 點出場。
      - 出場後會不會往上噴、會不會往下噴，他都說不知道；對他來說，乖乖停損就是一筆好的交易。
    items:
      - 沒單：兩條線慢慢靠近就不進場。
      - 有單：先觀察，收 K 前 30 秒還不對就先走。
  - heading: 等方向跑出來再進
    text:
      - 糾結之後總會跑出方向，這時才開始找進場點。Shawnnnn 的例子是：下殺一段之後接著盤整，就去看它最後往哪邊出；如果往上漲，之後回踩碰到白線或 EMA 的地方，就可以開始嘗試。但如果盤整得很平緩、看不出方向，就算碰到白線或 EMA，他也不會進場。
      - 線只是有一點黏、但停損很好抓的位置，Shawnnnn 認為還是可以試單看看。Alina 則會在上有壓力、下有支撐的時候做區間，要空就掛在上方的壓力那邊。
    figures:
      - src: /img/1542932797142859820-image.jpg
        caption: 碰到線也不進：Shawnnnn 畫的示意圖，下殺之後價格在白線附近走平、上下來回（黃線），這種盤整就算碰到白線或 EMA 也不進，因為不知道會往上還往下。
        from: "1542932797142859820"
      - src: /img/1542933651531108453-image.jpg
        caption: 方向出來才進：微台 2 分K 下殺後在紅框內盤整，之後出現 BUY、兩條線往上展開，紅圈是回踩碰到白線和 EMA 的位置，Shawnnnn 說到這裡才可以開始嘗試。
        from: "1542932797142859820"
cautions:
  - 盤整平緩時，碰到白線或 EMA 就照習慣進場。Shawnnnn 特別強調這種時候碰線也不進，「這很重要」；先確認方向，再看碰線。
  - 復盤和實盤差異很大：復盤時一眼就看得出方向，實盤要願意花時間觀察，不要急著進（Shawnnnn）。
