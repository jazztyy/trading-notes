slug: limit-orders
title: 用限價單掛在線上，不追價
topic: 進場時機
order: 3
summary: Shawnnnn 進場多用限價單掛在線上（白線、藍線、兩線中間或 EMA），避免市價滑點，沒掛到就算了、不追；出場第一口先賺 80-100 點求安心，反彈單則是小賺就跑。
sections:
  - heading: 為什麼用限價單
    text:
      - Shawnnnn 進場大多用限價單，很少用市價，因為怕滑點太多；有掛到就掛到，沒掛到就算了，反正 2 分K 的機會很多。
      - 不追價也是在訓練耐心。Shawnnnn 說他以前沒掛到可能會去追單，結果價格等一下又會回來。Alina 做空也是掛限價，理由是怕自己遲疑：價格到了還在猶豫，一遲疑就會變成別人的燃料。
  - heading: 掛在哪裡
    text:
      - 掛單的位置就是指標上的線。掛白線有時候會掛不到，Shawnnnn 自己也會遇到，他的建議是離白線高或低 5 點去掛；有時候他也會掛在兩條線中間的價格。每種位置各有優缺點，看自己要的是成交次數還是成本。
      - 不要太早掛：Shawnnnn 說價格還沒到之前先不要掛，快到了再掛當時線上的價格。搶反彈也要注意，有時會猛猛一根直接上去，這時可能要改掛 EMA 那個價位。Alina 的空單則是掛在壓力位：她抓 TV 5 分K 上的壓力試空，掛一個自己喜歡的數字。
    items:
      - 掛白線：交易次數一定比較多，伴隨的停損次數、獲利次數也可能都比較多。
      - 掛藍線：成本一定比較好，但成交次數可能不多。
      - 白線上下 5 點：掛白線常常掛不到時的調整。
      - 兩線中間價：介於白線和藍線之間。
      - EMA 價位：反彈很猛、一根直接上去的時候。
    figures:
      - src: /img/1542736822197821470-image.jpg
        caption: 一天的進出場：Shawnnnn 畫出當天微台 2 分K 的進出場，每一段都是等價格回到白線、藍線附近才進，順著線的方向做。多單兩段各賺 105、111 點；空單則是在價格反彈碰到線的位置進。
        from: "1542736450364121118"
  - heading: 反彈單停利要小
    text:
      - 線還沒上彎時搶反彈，本質上還是空方裡的短單（Annahui 問線沒上彎是不是還是空單，Shawnnnn 說對）。所以 Shawnnnn 搶反彈不會看太遠，有賺就很好，停利點不會很大；而且只做一口，有量才繼續玩。
      - Alina 碰壓力做空的單也是一樣的心態：本來就是想吃碰到壓力後的回落，被壓回來就要快點回補；再往下都是可能會回彈的位置，她就不賭。
    figures:
      - src: /img/1552502296351350875-image.jpg
        caption: 在壓力位掛限價空：Alina 的 5 分K 價格一路往上，接近上方粉紅色的壓力區時，她就在這裡掛限價空單試單；碰到壓力被壓回後很快就回補。
        from: "1552493878035091558"
  - heading: 出場怎麼抓
    text:
      - Shawnnnn 的出場習慣是第一口先獲利 80-100 點，讓自己安心，後面的再抓當日前高或前低。如果只是想賺零用錢，50 點 50 點撈也會很多；有時候賺個 30 點他也很滿意。
    items:
      - 第一口：先賺 80-100 點。
      - 後面的口數：抓當日前高或前低。
      - 賺零用錢：50 點 50 點撈。
    figures:
      - src: /img/1542737706398785586-image.jpg
        caption: 50 點也很好：2 分K 價格回踩到藍線附近進多，沿著白線往上拉，賺 50 點就出場。Shawnnnn 說只想賺零用錢的話，這樣撈也會很多。
        from: "1542736450364121118"
cautions:
  - 沒掛到就去追價。Shawnnnn 以前會追，結果價格又回來；沒掛到就等下一次機會。
  - 空單遲疑一秒都會變成別人的燃料，碰壓被壓回就要快回補。
  - 線還沒上彎的反彈單當成趨勢單抱，停利抓太大。
