slug: one-strategy
title: 只用一套策略，少看外部資訊
topic: 交易心態
order: 2
summary: 資訊越多雜訊越多，每個地方都有人看多、有人看空。先只用一套自己操作起來順手的方法（例如 Shawnnnn 的兩條線，或 Alina 的「雙線＋EMA200＋撐壓點位」），篩掉其他聲音，自己看圖、自己判斷。
sections:
  - heading: 資訊越多，雜訊越多
    text:
      - 群組裡常有人加了越多群、看越多資訊，反而越賠錢，或是自己做本來小賺，看了資訊又回吐。原因是每個地方都有人看多、也有人看空。99 說這些人的勝率可能都有 5 成，但你在不同時間選到不同人的見解，當下那個人剛好看反，你就掰了；nick_AJ 也說，很可能每次跟都跟到輸的那次。
      - 喊單的人還可能有你看不到的避險部位，例如大部位放在權值股，只照著他做期貨會很虧（Shawnnnn）。Alina 則提醒，資訊多會增加雜訊、影響判斷，尤其是在捏逆勢單的時候。
    items:
      - 篩選出自己認為有用的，其他都不要理（nick_AJ、99）。
      - 跟單只跟到一半（只做期貨、沒有避險）很容易虧。
  - heading: 圖上的指標也一樣，先只看一套
    text:
      - 不只外部資訊，圖上的指標放太多也會亂。Shawnnnn 說他還沒穩定的時候，不可能同時看布林、均線壓力、MACD、兩條線又看裸K；Alina 也說策略有時候會打架，不是每個時候每個策略都剛好符合，全部都符合時無腦做下去就對了。
      - 例如有人看到 MACD 轉綠想做多，但 30 分K、1 小時的線還壓在 K 棒上面，Shawnnnn 的判斷就是還被壓制住、不要亂多。圖上同時有布林和兩條線時，他會先問你要用哪一個；用兩條線的邏輯，就是線還沒站穩前寧可空手，站上去再進。
    items:
      - 先決定用哪一套，其他指標暫時拿掉。
      - 用 30 分K 或 1 小時的線，看多單是不是被壓制住。
      - 5 分K 兩條線還很靠近、線還在糾結時，先不進場。
    figures:
      - src: /img/1555141976276598786-image.jpg
        caption: 被壓制的長相：微台 30 分K 的 K 棒收在白、粉、紅三條線下方（藍圈處），線也還在往下。有人因為 MACD 轉綠想多，Shawnnnn 看線的判斷是還被壓著，不做多。
        from: "1555141976276598786"
      - src: /img/1555145549114511412-Screenshot_20261001_171220_TradingView.jpg
        caption: 線糾結先不進：台指 5 分K 從跳水位（藍色 D 線）附近彈上來，但白、橘、藍三條線還纏在一起。nick_AJ 認為線還在糾結，不適合進場。
        from: "1555141976276598786"
  - heading: 找自己順手的方法，自己判斷
    text:
      - 用哪一套沒有標準答案。Shawnnnn 說一定有人覺得他分享的兩條線很糞、操作就是虧錢，也一定有人操作起來是賺錢的，要看你自己操作起來哪個舒服。nick_AJ 提醒大家回歸初心：群組用的參數其實來自 Shawnnnn 的分享，進單看趨勢和程式訊號怎麼說就好。
      - Alina 是繳完學費給市場之後，才逼自己找到順手的判斷方法；她覺得「雙線＋EMA200＋撐壓點位」就已經很好用，平常就是看線辦事、按線做、不要逆勢。Doobe 則建議少看別人的，去學裸K 和畫框畫線，自己看、自己判斷，才會知道下一次怎麼修正。
    items:
      - 挑一套自己用起來舒服的，先用它復盤、驗證。
      - 自己看圖、自己判斷，錯了才知道怎麼修正。
      - Shawnnnn：如果你自己做會賺，連這個群組都可以不看；你只能相信自己，最後也只有相信自己。
cautions:
  - 捏逆勢單的時候最容易被外部資訊影響，越看越動搖。
  - 只照喊單做期貨：對方可能有你看不到的避險部位，你只做到一半。
  - 空手會痛苦、賣飛也會痛苦，這很正常；Shawnnnn 說做交易永遠都痛苦。
