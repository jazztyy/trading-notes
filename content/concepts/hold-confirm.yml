slug: hold-confirm
title: 「站穩」才算：實體 K 收上、回測不破
topic: 進場時機
order: 2
summary: 價格碰到線或點位不等於站上。要先突破、回測不破再往上，或實體 K 收在線上（最好帶量），才叫站穩；直接噴出、插針碰到、在線上下來回洗都不算。
sections:
  - heading: 什麼叫站穩
    text:
      - Shawnnnn 對站穩的定義：價格先突破那條線，回測的時候不跌破，再往上走，才算站穩；直接噴出去不叫站穩。99 的說法一樣：等於要先過那個價位，而且上去回測之後也都沒有低於它。
      - 這個定義是在回答一個常見的錯誤：Mikey 看到價格碰到關鍵價，以為已經站穩就追多，其實價格還沒有經過回測。
    figures:
      - src: /img/1556693780986335293-image.jpg
        caption: 站穩的定義：Shawnnnn 在微台 2 分K 上用橘色線示意，價格先突破粉紅色的 50130，回測時不跌破這條線，再往上走才叫站穩。
        from: "1556685238405701634"
  - heading: 碰到不算，要看實體 K 和量
    text:
      - Alina 用 5 分K 的 EMA200（她也叫交界）判斷多空。價格在下面時，EMA200 會先當壓力；碰到不算站上，要看站上去的那根 K 棒和量，因為盤很瘋的時候，有時會突然一根上去又下來。
      - 她要的確認是：5 分K 收在 EMA200 之上、守住交界，實體 K 穿過 EMA200 才算數，最好還帶量。有一次傍晚走出 W 底，EMA200 先壓了一下，等到上穿交界的那根 K 棒出現她才確認，之後就拉出長紅。
    items:
      - 不算：影線碰到、插針刺上去。
      - 算：實體 K 穿過、收在線上。
      - 更可靠：站上時有量。
    figures:
      - src: /img/1561690291826729021-IMG_4998.jpg
        caption: 上穿交界的 K 棒：小台 5 分K 傍晚打出 W 底，K 棒實體穿過紫色 EMA200 和橘色虛線交界位後才確認，接著一根長K往上拉，右上趨勢表 1、2、5 分K 也都轉偏多。
        from: "1561570964028923959"
      - src: /img/1561745468109750413-IMG_5005.jpg
        caption: 實體收上又帶量：小台 5 分K 跌破後重新回到紫色 EMA200 和雙線之上，連續幾根 K 棒實體收在線上，下方成交量也放大，Alina 說「走得 ok，也有量」。
        from: "1561570964028923959"
  - heading: 回測不破反而是機會
    text:
      - 站上之後的回測，是確認站穩的機會。Alina 碰過一次連續急跌的長K一路打回 EMA200，看起來很嚇人，但 EMA200 撐住了，她判斷是誘空，這種長相反而要進多，並說「在 200ma 做比較安全」。Kai 也指出，同一天稍早已經有一模一樣的情況：回測 EMA200 沒破，之後就往上走。
      - 這跟 Shawnnnn 的定義是同一件事：突破之後回測不破，才是站穩，而確認撐住的那一刻就是 Alina 進場的時機。
    figures:
      - src: /img/1561736878820958268-IMG_5002.jpg
        caption: 回測不破是誘空：小台 5 分K 連續急跌打回紫色 EMA200 附近，最後一根留下下影線、沒有跌破就收回。Alina 判斷這是誘空，這種長相要進多。
        from: "1561570964028923959"
  - heading: 站穩再進，洗盤就等
    text:
      - Alina 的習慣是價格到了點位之後，還要配合量和 K 棒的狀況，站穩才進場。也有策略是點位一到就直接進場陪它等，但她比較追求資金效率，寧願等行情要發動再進，即使價格不是最低點；兩種做法看個人的操作習慣。
      - 如果價格一直在那條線上下洗，99 的建議是不要進場，等到「明確有背離」的時候再試單，不然就會一直多空多空、懷疑人生，只是幫營業員賺手續費。Shawnnnn 也說震盪盤他不喜歡進去。
cautions:
  - 插針或影線碰到線就當成站上、急著追進，Mikey 追多就是這樣。
  - 長K打回 EMA200 就急著翻空。EMA200 撐住常常是誘空，Alina 說那天整天都在「甩多軍騙空軍」。
  - 價格在線上下來回洗時一直進出，只是幫營業員賺手續費。
