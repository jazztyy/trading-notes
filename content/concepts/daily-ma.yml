slug: daily-ma
title: 日K級別的撐壓：月線、季線、5MA 與月開盤價
topic: 撐壓點位
order: 5
summary: 日K 的均線是波段的大撐壓：月線（日K 20MA）要尊重、季線附近容易大反彈不要追空，反彈目標可以先看日K 5MA；月K 的開盤價也常被當成支撐，跌幅則可以用等幅框量。
sections:
  - heading: 月線要尊重
    text:
      - 月線就是日K 的 20MA（也有人叫 20T）。它不是固定的價位：每過一個交易日，20 日平均就往前滾動一次，位置跟著改變，所以才會有扣抵值。維尼以為月線在另一個價位，Alina 提醒他月線會變，要看當天的價位。
      - Alina 說月線要尊重，實體 K 棒跌破就真的很難看。她那次就是在月線附近回補空單並翻多；她喜歡掛整數，所以掛在月線價位下方一點的整數。
    items:
      - 月線 = 日K 20MA，每天滾動，要用當天的價位。
      - 月線附近可以回補空單、試多；實體 K 棒跌破就要小心。
      - 那次盤勢太恐怖，平常不設智慧單的 Alina 也設了，後來跌破自動停損出場，避開了後面的大跌。
  - heading: 季線附近不追空
    text:
      - 季線不守就會溜滑梯，但價格卡在季線上時追空很危險：這裡被反彈打到的機率高，等於在賭方向、看誰贏。Alina 那次看線是該做空，但她覺得還沒出現像樣的反彈，在季線追空不如「下地獄搶低接反彈單」，等更低的位置接反彈。
      - 後來她在季線附近回補空單並反手做多，接著就出現季線該有的大反彈；有學員空在當天最低點，Alina 一看，就是空在季線上。
  - heading: 反彈目標先看日K 5MA
    text:
      - 短線開始往上交叉、看起來要反彈時，Alina 會把反彈目標先放在日K 5MA，超過的部分就當作撿到。近月和遠月合約的 5MA 價位不同，掛單時要看自己交易的那個月份。她也說最好再搭配撐壓點位換算出場價，會比只看 5MA 好。
    items:
      - 反彈目標：日K 5MA，超過算撿到。
      - 近月、遠月的 5MA 分開看。
      - 再用撐壓點位換算實際出場價。
  - heading: 月開盤價與等幅
    text:
      - 月K 的開盤價也常被當成支撐。nick_AJ 問空單要在哪裡平，Alina 的邏輯就是看月K 開盤價，覺得那裡要守：在月開盤價附近掛單先平一口，價格站回當天的支撐就全部出場。
      - 跌幅可以用等幅框來量：把前一段的跌幅等高往下複製一個框，跌到框底就算滿足，該準備反彈了。那次跌幅滿足、跳水位也沒有跳水，5 分K 一根貫穿又勉強站回，Alina 覺得等這根 5 分K 收完風險太大，不想抱上抱下，就先落袋，打算拉上去再空。
    items:
      - 月開盤價：空單的平倉參考，Alina 先在附近平一口。
      - 等幅框：跌幅滿足就準備反彈。
      - 看不清楚時先落袋，不要抱上抱下，等拉上去再找空點。
