        from: "1559917444372496435"
      - src: /img/1559932266241589310-IMG_4825.jpg
        caption: 用等幅框量跌幅：台指分時圖上，上面的框是第一段從 49000 跌到約 48700，往下複製一個等高的框，第二段跌到 48335 剛好碰到框底，Alina 用它判斷跌幅已經滿足。
        from: "1559917444372496435"
cautions:
  - 盤勢很恐怖時，平常不設智慧單的 Alina 也會設，避免跌破後來不及跑。
  - 季線上追空等於賭方向，很容易空在最低點、被大反彈打到。
  - 月線的價位每天在變，拿舊的數字來判斷會看錯位置。
