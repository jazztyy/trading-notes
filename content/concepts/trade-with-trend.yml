slug: trade-with-trend
title: 順勢交易：結構沒破壞前不逆勢
topic: 盤勢判讀
order: 3
summary: 順勢單要有耐心、勝率高；逆勢單機會多但勝率低。上升結構沒被破壞前不要堅持做空，空方趨勢還沒看到翻轉訊號前也別急著做波段多；大級別已經在反轉時，小級別的反彈只是搶短。最難的是紀律：看線辦事、減少雜訊，下單前先想賺賠比。
sections:
  - heading: 順勢單與逆勢單
    text:
      - Shawnnnn 把單子分成兩種：順勢單要有耐心等價格來，勝率比較高；逆勢單進場機會多，但勝率比較低。他自己也承認逆勢勝率很低，Annahui 的經驗則是逆勢單太容易被打下來。所以就算手很癢、感覺會突然往上噴，照策略該空就是空，例如有人問出現放量 T Bar 還要不要空，Shawnnnn 的回答是按照策略就是空。
      - 跌法也會影響判斷。Shawnnnn 認為緩跌比急跌還可怕：緩跌會一直給人希望，然後再慢慢往下，讓人一路凹單。Mikey 和 Alina 也提到，下跌通常來得又急又快，做空的人又怕隨時被軋回去，所以空單常常抱不住。
    items:
      - 順勢單：耐心等價格，勝率高。
      - 逆勢單：機會多、勝率低，進場前先講好出場條件；Shawnnnn 做逆勢單時，白線一穿過去該跑就跑。
  - heading: 結構沒破壞就順著做
    text:
      - 順不順勢，看的是結構。開盤直接開在 5 分K EMA200 之上、上升結構完全沒被破壞時，Alina 的做法是順勢做多、回踩加單，就算做空也只是短空；Shawnnnn 也說這種盤沒有理由堅持做空。
      - 空方趨勢裡也是一樣。有人想趁跌勢買多做波段，宸的建議是除非能左側一直往下補低，不然趨勢偏空時先不要；nick_AJ 補充，還沒看到翻轉訊號之前先別做，除非資金多到能無限加倉。
    items:
      - 多方結構：開在 5 分 EMA200 之上、高低點一路墊高，就做多、回踩加單，空單只當短空。
      - 空方結構：還沒看到翻轉訊號前，不做波段多。
    figures:
      - src: /img/1559059361945620542-IMG_4748.jpg
        caption: 順勢回踩加單：小台 5 分K 開盤就站在紫色 EMA200 之上，一路 BOS 創高，紅線、藍線都往上；價格回踩藍色支撐區和均線的位置，就是 Alina 說的回踩加單點。
        from: "1559007233650458716"
  - heading: 先看大級別
    text:
      - Alina 在一次大跌後復盤，說自己是「鬼遮眼」：日K 這種大級別明明已經在反轉，小級別的上漲其實只是搶短多，她心裡卻一直掛著往上的目標，被月初那波漲勢綁住，結果一路逆勢摸底。回頭看，均線和支撐壓力的訊號都很清楚，5 分K 走簡單行情時就該勇敢順著做。
      - Shawnnnn 用 30 分K 參數做的空單，其實可以從下降趨勢線附近一路抱到下方支撐，他自己坦言抱不了那麼久；Alina 的結論是回頭看線和盤況，早就是空頭長相。
      - 看的週期也要固定。Shawnnnn 舉例：1 分K 已經逐漸上彎，2 分K 卻還在下彎，這就是先不要亂跳週期的原因。Doobe 也提到一直來回盯 5 分K、30 分K 反而會盲目。
    figures:
      - src: /img/1559959225747247255-image.jpg
        caption: 空頭長相早就很清楚：微台 30 分K 在藍色下降趨勢線下、上方紅框壓力區出 Short 訊號後，價格一路沿著下降線往下，跌到下方綠色支撐區，空單其實可以一路抱到底。
        from: "1559959225747247255"
      - src: /img/1545256617623298068-image.jpg
        caption: 不要亂跳週期：同一時間 1 分K 已經開始上彎，但微台 2 分K 的綠線還在往下彎、K 棒還在綠線下，兩個週期說的方向不一樣。
        from: "1545244113614540962"
  - heading: 看線辦事、守紀律
    text:
      - 順勢最難的是紀律。Alina 的結論是看線辦事、減少雜訊：Threads 上滑到的觀點、別人的目標價、太多人提供的關鍵位都會干擾判斷，她說自己的凹單都是因為「知道太多了」；ROCH 則是只信那兩條線。策略定好就要確實執行，像 Alina 原本定好「上去放空單替現貨避險」，空單有放卻抱不住，就等於策略只執行一半。
      - 照指標做也會連續停損。Shawnnnn 問大家「連續損三筆還有勇氣相信指標嗎」，有時候就是得勇敢進場。他自己也會破戒：說好這個月只照自己的線做順勢，盤中還是逆勢做多。nick_AJ 和 Kai 則說，參數就擺在眼前，很多人還是喜歡自己摸頭猜底，等於在享受賭博的快感。
    items:
      - 減少雜訊：別人的目標價、社群觀點、太多關鍵位先放一邊。
      - 下單前先想賺賠比：往上只差幾百點、往下卻不只，就不值得逆勢。
      - 策略定好的避險要照做，不要做半套。
    figures:
      - src: /img/1545270757695823955-image.jpg
        caption: 照指標打的單：Shawnnnn 當天全部用微台 1 分K 進出，框起來的四段是按指標做的單（下跌段 104、90 點，上漲段 53、90 點），長線由綠轉紅後方向也跟著換成做多。
        from: "1545244113614540962"
cautions:
  - 被之前的暴漲暴跌軋怕、凹怕之後，很容易破戒逆勢；參數就擺在眼前還摸頭猜底，等於在享受賭博的快感。
  - 緩跌最容易讓人一路凹單，結構沒翻轉前不要一直等反彈。
  - 大級別已經反轉時，心裡不要還掛著原本往上的目標價。
