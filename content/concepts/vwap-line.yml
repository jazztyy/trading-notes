slug: vwap-line
title: 均價線：日均與月均判斷多空
topic: 指標設定
order: 4
summary: Shawnnnn 寫的期貨均價線指標：先判斷現在是多方還是空方、順勢做，均價線只當參考位置（例如空方盤反彈到均價線做空）；加上當月均價線後，當日均往下穿過月均，盤勢基本上就是空方。
sections:
  - heading: 這個指標是什麼
    text:
      - 個股常有人看均價線，期貨其實也有。Shawnnnn 自己寫了一個期貨的均價線指標，放在資料交換區，可以直接拿來用；後來更新一版，多了當月均價線，在設定裡可以自己勾選要不要顯示「當日均價線」和「當月均價線」。
      - 均價線是多一種解讀趨勢的方式，不是非看不可。Shawnnnn 說，如果覺得雜訊太多，單純看策略做事也可以。
  - heading: 先判斷多空，均價線只是參考位置
    text:
      - 用法是先判斷現在是多方還是空方，再照著做。Shawnnnn 示範的那段前面一直是空頭，價格反彈到均價線就做空；如果價格反而站上均價線，就是可能要停損的地方。
      - 有人問價格到均價線是不是會小彈一下，Shawnnnn 的回答是不一定，它就是一個參考位置。他看到價格快到均價線時也會做逆勢單，但一樣要跑很快。
    items:
      - 空方盤：反彈到均價線附近做空，站回均價線之上就要考慮停損。
      - 逆勢單：價格快到均價線時可以做，但要跑很快。
      - 均價線不保證會撐住或壓回，只是參考位置。
    figures:
      - src: /img/1549286432793694208-image.jpg
        caption: 空方盤的用法：2 分K 價格一路在青色虛線（均價線）下方，兩次急彈到均價線附近（黃圈）就是做空的位置；右邊紅圈價格碰到、甚至穿過均價線，就是可能要停損的地方。
        from: "1549272028836790304"
  - heading: 加上當月均價線
    text:
      - 加上當月均價線之後，多了一種判斷趨勢的方式：Shawnnnn 說，當日均價線往下穿過當月均價線，基本上盤勢就是空方了。剩下的細節，要靠自己去復盤。
      - 月均線也是一個壓力位置。有一次夜盤急漲到壓力、又剛好碰到月均線（Shawnnnn 說「月均線到站」），他就反手做空一口，停損只設在上方 30 點，因為「這個盤那麼強不能開玩笑」；Alina 也認為這裡就是吃個回測看看。她另外提醒，夜盤收高、日盤才好出貨，真的要空可以等日盤再看。
    figures:
      - src: /img/1549295308448600095-image.jpg
        caption: 日均穿過月均就偏空：2 分K 青色虛線是當日均價線、淡紫色虛線是當月均價線，黃圈處當日均往下穿過月均，之後價格一路走空。
        from: "1549272028836790304"
      - src: /img/1549799673559130164-image.jpg
        caption: 月均線到站：夜盤 2 分K 一路急漲，碰到上方淡紫色虛線的月均線，Shawnnnn 在這裡反手空一口，停損設在上方 30 點。
        from: "1549799413730508902"
  - heading: 盤中搭配趨勢線看壓力支撐
    text:
      - 盤中 Shawnnnn 會把均價線和其他線放在一起看壓力支撐：開盤後價格被均價線壓著（「均價壓」）、拉回來碰均價線測試，都是他會提出來的觀察點；同時注意下降趨勢線還在不在、能不能先突破，以及 5 分K 的 55MA 有沒有站穩。
      - 他也會分辨價格是在區間的上下緣還是中間，在中間價位比較不好判斷；大週期在高檔震盪時，他認為其實還是偏多。Alina 則會觀察 60 分K 很多插針的區間，看撐壓有沒有轉換、是不是有效轉成支撐。
    items:
      - 均價壓：價格在均價線下方被壓著，偏弱。
      - 碰均價線測試：價格回到均價線，看撐不撐得住。
      - 下降趨勢線：注意趨勢線還在不在，等先突破再說。
    figures:
      - src: /img/1552502971147751456-image.jpg
        caption: 碰均價線測試：5 分K 拉高後一路回落，回到下方青色點線的均價線（綠框）測試。Shawnnnn 當天的看法是 48000 不要再破就好。
        from: "1552486179159674881"
cautions:
  - 把均價線當成一定會彈的支撐。Shawnnnn 說不一定，它只是參考位置。
  - 逆勢單已經接近均價線還不走，逆勢單要跑很快。
  - 強勢盤裡反手做空，停損一定要先設好、設近。
