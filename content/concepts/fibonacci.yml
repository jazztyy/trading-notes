slug: fibonacci
title: 斐波那契：回撤看守位、延伸算目標
topic: 撐壓點位
order: 6
summary: 用斐波那契量一段漲幅，回檔時看 0.382、0.5、0.618、0.786 哪一個位置守住，在位置上預掛單、一關一關防守；往上則用 2 倍延伸算目標價。急殺當天量當日高低點，跌深了就拉日K 大波段看。
sections:
  - heading: 怎麼拉斐波
    text:
      - 斐波那契（群組裡簡稱「斐波」）是拿一段已經走完的漲段來量回檔深度：把這段的低點和高點連起來，工具會標出 0.236、0.382、0.5、0.618、0.786 等比例的價位，回檔時就看價格在哪一個位置守住、在哪一個位置有反應。Q 姊有一部分策略就是用斐波抓守位和目標價，Shawnnnn 和 Alina 拆解她的點位之後也常拿來用。
    items:
      - 先決定量哪一段：可以是 30 分K 的一段漲段、日K 的大波段，當天急殺時也可以只拉當天的低點到高點。級別不同，量出來的位置就不同，要清楚自己看的是哪個級別的哪個位置。
      - 注意 0 和 1 設在哪一端：同樣叫 0.382，0 設在低點時是比較深的回檔，0 設在高點時是比較淺的回檔。群組裡兩種拉法都有（Q 姊那張日K 的 0 在低點；Shawnnnn 的 30 分K、1 分K 的 0 在高點），聽到別人說「回到 0.618」時，要對照圖上標的價位。
      - 拉好之後每條線旁邊都會標價位，記價位就好；要手算就是「低點 + 漲幅 × 比例」，Alina 拆 Q 姊的守位時就是把那段漲幅乘上 0.618。
  - heading: 回檔守哪裡、怎麼掛單
    text:
      - 守位看哪一個比例，Shawnnnn 和 Alina 看法不同。以 Q 姊那張日K（0 在回測低點、1 在前高，數字越小回得越深）來說：Shawnnnn 認為能回踩到 0.382 最好；Alina 則說回到 0.382 已經是「無腦多」的位置，行情應該先守住 0.618，回到 0.786 她就會進單，不必等那麼深。
      - 實際操作上，Alina 會在斐波位置預掛多單等回測，不追價。她在 0.618 和 0.5 都掛了單，本來以為不會到，結果一次回測到位，0.618 成交後反彈將近一千點。之後價格再回來測，她把 0.618 當成「守位戰」再加一口多，同時先想好守不住時下一關在哪裡。
    items:
      - 預掛：在 0.618、0.5 先掛多單等回測（Alina）。
      - 一關一關看：0.618 沒守住看 0.5，0.5 沒守好看 0.382，再破就看下面的整數關卡（Alina）。
      - 搭配盤中的價位：Alina 賭 0.618 守住而加多單的那天，盤中跌破開盤價，她不喜歡，就先把多單全平觀察。
      - 深的位置測一次就好：Shawnnnn 說回測那麼深的位置一次就夠了，真的再下去會很醜，不要期待它一直回來讓你撿。
      - 空單的目標也可以放在斐波位置（Alina 原本的空單目標就是 0.786），而且要事先掛好平倉單：Shawnnnn 說做空來得急、走得也快，像颱風一樣，適合拚爆擊但要記得平；Alina 也是靠預掛單分批平倉，才沒有在反彈時把獲利吐回去。
    figures:
      - src: /img/1556511277269127209-image.jpg
        caption: Q 姊點位的斐波拉法：微台日K 從回測低點 47630（0）拉到前壓 48946（1），往下依序是 0.786（48664）、0.618（48443）、0.5（48288）、0.382（48133），這種拉法數字越小回得越深。Alina 後來就是在 0.618 的 48443 接到多單。
        from: "1556496496323723324"
  - heading: 用延伸算目標價
    text:
      - 斐波也能往上算目標。Shawnnnn 拆解 Q 姊的目標價時發現，算法是把日K 的前高減掉突破後回測的低點，得到這段的漲幅，再把漲幅加回前高；Alina 指出這就是斐波的延伸目標，在斐波上對應的是 2 倍的位置。同一組斐波往下是回檔的守位，往上是目標，可以一起看。
    items:
      - 目標價 = 前高 +（前高 − 回測低點），也就是從回測低點拉到前高的斐波 2 倍延伸。
    figures:
      - src: /img/1556507662969995358-image.jpg
        caption: 延伸目標要用的兩個點：微台日K 上面紅圈是前壓 48946，下面紅圈是突破後回測的低點 47630，相差 1316 點，加回 48946 就是 Q 姊的目標價 50262（上一張圖最上面的 2）。
        from: "1556496496323723324"
  - heading: 換個級別量：當日急殺與日K大波段
    text:
      - 行情急殺時，Shawnnnn 會量比較小的一段來判斷「回得夠不夠深」：當天急殺就拉當天的低點到高點，夜盤急殺就量 30 分K 的那段漲段。Alina 同時會看盤中的其他訊號，例如開盤價守不守得住、反彈能不能站回均線，以及 5 分K 低檔是不是插了很多針——插針代表下跌力道在變弱。
      - 跌得更深時就要拉大級別看。Shawnnnn 用日K 大波段量，不管從哪一個低點拉，價格都已經回到 0.382、0.236 一帶；Alina 的看法是先守住 0.382 再看反彈狀況。她用另一組日K 斐波復盤時也說，測到大級別的 0.382 之後通常會先反彈，但反彈站不上上一個位置、而且一次比一次弱，就還會再往下。
    items:
      - 當日急殺：用當天低點拉到高點，回到 0.618 就算「夠深了」，再往下 0.786 也可能有反應（Shawnnnn）。
      - 30 分K 漲段回踩到 0.786，沒守住就看季線（Shawnnnn）。
      - 日K 大波段測到 0.382：守住再看反彈，0.382 適合試短多（Alina）。
      - 測到 0.382 後的反彈站不上 0.236，力道一次比一次弱，就還會再下（Alina）。
    figures:
      - src: /img/1561954982687674388-image.jpg
        caption: 當日急殺用當天的高低點拉：微台 1 分K 從當日低點 46222 拉到高點 46917（這張 0 在高點），午盤急殺回到 0.618（46487），Shawnnnn 說「夠深了」，下一關是 0.786（46371）。圖上的 BUY、SELL 只是白線穿過 EMA 時顯示的標記。
        from: "1561954161585815597"
      - src: /img/1561303186302574716-image.jpg
        caption: 大級別測到 0.382：小台日K 從 39439 拉到 50265，一根大黑K 直接跌到 0.382（46129）。Alina 判斷結算前會先反彈，但往上站不上 0.236（47710），到 47XXX 就差不多了，之後還會再下。
        from: "1561303186302574716"
cautions:
  - 剛測過的斐波支撐再測只會越來越弱，不要在那裡硬接：學員想在剛去過的日K 0.382 接多，Alina 勸她別衝動，因為前一天和剛剛都已經測過了。
  - 拉的那一段不同、0 設的那一端不同，同一個比例的價位就不同；跟別人的斐波點位之前，先確認對方量的是哪一段、哪個級別。
