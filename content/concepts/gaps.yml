slug: gaps
title: 跳空缺口：等回補，缺口就是撐壓
topic: 撐壓點位
order: 8
summary: 跳空缺口很常被回補，所以跳空後先別追，補完缺口再做比較踏實；跳空開高跳太遠，可以期貨開盤先小空、等現貨開盤回測。跌深反彈時，上方的缺口就是反彈目標和空點；往上突破留下的缺口，那根 K 棒的低點則是關鍵支撐。
sections:
  - heading: 跳空缺口常被回補
    text:
      - 開盤直接跳過前一段價格，中間留下的那段空白就是跳空缺口。Alina 的經驗是這種跳空都有很高的機率會回補，所以跳空之後先別急著追：日盤留下跳空缺口、行情又還沒完全轉多時，她就先不追多，判斷往上空間有限、往下會去補缺口。
      - 反過來說，缺口補完之後再做多就比較踏實。夜盤又一次跳空往上時，學員擔心又要回補，Alina 和 Shawnnnn 都指出缺口剛剛已經補過了，Alina 說補了再做多比較踏實。
    items:
      - 跳空後還沒完全轉多：先不追多，等它回補（Alina）。
      - 缺口補完再做多，比較踏實（Alina）。
      - 缺口不一定當天就補：Alina 預期反彈會去補的缺口，她自己也估要隔幾天才會到。
  - heading: 跳空開盤：看現貨開盤前後怎麼補
    text:
      - 期貨 8:45 先開盤、現貨 9:00 才開，跳空常在這段時間處理掉。Alina 認為缺口在現貨開盤前就補完也 OK，接著看能不能站回支撐；現貨開盤前 15 分鐘往下測低也可以接受，比 9 點現貨開盤後才往下殺好，但前提是要 V 回來，不能一路往下。
      - 跳空開高、而且跳得太遠時，Alina 認為 9:00 現貨開盤後應該會往下回測，所以跳空開盤本身就是好空點。她的做法是 8:45 開盤先小空，等現貨開盤回測時回補，再反手看它往哪裡走；她也坦白只有把握做開盤這一段，因為怕現貨開出來直接 A 轉。
    items:
      - 現貨開盤前就補完缺口：OK，接著看能不能站回支撐（Alina）。
      - 現貨開盤前 15 分鐘測低可以，前提是要 V 回來（Alina）。
      - 跳空開高跳太遠：期貨開盤先小空，9:00 現貨開盤回測時回補，再看走向（Alina）。
      - 價格如果突破開盤的高點，就可能再往上衝一段，空單要小心（Alina）。
    figures:
      - src: /img/1562278627989528576-image.jpg
        caption: 跳空開高碰到壓力：台指期 30 分K 結算日跳空開高，直接衝到紫色 200MA（約 47250）被壓回，下方紅線是今日壓力 46953。Alina 開盤先小空、等現貨開盤回測時回補，並指出 30 分K 的 200MA 還在壓制。
        from: "1562263834238910559"
  - heading: 跌深反彈：上方缺口是目標也是空點
    text:
      - 一路跌下來時，上方會留下缺口。Alina 的看法是反彈會先去補缺口，補完再往下；從高點下來留下幾個缺口，就可能震盪著補幾次，補完一個往下一段，下一次反彈再去補下一個。所以跌深反彈時，上方最近的缺口就是她的反彈目標，補完缺口就是空點；反彈能到缺口已經很了不起，不會直接漲回前高。
    items:
      - 反彈目標：上方最近的缺口（Alina）。
      - 補完缺口就是空點；有幾個缺口，就可能來回補幾次（Alina）。
      - 空單可以往缺口分批下：價格往上漲向缺口的過程中，Alina 打算一格一格分批佈遠月的微台空單，近月合約則留著做短進短出。
    figures:
      - src: /img/1562106870875947168-IMG_5037.jpg
        caption: 上方的缺口就是反彈目標：小台近月 10/15 凌晨跳空往下（橘色直線那根之後），在 47940 留下缺口（橘色橫線），之後一路跌到 46109。Alina 預期反彈會先回去補這個缺口，補完就是她的空點。
        from: "1562106870875947168"
  - heading: 突破缺口那根 K 棒的低點：關鍵支撐
    text:
      - 往上突破時留下的跳空缺口，回頭會變成支撐，Alina 看的是那根跳空 K 棒的低點。她舉的例子是一個日K 跳空缺口：當初這裡是攻了好多次才突破的壓力，價格跌回來時，這根 K 棒的低點一定要守住；守不住就會滾回下方原本的整理框，上面又變成「魔王大壓」。Shawnnnn 則補充，跌下去測試、收針站回來，也算漂亮的走法。
      - 真的跌回框裡之後，Alina 就改用框來看：反彈到框框上緣是壓力，下方的季線、半年線都可能去摸一摸，大概就在這個框裡震盪。
    items:
      - 往上突破的跳空缺口，那根 K 棒的低點是關鍵支撐（Alina）。
      - 跌破後測試、收針站回：還算漂亮（Shawnnnn）。
      - 守不住：回到下方的舊框，框的上緣變壓力，往下看季線、半年線（Alina）。
    figures:
      - src: /img/1560147286393233408-IMG_4850.jpg
        caption: 缺口那根 K 棒的低點：台指日K 游標停在 6/23 那根跳空 K 棒，低點 47404 就是 Alina 要守的位置；10/15 盤中價格跌回這附近，她說一定要回到 47404 以上。
        from: "1560113894767333417"
      - src: /img/1560220392684265643-IMG_4862.jpg
        caption: 守不住就回到舊框：小台日K 紅框是約 45100～47070 的舊整理區間，價格從 50265 跌下來，回到框框上緣。Alina 改看框內震盪，上緣是壓力，下方去找季線。
        from: "1560113894767333417"
cautions:
  - 缺口不一定當天就補：Alina 預期反彈會去補缺口，但也說可能要隔幾天才到，不要以為當天一定補。
  - 跳空開高不要追多：跳得太遠很容易回測，Alina 反而把跳空開盤當成好空點。
