slug: candle-volume
title: K 棒與量能：下影線、急拉無力與放量
topic: 盤勢判讀
order: 2
summary: 看 K 棒的影線和成交量判斷多空力道：急跌後下影線短代表承接不夠，長下影又配大量才是買盤進場；急拉卻留長上影、沒過今日高，代表沒力，Alina 會反手空。量能是輔助，下跌放量要往下、急殺量不大只是獲利了結，量縮振幅大時量就不是重點。
sections:
  - heading: 下影線：看有沒有人承接
    text:
      - 急跌之後收出的那根 K 棒，下影線的長短可以看出低檔有沒有人接。下影線很短，代表價格跌下去之後幾乎沒有被拉回來，Alina 說這表示多方力量不夠，但可以再多看幾根；Shawnnnn 補充市場沒辦法說得那麼絕對，只是這樣代表空方還是很強。
      - 反過來，如果下影線拉得很長、成交量又很大，代表買方很強、有很多人在低檔承接，這時才比較有支撐的意味。
    items:
      - 下影線短：承接力道弱，空方仍強，先多看幾根再說。
      - 下影線長＋大量：低檔有大量買盤，買方強。
    figures:
      - src: /img/1557387561842778336-image.jpg
        caption: 承接不夠的長相：微台 5 分K 連續長黑跌破藍色水平線，最後一根只留很短的下影線（紅圈），代表跌下去幾乎沒人接。
        from: "1557387038918053980"
      - src: /img/1557388329471713401-image.jpg
        caption: 對照的例子（Shawnnnn 舉的）：K 棒殺到藍色缺口線下方後拉回，留下長長的下影線；如果這時成交量又很大，就代表有很多人在低檔承接。
        from: "1557387038918053980"
  - heading: 量能：放量往哪邊走
    text:
      - 下跌時放量，代表節奏是要往下，不是打到支撐。有人看到 2 分K 急跌出量就以為有支撐，ROCH 的看法是要支撐至少要大量再加一根長下影（T 字線），nick_AJ 則認為至少要看到反轉。想確認有沒有支撐，Shawnnnn 建議去看日K 的白線或藍線有沒有守住；他自己的策略是順勢交易，想摸底摸頭可以，但一定要停損。
      - 也不是每次急殺都代表賣壓重。剛漲完一段之後的急殺，要看下殺的量：量不大時，Shawnnnn 把它理解成部分獲利出場，後面還有機會再噴；剛噴完一段本來就需要整理，可以重新等好位置。
      - Alina 想在點位指標裡加入量的判斷：帶量上穿交界（她點位指標的多空分界）偏多、帶量下穿偏空，並用成交量均線來定義多少算多，超過的標成爆量；無量的 K 棒就不用太看。她主要用量來判斷關鍵位附近 K 棒的強弱，也認為大量位的高低點要尊重。Shawnnnn 則提醒量很難衡量（要跟什麼比、跟前幾根比），而且量能有時不是關鍵，像量縮但振幅大的盤，程式交易多半改用 ATR 或 ADX 判斷振幅。
    items:
      - 下跌放量：節奏往下，不要當成支撐。
      - 要算支撐：大量加長下影，或看日K 白線、藍線有沒有守。
      - 漲完一段後急殺、量不大：比較像獲利了結，不算賣壓重。
      - 量縮振幅大：量不是重點，可以參考 ATR、ADX。
    figures:
      - src: /img/1544631528078839909-image.jpg
        caption: 下跌放量不是支撐：台指 2 分K 跌破雙線後連續綠 K，下方成交量一根比一根大，右上趨勢表 1 分到 1 小時全偏空，這是要往下的節奏。
        from: "1544631298507804752"
  - heading: 急拉無力就反手
    text:
      - 消息面突然急拉，但沒有過今日高、K 棒又留下長上影，Alina 認為那根 K 棒沒力，會直接反手空。她的判斷是不尋常的上拉通常都會回來，只是回到什麼程度而已。反過來，如果那根急拉沒有留針、下一根又是帶量的紅 K，就代表買盤是真的，這時她就不敢空。
      - 空下去之後也要一步步看：往下破也是要一關一關破，先看下方的支撐區塊；支撐站不回、價格又在 EMA200 之下，她就偏空看，價格一直站不上上方的關卡，回測的機率就大。停損抓價格重新站上支撐，停利可以分批出。
    items:
      - 可以空：急拉沒過今日高、留長上影。
      - 不要空：急拉沒留針，下一根又是帶量紅 K。
      - 停損：價格重新站上支撐。
    figures:
      - src: /img/1557791261447028788-IMG_4567.jpg
        caption: 急拉無力：小台 5 分K 消息面急拉一根，下方量柱爆量（橘色），上影線碰到上方紫色 EMA200 就被打回、沒過今日高，之後又回到綠色「今日支撐」附近磨。Alina 就是看這根沒力反手空。
        from: "1557789617858547744"
  - heading: 紅 K、綠 K 與盤整
    text:
      - Alina 看到可能要連出第 5 根紅 K 時，Shawnnnn 說紅 K 比較常有這種連續超過的情況，綠 K 比較少，所以做多的勝率比較高；但綠 K 通常來得又急又快，反而比較容易賺到大波段。
      - 盤整也有意義。價格在一個區域來回磨、一直沒跌下去，Alina 的說法是「磨磨磨變撐」：磨久了，這一區就變成支撐。
    figures:
      - src: /img/1551441337096863814-image.jpg
        caption: 磨成撐：價格回落到紅色水平線一帶後橫著磨了好幾根、沒有再往下，這區就成了支撐（藍色區塊），最後一根開始往上。
        from: "1551441337096863814"
cautions:
  - 市場沒辦法說死，影線和量都是機率，不是保證，看到訊號也要再多看幾根確認。
  - 下跌出量不要當成打到支撐去接；要摸底摸頭一定要設停損。
  - 量多少算多很難定義，量縮振幅大的盤不要只靠量判斷。
