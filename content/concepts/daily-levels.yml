slug: daily-levels
title: 日內三點位：壓力、交界、支撐
topic: 撐壓點位
order: 1
summary: Alina 每天用前一天日盤的高、低、收算出壓力、多空交界、支撐三個價位：交界之上偏多、之下偏空；只在靠近點位的地方進場（停損好抓），夾在中間不做，進場時機再搭配雙線＋EMA200。
sections:
  - heading: 三個點位怎麼算
    text:
      - Alina 每天先把一天的關鍵位抓出來：壓力、多空交界、支撐。她說光是這一步就讓她少走很多冤枉路，因為點位附近好抓停損，進場前就知道錯了要在哪裡走。
      - 算法只用前一個交易日 8:45-13:45 純日盤的高、低、收，不是含夜盤的全盤數據；所以日盤一收盤，就能算出當天夜盤到隔天日盤適用的三個點位。股票她也用同一套算法。
    items:
      - 交界 =（日高 + 日低 + 收盤 × 2）÷ 4
      - 壓力 = 交界 + 0.75 ×（日高 − 日低）
      - 支撐 = 交界 − 0.75 ×（日高 − 日低）
      - Shawnnnn 把這個公式寫成 TradingView 腳本，圖上會直接畫出三條線。他回測後覺得震幅不大的盤蠻好用；震幅大的盤，把前幾天的交界、壓力、支撐也拿來參考會比較好。
      - 近月和下個月的合約價位不同，Alina 會把抓好的關鍵位換算成自己交易的那個月份，再取整數。
    figures:
      - src: /img/1550890763343106069-image.jpg
        caption: Shawnnnn 寫的腳本畫出來的樣子：微台 1 小時K 上，紅、黃、綠三條虛線分別是壓力 47070、交界 46580、支撐 46089。每天換一組數字，所以線呈階梯狀；這時價格已經站在壓力之上。
        from: "1550401481386102789"
  - heading: 用交界分多空
    text:
      - 交界是當天的多空分水嶺：價格在交界之上就偏多看、偏多做，在交界之下就偏空看、偏空做。價格跌到交界附近觸底又彈上去，代表多軍沒有要讓，接下來就看雙方怎麼打；反過來，在交界站不穩，就是轉弱的訊號。
      - 除了公式算出的點位，Alina 也會抓一個自己心裡「不能破」的關鍵位。這個位置一跌破，就代表多頭結構被破壞，她會停損，不會因為還在區間裡就繼續抱。
    items:
      - 交界之上：偏多。交界上、壓力下這一段，Alina 通常不太敢空，除非已經很接近壓力。
      - 交界之下：偏空。
      - 交界觸底又彈上：多軍不讓，Alina 有時會直接在交界掛一張多單試試。
      - 關鍵位跌破：多頭結構破壞，停損。
  - heading: 只在點位附近進場
    text:
      - 點位最大的用處是讓停損好抓。Alina 只在靠近壓力或交界的地方進場：離點位近，錯了馬上知道，風險值也好算。夾在兩個點位中間就是區間震盪，她不太做，硬做常常被來回巴。
      - 她的原則是「找離哪邊停損好抓的方向做」。同樣在交界之上，如果價格已經很靠近壓力、離交界很遠，她就會保守一點；想空，也要等價格接近壓力點位再觀察。
      - 點位只告訴你在哪裡做，什麼時候進場還是要看線。Alina 的流程是：先抓三個點位定多空，再用 Shawnnnn 的雙線加上 EMA200 找進場點，最後用 30 分K 參數和八弟儀表板確認整體趨勢，目的是不要逆勢、不要亂凹。
    items:
      - 雙線上穿 EMA200 看多、下穿看空；雙線貼著 EMA200 就是多空還不明。
      - 交界之上、靠近交界：可以試多，交界站不穩就走。
      - 很接近壓力：才考慮空。
      - 夾在中間：不做，等價格走到點位再說。
    figures:
      - src: /img/1550150575017037876-image.jpg
        caption: 點位加雙線的進場：小台 2 分K 夜盤，價格踩進藍色區時量看起來不錯，紅線重新上穿藍線的那一根（nick_AJ 標的紅箭頭）Alina 進多，成交 46965，是她當晚算的壓力 46945 再加 20 點。右上的趨勢表 1 分到日線都偏多。
        from: "1550071454727405619"
  - heading: 停損、反手和掛單
    text:
      - 用點位進場，出場也看點位：後續走勢或線不對就停損，例如站不穩壓力往下、或在交界站不穩。Alina 說大範圍的點位比較好判斷進出場，撐壓就是一關一關看。
      - 停損之後不一定就此收手。如果位置還在交界之上，比一比往上和往下的風報比，覺得往上划算就反手加入多軍；之後如果在交界站不穩，再停損。沒把握時就只做單邊，等上車機會。
    items:
      - Alina 的券商沒有智慧單，她改設「關鍵價通知」，到價再看要不要停損。
      - nick_AJ 的心得是要先果斷進場、再同步設停損，才參與得到行情；Alina 補充還是要看當下位置，已經很靠近壓力、離交界很遠時就保守一點。
      - 價格常差幾點沒踩到交界，掛在點位上的單就沒成交。Alina 吃過這個虧後，夜盤掛單都會加個幾十點，例如在壓力加 20 點掛。
    figures:
      - src: /img/1550071757644374107-image.jpg
        caption: 差一點沒踩到交界：Alina 的空單等著價格去交界（圖下方的橘色虛線應該就是交界），結果跌到藍色區就彈起，紅線接著上穿藍線。她說有盯盤的話會在雙線交叉那裡停損，之後因為位置都在交界之上，就反手做多。
        from: "1550071454727405619"
cautions:
  - 不好的位置不硬做、不逆勢亂凹、不頻繁交易，這是 Alina 給自己的規矩（她也承認自己還是常叛逆）。
  - 夾在壓力和交界中間進場最容易被巴；進場前先想好停損放在哪個點位，想不出來就不做。
  - 公式點位 Alina 自己也還在復盤驗證，震幅大的盤參考性會下降，要搭配前幾天的點位一起看。
