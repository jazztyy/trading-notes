slug: ema200
title: EMA200：分K的多空分水嶺
topic: 指標設定
order: 2
summary: Alina 在 Shawnnnn 的雙線之外另外加一條 EMA200，當分K的多空分水嶺（她也叫「交界」）：雙線在 EMA200 之上偏多、之下偏空；雙線貼著 EMA200 時多空不明，不做。
sections:
  - heading: 這條線是什麼
    text:
      - Alina 最早是看到別人用 EMA12、20、200 搭配判斷的策略，發現 EMA12、20 跟 Shawnnnn 的兩條線差不多，所以只多加了 EMA200，復盤後覺得判斷勝率還行就一直用。對她來說這條線就是分K的多空分水嶺：雙線不知道怎麼進場、或線很黏的時候，用它來輔助判斷。
    items:
      - 設定：TradingView 加指標時搜尋 EMA，選 Exponential moving average，長度改成 200。它是另外加的一條線，不是把雙線改成 200；也要確認設的是 EMA，不是 SMA。
      - 主要看 5 分K；有時會看大級別，確認雙線在 EMA200 上面還是下面。
      - 可以設「上穿 EMA200」「下穿 EMA200」的通知，不用一直盯盤。
      - 別人說的「200T」就是這條線。
  - heading: 怎麼判斷多空
    text:
      - 規則很簡單：雙線在 EMA200 之上偏多、之下偏空。價格跌破 EMA200、雙線又跟著下穿，就是走空方；開盤開在交界之上、雙線也都在 EMA200 上，就偏多看。
    items:
      - 偏多：雙線漂亮上穿 EMA200，而且離它有一段距離。這時空單都只是短空（吃壓力壓回而已），每次壓回都可以拉回加多，賣飛也還能補票。
      - 偏空：EMA200 一直上不去、雙線又快下穿，就偏空看；反彈上去碰到藍線可以試空，之後往上碰到都可以加空。
      - 不做：雙線貼著 EMA200、很黏的時候多空容易打架，很容易被來回巴，Alina 這種時候通常不做。
    figures:
      - src: /img/1555408615324655690-Screenshot_20261002_103820_TradingView.jpg
        caption: 偏多的長相：5 分K 白線、橘線都在藍色 EMA200 之上往上走，而且離它有距離，右上的趨勢表 1 分到 1 小時也全部偏多。這種線型每次壓回都可以加多。
        from: "1555408452241850421"
      - src: /img/1559453708675190856-image.jpg
        caption: 放到大級別看：小台 1 小時K 的紅藍雙線往下壓，K 棒跌破紫色 EMA200，代表更大的趨勢在轉弱，多單要特別小心。
        from: "1559444548525101098"
  - heading: 怎麼進出場
    text:
      - Alina 的節奏是：雙線上穿 EMA200、型態標準就進多；中間回踩只要離 EMA200 還有距離就加碼；雙線靠在一起時出場。空單反過來做。EMA200 告訴你方向，實際進場位置還是要配合點位和線的走勢。
    items:
      - 不要一碰到 EMA200 就動作：快線和慢線才正要交叉時進場，比較容易被雙巴（Shawnnnn）。
      - 站不上就停損：價格兩次碰 EMA200 都站不上，第一個壓回時多單就要停損，之後十字 K 再往下就該空；跌破支撐、開始下穿時進空，停損放在重新站回支撐，好判斷。
      - 方向不明時可以先對鎖，等方向明確再加碼。
    figures:
      - src: /img/1554870689847320636-IMG_3526.jpg
        caption: 一個完整的循環（Alina 引用的 5 分K 範例，白線、藍線是雙線，橘線是長天期 EMA）：左圈上穿很標準就進多，中間回踩離 EMA 還有距離就加多，右圈雙線靠近 EMA 時出場。
        from: "1554868997021896715"
      - src: /img/1560708394191691867-IMG_4928.jpg
        caption: 站不上就該走：小台 5 分K 兩次上攻紫色 EMA200（紅圈）都站不上，接著一根長黑跌破，趨勢表從 2 分到 4 小時都轉偏空。Alina 復盤說第一個壓回時多單就該停損。
        from: "1560653990436540507"
cautions:
  - 站不上 EMA200 還一直主觀猜反彈，是 Alina 復盤時檢討自己的錯：「明明 200ma 沒過、支撐沒過，一直猜底」。
  - 雙線已經離 EMA200 很遠才追進去，要小心乖離過大的拉回。
  - 回頭看圖會覺得很好用，實際用之前還是要自己復盤驗證勝率，Alina 自己也是復盤後才續用。
