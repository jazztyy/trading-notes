slug: level-test
title: 點位試單：第一次測最敢，越測越弱
topic: 撐壓點位
order: 2
summary: 價格第一次碰到支撐或交界最值得試單，通常會先彈一段；被測越多次越弱，要越小心。試單前一定先想好停損：破撐就走，或放在跌破會加速的跳水位；點位和 EMA200 重疊的地方是更好的加碼位。
sections:
  - heading: 為什麼在點位試單
    text:
      - Alina 價格到點位都會試單，再看裸 K 和量的反應。她在點位進場，不是因為點位一定守得住，而是因為停損好抓：守住就續抱，破了就閃。她說進單原則都要「好抓筍」，不然很容易凹太大。
      - 試哪個方向要看大級別。大級別偏多時，她更願意試支撐位的多單；盤勢是短空長多時，就把多單掛在交界位。穩一點的做法是看價格到那個位階的反應：碰到支撐沒有強彈，就可能再往下。
    items:
      - 附近剛好沒有算出來的點位時，Alina 會參考 TradingView 內建的 LuxAlgo - Smart Money Concepts（聰明錢）指標，藍色區塊當支撐、紅色當壓力，一樣在藍色撐位試單、破了就閃。指標搜尋貼上「LUXALGO-SMART MONEY CONCEPTS」就找得到（Shawnnnn）。
      - 低接時看到價格在點位一直插針（留下影線），Alina 會再多買一口微台。
  - heading: 第一次測最敢試
    text:
      - 維尼連續兩天觀察到，價格到 Alina 算的交界位通常會先彈約 100 點；第二次測又彈，但彈得沒第一次有力；第三次就直接往下跌了 100 點。
      - Alina 的看法是：關鍵位要測幾次才會破沒有一定，但越測越弱，測太多次很容易就破，所以她不喜歡關鍵位一直被測。第一次測她最敢試，支撐第一次被踩通常不會破、試單比較安全；被踩很多次她就不一定試了。也有另一派說法是越測越穩，維尼補充那比較像向上嘎空時越嘎越兇；Alina 說價格是從上面還是從下面來測，結果也有差。
    items:
      - 第一次測：最敢試，通常會先彈一段（交界位約 100 點）。
      - 第二、三次測：反彈一次比一次弱，要小心跌破。
      - 撐不撐看量：只要不是帶量下穿，就表示多軍還有撐。
    figures:
      - src: /img/1552151243458220094-image.jpg
        caption: 掛在交界位試多：Alina 的 K 線圖局部，橘色虛線是交界位。價格第一次跌破後馬上被一根上漲長 K 拉回，第二次只有下影線碰一下就彈，但彈得比第一次弱；這天後來第三次測就往下跌了 100 點。
        from: "1552136499359912040"
  - heading: 試單前先想好停損
    text:
      - 試單一定要先想好停損在哪。掛在支撐或跳水位低接常常會成交、也真的會反彈，但 nick_AJ 提醒要先設好下一個支撐當停損，不要成交了才想。Alina 也覺得設好智慧單很重要，至少保利或停損，不要損失太多本金。
      - 用九大點位表的人，停損常放在跳水位。有新手問為什麼，nick_AJ 的回答是「因為要跳水了」：跌破跳水位常會加速下殺，放在這裡等於在加速之前先離場。
    items:
      - 交界位的多單：穿過交界後連兩根還在跌，或下一根帶量下跌，Alina 就停損。她承認有時會被騙線，但在這個位置她比較有把握。
      - 支撐、跳水位低接：先設好下一個支撐當停損（nick_AJ）。
      - 做多靠前低防守：Shawnnnn 說前低就在那裡很好守；覺得離前低太遠，就等更好的價格再進。
      - 被問到測了三次會不會一路往下，Shawnnnn 說都有可能，市場永遠是對的，你只能設停損。
      - Shawnnnn 另一個簡單觀察：數日K 連續收黑（綠K）幾根，連續五根的機率很低。
  - heading: 點位和 EMA200 重疊時
    text:
      - 單一點位已經值得試單，兩種不同來源的支撐疊在一起更強。Alina 的例子是交界位剛好也在 5 分K EMA200 的位置，等於雙重支撐；價格下跌回測時沒有貫穿交界就彈上來，這裡就是漂亮的加碼位。
    figures:
      - src: /img/1559863607574143070-image.jpg
        caption: 雙重支撐的加碼位：小台 5 分K，今日交界位 48862（橘色虛線）和紫色 EMA200（約 48867）幾乎重疊，價格一根急跌的長 K 打下來，碰到就彈回，沒有貫穿。
        from: "1559862471823724645"
cautions:
  - 同一個支撐剛測過又來測，只會越來越弱，不要在那裡硬接。
  - 別人給的點位區間也會被貫穿：Mikey 跟著別人的區間做多，結果區間被打穿，他的檢討是應該等訊號確定出來再跟著進單。
  - 低接單成交後才想停損就太晚了，下單前先把下一個支撐的停損設好。
