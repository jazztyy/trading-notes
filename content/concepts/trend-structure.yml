slug: trend-structure
title: 趨勢結構：漲多跌少與止跌跡象
topic: 盤勢判讀
order: 1
summary: Shawnnnn 單看 K 棒判斷趨勢：向上是漲多跌少、向下是跌多漲少，這個節奏一改變就是結構在轉。下跌中要先等到止跌跡象（橫盤一段時間，或區間內開始跌少漲多），才在回踩前段高點的位置試多；沒有止跌跡象就順著空方照線做。
sections:
  - heading: 漲多跌少、跌多漲少
    text:
      - 不用指標、只看 K 棒也能判斷趨勢。Shawnnnn 的看法很簡單：趨勢向上時，每一段都是漲得多、回得少，一路「漲多跌少、漲多跌少」；趨勢向下時反過來，是「跌多漲少、跌多漲少」。把每一段的高低點連起來看，就知道現在是哪一種節奏。
      - 當原本漲多跌少的走勢開始變成跌多漲少（或反過來），就是趨勢改變了。所以判斷的重點不是某一根 K 棒漲跌多少，而是一段一段的漲跌幅度誰大。
    items:
      - 向上：每段上漲的幅度大於回檔，高點、低點一路墊高。
      - 向下：每段下跌的幅度大於反彈，反彈高點一路降低。
      - Shawnnnn 習慣用 5 分K 看這個結構。
    figures:
      - src: /img/1555243886614544528-image.jpg
        caption: 結構從多轉空：微台 5 分K 左半段的橘色箭頭是漲多跌少，右半段的紫色箭頭變成跌多漲少，反彈高點沿著藍色下降線一路降低，往粉紅色支撐線壓過去。
        from: "1555243886614544528"
  - heading: 結構改變就是轉折
    text:
      - 結構改變的那一段，就是趨勢開始要轉的時候。Shawnnnn 拿一次早盤轉多的例子說明：前面一直是跌多漲少，到了某一段開始漲多、不再漲少，結構就確定在改變，H 大也差不多在那之後跟大家說轉多。看得出這個轉變，就不用等指標翻過來才知道方向換了。
      - 轉折之後也不是馬上追。Shawnnnn 說突破之後的回踩是他會觀察的機會，等價格突破、回頭測試再進。結構還沒翻轉、空方還佔優勢的時候，Alina 的提醒是順勢交易，不要搶著做反向。
    figures:
      - src: /img/1555245298027339879-image.jpg
        caption: 結構開始轉多：微台 5 分K 在粉紅色支撐線附近，框起來的那段開始漲多、不再漲少，之後橘線一路是漲多跌少的上升結構。
        from: "1555243886614544528"
  - heading: 止跌的兩種跡象
    text:
      - 下跌中想找低點做多，要先看到止跌跡象。Shawnnnn 說的止跌有兩種：一種是橫盤一段時間；另一種是區間內開始「跌少漲多」。nick_AJ 補充得更具體：看整個區間，紅 K 開始比綠 K 多，就是跌少漲多了。這不是看到一兩根大紅 K 就勇敢進場，要看的是整段的節奏。
      - 出現止跌跡象之後，回踩前段高點的位置都可以嘗試多單。反過來說，像沿著 5MA 一路下跌、跌破 15 分K 200MA 後就沒再站回的盤，完全沒有止跌跡象，照線做空就很簡單。
    items:
      - 止跌跡象一：橫盤一段時間，不再創低。
      - 止跌跡象二：區間內紅 K 比綠 K 多，開始跌少漲多。
      - 進場位置：止跌後回踩前段高點的地方試多。
      - 空方還強：反彈上去被打下來，紅 K 一根之後下一根馬上又下來。
    figures:
      - src: /img/1557382860053418004-image.jpg
        caption: 止跌後怎麼試多（Shawnnnn 的示意）：微台 5 分K 沿白線、綠線一路跌，之後若開始漲多跌少，突破黃色前段高點後回踩（紅圈）就是可以嘗試多單的位置。
        from: "1557372718901497867"
      - src: /img/1557384519529529394-image.jpg
        caption: 還沒止跌的長相：5 分K 反彈到白線和綠線之間的紅框壓力區就被打下來，一根紅 K 後下一根馬上又是綠 K，Shawnnnn 判斷還是空方強。
        from: "1557372718901497867"
  - heading: 放到日K看
    text:
      - 日K 也可以用同樣的眼光看。日K 連續收大黑 K 時，Shawnnnn 提醒日K 比較少連續跌超過四根，只是這種連續殺的跌法會讓人很不舒服，容易殺漲殺跌。下檔可能到哪裡，他會看日K 下方長均線聚集的區域；Alina 則認為這種跌勢要殺到市場絕望為止。
      - 至於為什麼跌，Shawnnnn 的看法是市場漲跌本來就不需要原因，都是人性推出來的價格，與其找理由，不如看結構。
    figures:
      - src: /img/1562032566343569438-image.jpg
        caption: 找下檔目標：微台日K 連續下殺、跌破白線和紅線，Shawnnnn 圈出下方兩條長均線聚集的 42840-43809 區，當作可能的下檔位置。
        from: "1562031173205753907"
cautions:
  - 空方仍佔優勢、結構還沒翻轉時不要逆勢搶多，先等止跌跡象出來。
  - 止跌要看整個區間的紅綠 K 比例，不是看到一兩根大紅 K 就進場。
  - 漲跌不需要原因，不要因為「不知道在跌什麼」就主觀覺得該反彈。
