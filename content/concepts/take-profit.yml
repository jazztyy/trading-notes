slug: take-profit
title: 停利：分批出場、保本與移動停利
topic: 停損停利
order: 2
summary: 停利沒有標準答案，常用的做法是：成本拉開就讓獲利跑、分批出場（先出一口，其餘設保本）、拉開 50-60 點以上才設保本、用長紅 K 的低點做移動停利；多口部位分不同價位出，碰到 EMA200 這類壓力先減一口。
sections:
  - heading: 停利沒有標準答案
    text:
      - Shawnnnn 說停利方式百百種，你舒服就好。他自己是純手打，以單數算一天大約 25 筆，不太看賺賠比，不對就跑；但不管用哪種停利，一定要停損，不然會很慘。
      - 他舉的例子是：進場後開始噴、成本很好，就可以捏著讓獲利跑。像那次進場後已經賺了 150 點，他覺得拉出去了就放著；但如果你已經滿足，直接停利也 OK。他一個月大約做了 12000 點，也不是一口抱到底，而是做多做空來回做出來的。
    figures:
      - src: /img/1542579423591530606-image.jpg
        caption: 拉出去就放著：微台 2 分K 在藍線附近進多、停損 60 點，價格沿著白線一路往上，已經獲利約 155 點。Shawnnnn 覺得成本拉開了就讓它跑，滿足了停利也可以。
        from: "1542578783750463588"
  - heading: 分批出場
    text:
      - 部位不只一口時，常見的做法是分批出：先出一口落袋，剩下的設保本讓它跑。nick_AJ 不知道停利怎麼抓的時候，就是一口抓 50 點停利、另一口設保本；之後再進場補的一口，一樣設保本。
      - nick_AJ 也分享過帝王策略的分層停利，Shawnnnn 特別說明那是帝王的策略方式，他自己是純手打。
    items:
      - 帝王策略 4 口：第 1 口 150 點出場、第 2 口 330 點、第 3 口 600 點，第 4 口不設停利，抱到反手訊號。
      - 兩口單：一口 50 點停利，另一口設保本（nick_AJ）。
      - 多口部位不要全掛在同一個價位一次平完，要打散到不同價位分批出（Alina）。這樣才不會多口一起抱上抱下：漲上去沒賣到會 FOMO，跌下來沒賣也會 FOMO。
  - heading: 保本與移動停利
    text:
      - 保本不要設太早。有夥伴問 Shawnnnn 為什麼自己很容易被打到保本，聊了才發現他一進場就設保本。進場後上下跑個 20、30 點都有可能，不太可能一進場就往上噴；保本適用在價格已經拉開的時候，例如拉開 50、60 點以上再設，剩下的讓它跑，繼續拉開的話，可以把停利設在至少獲利 100 點的位置。
      - 移動停利則是跟著 K 棒往上移。Shawnnnn 的做法是：看到 5 分K 出現長紅 K，就把停利移到這根 K 的低點。對成本比較遠的人來說，這個位置已經在成本之上，等於先把獲利保住（Annahui 說的「保利」、nick_AJ 說的「至少不虧」）。
    items:
      - 保本：價格拉開 50-60 點以上才設。
      - 再拉開：停利設在至少獲利 100 點。
      - 移動停利：5 分K 出現長紅 K，停利移到這根 K 的低點（Shawnnnn）。
    figures:
      - src: /img/1555257116380368916-image.jpg
        caption: 移動停利的位置：微台 5 分K 反彈接近上方 376-405 的壓力區（綠框），藍圈附近出現 BUY，接著一根長紅 K。Shawnnnn 說看到這根長紅，就把停利移到它的低點（他看微台約 48326）。
        from: "1555254806946258948"
  - heading: 碰到壓力先減碼
    text:
      - 口數多的時候，壓力位是減碼的好地方。Alina 的做法是反彈到 EMA200 先出一口、剩下的觀察，因為這個位置通常會被壓頭；Shawnnnn 補充，尤其是跌很深之後的反彈。出完一口，剩下的再看支撐決定去留：雙線還沒交叉，就先看價格能不能站穩支撐。
      - Shawnnnn 自己的多單也是類似的想法：先看一個關鍵價位附近有沒有站穩，沒站穩就出場。
    figures:
      - src: /img/1557771890662314064-IMG_4553.jpg
        caption: 反彈到 EMA200 先出一口：小台 5 分K 反彈碰到紫色 EMA200（約 49216）就被壓回，跌回今日支撐 49032 附近。Alina 說口數多的話，碰到這裡會先出一口。
        from: "1557770206577692714"
cautions:
  - 一進場就設保本：進場後上下 20-30 點是正常波動，太早設保本很容易被掃掉（Shawnnnn）。
  - 不要跟著別人出場。Mikey 想等 Shawnnnn 出場時跟著停損，Shawnnnn 提醒他自己還沒走是因為單子還是正的，你想損就要自己損；每個人的成本不同。
  - 看到跌下去、反彈上來沒跟到，難免會 FOMO，但不符合進場標準的單就放棄（nick_AJ），Shawnnnn 說這樣的心態很正確。
