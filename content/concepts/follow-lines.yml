slug: follow-lines
title: 看線辦事：照策略執行，不猜不慌
topic: 交易心態
order: 3
summary: 交易都是機率，盤勢背後的原因猜不完，人也一定有偏見。所以看盤要獨立，照自己策略的進出場條件執行；有沒有做錯，也用同一套策略判斷，而不是看事後漲跌。
sections:
  - heading: 為什麼要靠策略，不靠感覺
    text:
      - Shawnnnn 認為做交易一定會有自己的偏見，所以要把盤勢看得獨立一點，靠自己的策略來輔助判斷。看不懂壓力也沒關係，只要照著自己的策略去執行，一定會有大賺的時候。
      - 他的心得是，就算有高手在旁邊信心喊話，最後還是會有自己的偏見，所以只能靠自己的策略最穩；最後也只會相信自己。
  - heading: 照自己的出場條件走
    text:
      - 常見的情況是：多單還沒到自己的出場條件（例如跌破藍線），心一慌就先平倉了。Shawnnnn 的看法是，如果你的策略是跌破藍線才出，那提早走就是你的不對；如果你的策略本來就不是這樣，那你就是正確的。你不能等到等等真的跌下去了，才說「好險我有走」。
    items:
      - 先把自己的出場條件講清楚，例如跌破藍線才出。
      - 有沒有做錯，看有沒有照條件執行，不看事後漲跌。
      - 有時間就復盤，先照這個條件執行看看結果。
  - heading: 指數本來就很洗，靠復盤確認
    text:
      - 怕追在壓力位、被洗下車，所以想多看壓力再進？Shawnnnn 說這沒有絕對，壓力也可能直接被衝破，不然怎麼會常聽到「早知道我勇敢進了」。指數本來就很洗，這很正常要習慣，這也是為什麼有人說成本要好。
      - 交易沒有絕對，都是機率問題，所以才要復盤。事後看圖會覺得「及時反手、無感情的參數」好像都在賺，但沒有算進中間洗盤時你實際的心態和心情；只有自己復盤過，才知道這個策略你撐不撐得住。
    items:
      - 復盤時問自己：這個策略的洗盤耐不耐得住？停損會不會很痛？可以接受連續幾筆虧損？
      - 特別去復盤 15 分K 訊號很多、來回洗的區段，想清楚這時候對應到 5 分K 要怎麼處理。
    figures:
      - src: /img/1557415684433125457-image.jpg
        caption: 要拿來復盤的洗盤區：微台 15 分K 上兩個黃框裡，多空訊號箭頭密集、來回出現，價格上上下下沒有方向。Shawnnnn 要大家去練這種區段，想想對應到 5 分K 該怎麼處理。
        from: "1557412431075090533"
  - heading: 不猜原因，一步一步看線
    text:
      - 盤面出現難解釋的走勢時，大家很容易開始猜背後的原因，例如日盤是不是在防守夜盤低點、夜盤程式單會不會引起連鎖反應。Alina 的結論是當下一步一步看就好，看線辦事不要想那麼多；想太多，出場判斷的雜訊也會變多，回過頭看，其實線都有告訴你該怎麼做。Shawnnnn 也說要猜猜不完，只會讓自己更焦慮。
    items:
      - 震盪盤可以日內結清，每一筆獨立分開，過了就過了（Alina）。
      - 不留倉，假日也比較心安（宸）。
cautions:
  - 對把話講死的人要存疑：篤定說一定到哪、幾點之後開始拉的說法，很容易讓人直接開槓桿進去而受傷（Shawnnnn）。
  - 照紀律走要花很長時間慢慢調整，不是今天下定決心，明天就做得到。
