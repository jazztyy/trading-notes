slug: session-timing
title: 開盤、午盤與尾盤：不同時段的做法
topic: 盤勢判讀
order: 4
summary: 不同時段的波動不一樣：開盤爆量時先保守，拿開盤後一小時的量跟過去的開盤比；中午之後波動小，少做、停利抓小；每天固定的時間點和尾盤常有程式單的大量。不管哪個時段，都要等價格碰到白線或 EMA25 才進場。
sections:
  - heading: 開盤爆量先保守
    text:
      - 開盤時先看量。Shawnnnn 的做法是在開盤後一小時（9:45）去看 1 小時K，跟過去幾天開盤第一小時的量比，明顯多很多就是爆量。爆量時方向通常會比較明顯，但已經爆那麼大的量，他會留意回測可能比較深，所以遇到爆大量會保守一些。
      - 爆量之後如果量開始減少、價格繼續震盪，Shawnnnn 判斷大約 10:20-10:30 會表態方向。這段時間不用一直盯盤，先掛價格警示，讓價格自己跑到位置再說。
    items:
      - 比量：9:45 看 1 小時K，和過去幾天開盤第一小時的量比。
      - 爆量：方向較明顯，但可能回測較深，做法保守一點。
      - 量縮震盪：約 10:20-10:30 表態，先掛價格警示。
    figures:
      - src: /img/1544163331034710048-image.jpg
        caption: 開盤爆量的樣子：微型台指 60 分K 最右邊開盤第一小時的量柱（紅圈）比前面幾天開盤都大很多，Shawnnnn 遇到這種爆量會保守一些。
        from: "1544159268368809984"
  - heading: 午盤之後少做
    text:
      - wenwen 觀察到，不是結算日的話，中午 12 點之後期貨就不太動了。Shawnnnn 也說下午波動基本上不大，他不太會進場；除非先拉一段上去又下來、量也還可以，才會考慮回踩做多，但他也承認這時的雜訊很難濾掉。
      - 下午就算做，目標也要放小。Shawnnnn 下午的獲利抓 50-60 點就覺得很不錯了，不要期待像開盤那樣的大波段。
    items:
      - 進場條件：拉一段後回踩、量還夠，才考慮做多。
      - 停利：抓 50-60 點。
  - heading: 固定時間與尾盤急殺
    text:
      - nick_AJ 發現每天有幾個固定的時間點會出現大量成交，很明顯是程式單在動作：前陣子是 12:45，後來是 13:02，夜盤近期則在 16:00 左右。他的心得是時間比點位重要，可以抓準時間進場，再搭配 Shawnnnn 的動能模式；回測看起來蠻準，但這些時間會改，只能持續記錄。
      - 13:00 前後殺尾盤殺得很快時，Shawnnnn 會改看 1 分K。他不是去搶反彈，而是等價格反彈到白線或藍線時做空；反彈如果上去得很兇，就不要做。這種單節奏很快，例如剛好碰線一下就走的 K 棒根本來不及進，除非願意接受 1 分K 上上下下、交易次數很多，但也有機會吃到一大段。
    items:
      - 程式單時間：12:45、13:02、夜盤 16:00 左右，會變動，要自己持續記錄。
      - 尾盤急殺：看 1 分K，反彈碰到白線或藍線再空；反彈很兇就不做。
    figures:
      - src: /img/1544982107447885864-Screenshot_20260903_160710.jpg
        caption: 固定時間的程式單：台指 16:04 突然一根爆量長紅（量 407，前面 K 棒的量都只有幾十到一百多），nick_AJ 說近期夜盤都在 16:00 左右發動，這天只慢了三分鐘。
        from: "1544923812875735150"
      - src: /img/1544938247354978304-image.jpg
        caption: 尾盤急殺看 1 分K：微台跌破後白線、綠線一路下彎，反彈碰到線才空；圖右那根亮紅 K 是 Shawnnnn 畫的示意，反彈像這樣一口氣衝上去、很兇，就不要做。
        from: "1544937911219257375"
  - heading: 任何時段都等碰線
    text:
      - 不管哪個時段，Shawnnnn 的進場條件都一樣：K 棒的上下影線要碰到白線（動態指標線）或 EMA25 才進場，沒碰到就不要追進去。也可以把單掛在兩條線中間的價格，只要停損抓好、該跑就跑都沒問題。
      - 有沒有賺，則看停利設在幾點；遇到可能會吃損的地方就要走，不要硬抱。
    figures:
      - src: /img/1542813115467432018-image.jpg
        caption: 適合進單的位置（Shawnnnn 圈的）：台指 2 分K 上綠圈是做空、紅圈是做多，都是 K 棒回到白線或橘色 EMA25 附近的地方；黃圈是 nick_AJ 原本的進場點。
        from: "1542811220766232607"
cautions:
  - 1 分K 上上下下、單量很多，不能接受就不要做尾盤的快單。
  - 保本設得太緊容易被掃掉：nick_AJ 習慣進場價 +5 點就設保本，常常被回踩掃出場，之後價格又往上噴 30-50 點。
  - 程式單的時間會變，不要拿舊的時間點直接下單，要自己持續記錄。
