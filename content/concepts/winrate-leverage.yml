slug: winrate-leverage
title: 勝率、盈虧比與槓桿：先活下來再談賺
topic: 資金與風險
order: 1
summary: 先用復盤知道自己的勝率和可能的連續虧損，再用固定停損算出能承受幾筆連虧；虧損比例越大回本越難，超過 30% 就很難打回來。紀律建立之前不要放大槓桿，已經重傷時先減碼、降槓桿保住本金。
sections:
  - heading: 先知道自己的勝率和連虧
    text:
      - Shawnnnn 自己復盤三個月，勝率平均大約 7 成；但他也有過連續虧損 3-5 筆、合計約 300 點的時候，連他都會開始懷疑。ROCH 補充，策略難的是一直重複，很多人遇到連虧就否定那個策略。所以要先透過復盤知道自己的勝率和可能的連虧幅度，連虧真的來的時候才不會亂了陣腳。
      - 固定停損的好處是算得出自己能承受多少連虧。Shawnnnn 的例子：固定停損 50 點，一天連虧 4 筆也撐得住；他的勝率約 7 成，就算保守打八折算 5 成 6，連續虧 4 筆的機率也很低。反過來，一筆凹單凹到 -200 點，一次就把 4 筆停損的額度用光了。
    items:
      - 勝率要靠復盤統計，不是憑感覺；Shawnnnn 是三個月平均約 7 成。
      - 估連虧時把勝率保守打折（Shawnnnn 打八折）再看機率。
      - 固定停損 50 點時，連虧 4 筆是 200 點；凹一筆 -200 點就等於一次虧完 4 筆。
  - heading: 1R 與賺賠比
    text:
      - 1R 是用固定停損的點數當單位來算獲利。ROCH 的說明：固定停損 50 點時，賺 50 點是 1R（盈虧比 1:1），賺 100 點是 2R（1:2）。
      - 賺賠比要不要在意，看勝率。Shawnnnn 自己沒有算風報比，有時獲利 30 點覺得不對就跑，連 1R 都不到；因為他是短打、勝率高，重點放在停損紀律。勝率低於 5 成的策略，才特別需要去思考賺賠比。nick_AJ 也說，高勝率的策略才能活得久。
    items:
      - 1R = 固定停損點數。停損 50 點：賺 50 是 1R，賺 100 是 2R。
      - 勝率低於 5 成：要思考賺賠比。
      - 短打、高勝率：不用太在意賺賠比，在意停損紀律。
  - heading: 虧損越大，回本越難
    text:
      - 在本金固定的情況下，虧掉的比例越大，下一次要賺回來的比例就越高：虧 10% 只要賺 11.11%，虧 30% 要賺 42.86%，虧 50% 就要翻倍，虧 90% 要賺 900%。Shawnnnn 的結論是，虧損超過 30% 之後，要打回來的難度就很高了。
      - 這個道理對個股現貨一樣成立。有人說當沖風險很大，但 Shawnnnn 反問：個股現貨跌 90%、100% 就沒風險嗎？就算回得去，要 1 年還是 3 年？現貨只是不會被斷頭出場而已。市場常說大跌是財富重新分配，就是因為跟著大盤下修的股票，不一定會跟著大盤漲回來。
    figures:
      - src: /img/1543101863677792347-image.jpg
        caption: 虧損與回本對照表：左欄是虧損比例、右欄是要漲回多少才能回本。從 30% 那一列開始（要漲 42.86%）難度明顯拉高，虧 50% 要漲 100%，虧 100% 就無法回本。
        from: "1543101863677792347"
  - heading: 紀律之前不要放大槓桿
    text:
      - Shawnnnn 的建議是先專注在交易和紀律上，滿腦子想賺錢心態會不健康；在紀律之前放大槓桿就是加速死亡，任何事情不停損就是死。
      - 已經重傷、部位凹得很深時，Alina 的提醒是：下一次反彈是給你逃命的，不是給你抱多發大財的。順序是先保本，有反彈就先減碼、先降槓桿，而不是在高點加碼、甚至賭身家。
    items:
      - 有反彈先減碼，先把槓桿降下來。
      - 不要在高點加碼，也不要把股票出清去凹期貨、賭身家。
      - 真的手癢，Alina 建議乾脆空手，或改買正2，不要再用期貨硬拚。
      - 等真正的低點支撐出現再買。
cautions:
  - 連虧幾筆就否定策略：先確認這幾筆是不是還在自己復盤統計出來的連虧範圍內。
  - 以為個股現貨不會被斷頭就不停損，跌深一樣可能好幾年都回不來。
  - 已經重傷還在高點加碼、賭身家凹單，只會離回本越來越遠。
