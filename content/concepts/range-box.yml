slug: range-box
title: 區間與箱型：上緣空、下緣多、破框再跟
topic: 盤整震盪
order: 2
summary: 價格在區間或箱型裡來回時，策略訊號不好用，只能看框做：上緣空、下緣多（或乾脆不做），突破框就停損、破框再跟，獲利不能抓得像趨勢單那麼大。日K 的大箱型上緣是好空點，下緣不追空，接多要慢慢接。
sections:
  - heading: 什麼時候要改看區間
    text:
      - 震盪盤不知道怎麼進場時，Shawnnnn 分成兩種情況。第一種是 K 棒在線上一直上下穿，這時沒辦法照策略做，真的要做只能自己看區間上下緣來回做。第二種是還有一些進場機會，但要知道獲利不能抓得像趨勢出來時那麼大：不用追，掛在線上的價格短打就好。
    items:
      - K 棒在線上來回穿：不照策略做，改看區間來回做（Shawnnnn）。
      - 還有進場機會：不追價，掛線上的價格短打，獲利目標縮小（Shawnnnn）。
      - 可以看當天的估計量，預估今天的振幅大概多大（Shawnnnn）。
    figures:
      - src: /img/1546701468051046480-image.jpg
        caption: 第一種震盪：K 棒在黃、藍兩條線上下來回穿，BUY、SELL 訊號一下多一下空。Shawnnnn 說這種情況沒辦法照策略做，只能看區間來回做。
        from: "1546698994351345674"
  - heading: 怎麼框區間、怎麼做
    text:
      - 框區間就是把來回震盪的高點和低點各畫一條線。Alina 在夜盤 30 分K 用兩條線框出區間上下軌，上有壓、下有撐，就在框裡來回做，突破框就停損；她說最怕的就是自己出手的時候剛好突破。
      - 日內也可以用當天日盤第一根 K 棒來框：Alina 抓日盤第一根的高點和低點當區間，不破低就可能在這裡震盪到中午，等往上或往下突破再跟；她自己做的話會守這根的低點。
      - 在框裡要留意支撐有沒有在變弱。nick_AJ 觀察到夜盤同一個支撐測了三次都頂回來，Alina 也說一直往下測又彈起來，但高點越來越低，多空交界又沒站穩，就偏空看待，像是拉高空的節奏。
    items:
      - 上緣空、下緣多，突破框就停損（Alina）。
      - 日盤第一根的高低點框區間：不破低可能震盪到中午，突破再跟，守這根的低點（Alina）。
      - 同一個支撐測好幾次都彈回、但高點越來越低，要小心跌破（nick_AJ、Alina）。
      - 框的關鍵位跌破就轉空：Alina 說關鍵位一跌破，她就要用力做空。
    figures:
      - src: /img/1545076213071089875-IMG_2437.jpg
        caption: 區間上下軌：小台夜盤 30 分K 用兩條黃線框出區間，K 棒在中間來回。Alina 說就在這個區間做，上有壓、下有撐，突破框就停損。
        from: "1545072122399821875"
  - heading: 日K 的大箱型：上緣空、下緣不追空
    text:
      - 箱型放到日K 一樣適用。Alina 在日K 畫出 7 月以來的震盪箱型：上緣是攻了很久的「魔王」壓力，也是好空點，往上不過大不了再加空；下緣跌破就往下看下一個框。她認為創新高的任務已經達成，前面的壓力不是開玩笑，至少要再震盪一季來消化；價格回到框的中段時，季線也該尊重一下，應該會來個反彈。
    items:
      - 上緣：好空點，往上不過可以再加空（Alina）。
      - 下緣：不追空；跌破就看下一個框（Alina）。
      - 框內接多要慢慢接，不然就在框內來回做（Alina）。
      - 大框用手機只能大概看，用電腦在 TV 上畫比較準（Alina）。
    figures:
      - src: /img/1560893951932768316-IMG_4933.jpg
        caption: 日K 的大箱型：小台日K 紅框是 7 月以來的震盪箱型，價格從 50265 高點跌回框內，收在 46141，差不多在框的中段。Alina 說上緣是魔王壓力、好空點，回到中段後季線附近應該會有反彈。
        from: "1560892408235958315"
  - heading: 突破框之後
    text:
      - 價格突破區間後，Shawnnnn 建議先想好接下來可能的走法，下次又多一個區間時就知道怎麼做：突破後可能在上面形成新的區間來回震盪，也可能衝上去之後回踩前高壓力測試，守住再繼續噴。
      - 找撐壓時也可以看大家常看的 60 分K 的 60MA，Alina 也說 60 分是大級別、可以參考。Shawnnnn 說單看 60MA 就沒問題，他會在附近再畫一條水平的撐壓線，兩者疊在一起時可信度更高。
    items:
      - 突破後兩種走法：在上方形成新區間來回震盪，或回踩前高壓力測試後續噴（Shawnnnn）。
      - 60 分K 的 60MA 當大撐壓，疊上水平撐壓線更可信（Shawnnnn）。
    figures:
      - src: /img/1555139027231842346-image.jpg
        caption: 突破區間後的兩種走法：微台 1 小時K 一層一層往上的區間框，黃線是突破後在上面形成新區間來回震盪，橘線是衝上去後回踩前壓 48918 測試、守住再噴。
        from: "1555139027231842346"
      - src: /img/1555140853163499540-image.jpg
        caption: 60MA 疊上水平線：黃線是 60 分K 的 60MA，橘線是 Shawnnnn 另外畫的水平撐壓線。紅圈是價格碰到兩線重疊處的反應，左邊先被壓下來，右邊幾次回測都撐住。
        from: "1555139027231842346"
cautions:
  - 帳面虧損時別想攤平撿便宜：Alina 說那其實是在接刀子，一路接到框底會很慘。
  - 在框底追空、在框上緣做多，犯的是同一個錯：Alina 復盤時檢討，自己曾在框底下緣還做空，這次又在框上緣做多，還把上緣的空單撤掉了。
