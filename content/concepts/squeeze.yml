slug: squeeze
title: 收斂盤：等方向出來、回踩再進
topic: 盤整震盪
order: 3
summary: 高點越來越低、低點越來越高的收斂，最後一定會出一根大 K，但事先不知道方向；最安全是空手，等突破出方向、回踩再順勢進，停損放在起漲低點。真的要在收斂裡短打，停損要抓小。
sections:
  - heading: 收斂長什麼樣
    text:
      - 收斂就是高點越來越低、低點越來越高，K 棒被擠得越來越窄，畫上兩條線就是一個三角形（三角收斂）。通常也會伴隨量縮：Shawnnnn 看到 1 分、2 分K 都在收斂時，就提醒現在沒什麼量了。
      - 收斂最後一定會出一根大 K。Doobe 問這種盤是不是會突然來一根大的，Alina 的回答是「會，只是往上往下不知道」。
    figures:
      - src: /img/1562063985543749653-image.jpg
        caption: 三角收斂：小台 5 分K 上緣是一路降低的高點、下緣是墊高的低點（兩條粉紅線），K 棒擠到三角形末端，雙線也糾結在一起，右上趨勢表 1 到 5 分K 都是盤整。
        from: "1562038626752139335"
  - heading: 最安全：空手等方向
    text:
      - 既然不知道會往哪邊出，最安全的做法就是空手。Alina 說「安全點就是空手等方向出來再順勢」；Shawnnnn 也說，沒把握就等出方向再做，收斂就是這樣，不知道等等會不會一根灌破下來，至少讓它先跑個方向出來。
      - 收斂到末端時，盯緊最後那根 K。Alina 說這根要收好，沒收好就容易往下突破。
    figures:
      - src: /img/1562065339074879558-image.jpg
        caption: 方向出來了：同一個三角收斂，末端一根長黑跌破下緣的粉紅線，出現 BOS，確認往下突破。這就是 Alina 說「這根要收好，沒收好就……」的結果。
        from: "1562038626752139335"
  - heading: 突破後回踩再進
    text:
      - 方向出來之後也不急著追。Shawnnnn 的做法是：三角收斂不要急著下單，等它出方向後的回踩再去試，這樣停損好設，勝率也會高一些。他分享的那次，回踩的位置剛好跟 2 分K 的紅線差不多。
      - 有人問停損是不是設在下方那條上升趨勢線，Shawnnnn 說他會設在這段起漲的低點，那次算起來大約 44 點而已。
    items:
      - 等價格突破收斂的上緣或下緣，方向出來。
      - 突破後等回踩（例如回到 2 分K 的紅線附近）再順勢進場。
      - 停損放在這段起漲的低點，不是趨勢線；Shawnnnn 那次約 44 點。
    figures:
      - src: /img/1547992472360063068-image.jpg
        caption: 收斂後突破回踩：微台 2 分K 在兩條藍色趨勢線之間收斂，往上突破後拉回（黃箭頭），黃圈是回踩到上緣和紅線的位置，Shawnnnn 就是在這裡試單。
        from: "1547992472360063068"
      - src: /img/1547995697461334167-image.jpg
        caption: 停損放起漲低點：同一段放大來看，進場在回踩的位置，停損拉到下方黃線（這段起漲的低點），大約 44 點，而不是更下面的上升趨勢線。
        from: "1547992472360063068"
  - heading: 真的要在收斂裡做
    text:
      - 收斂中也不是完全不能做，但目標和停損都要縮小。Shawnnnn 說，如果只想賺個 20-30 點，碰到線可以做做看，但停損也要抓 15-25 點就要走。
    items:
      - 目標：20-30 點。
      - 進場：價格碰到線。
      - 停損：15-25 點就走。
cautions:
  - 最近幾次收斂往哪邊突破可以參考，但不代表這次也一樣。Alina 那次依最近幾次都往下的經驗想先空一口，但也說「不知道今天可不可以來點不一樣」。
  - 收斂還沒出方向就先猜邊進場：突破前不知道會往哪邊，Shawnnnn 說隨時可能一根灌破下來。
