slug: ma-levels
title: 各週期均線疊在一起的地方是大撐壓
topic: 撐壓點位
order: 4
summary: 不同週期的 EMA200（以及 60 分 20MA、15 分長均線）各自都是撐壓，週期越大越強；好幾條疊在同一個價位附近、又碰到算出來的點位時，就是大壓力或大支撐。大壓區適合小量試單，價格貼著均線、方向不明時不追。
sections:
  - heading: 每個週期的 EMA200 都是一層
    text:
      - Alina 不只看 5 分K 的 EMA200，而是把各週期的 EMA200 都當撐壓：5 分、10 分、十幾分、1 小時、4 小時各有一條，位置都不一樣。想知道上面的壓力有多重，就把這幾條線的價位列出來看。
      - 週期越大越強，她說 1 小時的 200 壓力比較強。價格衝過一條之後，下一關就看更大週期的那一條；只要不回踩太深，都還算健康。
    items:
      - 5 分K 的 EMA200 會跟著價格移動：價格一路跌，它也會一路被「洗」下來，要看當下的位置。
      - 2 分K 站上 EMA200 而且帶量，Alina 就看往上衝。
      - 突破一條看下一條：例如過了 10 分 EMA200，就看 15 分 EMA200。
      - 除了 EMA200，60 分K 的 20MA、15 分K 往下彎的長均線也都是壓力。
    figures:
      - src: /img/1559605110437580860-IMG_4802.jpg
        caption: 1 小時的 EMA200 比較強：小台 1 小時K，凌晨一根長 K 反彈上來，剛好碰到紫色的 1 小時 EMA200（48881）。Alina 稍早就說衝破 48800 之後，下一關看的就是這條線。
        from: "1559557341559398541"
  - heading: 好幾條疊在一起最難過
    text:
      - 單一條均線是一層壓力；好幾條疊在同一價位附近、又剛好碰到算出來的點位，就是大壓區。Shawnnnn 舉過的例子：價格要站穩 5 分K 的 200MA 才能去補上面的缺口，但缺口那裡同時有 60 分K 的 20MA，壓力很大，價格果然一直被壓著。Alina 也會把 1 小時和十幾分K 的 EMA200 擠在一起的那一段，當成很重的壓力區。
    items:
      - 5 分 EMA200 和 60 分 20MA 重疊（Shawnnnn）。
      - 10 分 EMA200 和今日壓力重疊（Alina）。
      - 1 小時和十幾分K 的 EMA200 擠在同一區（Alina）。
    figures:
      - src: /img/1560490939926061056-image.jpg
        caption: 均線和點位重疊：小台 10 分K，紫色 EMA200 剛好落在今日壓力 47589 這條紅線上，價格一路衝上去碰到就被壓回。Alina 說這裡過了才看 15 分 EMA200（約 47800）。
        from: "1560464622538985544"
  - heading: 最大的壓力在日K 插針處
    text:
      - 盤中說的壓力常常一下就被灌過去。Alina 提醒，真正最大的壓力在日K 插針很多的地方。比較小的壓力則一層一層往上排，Shawnnnn 會標出 15 分K 前高和下彎長均線形成的壓力，以及 30 分K 的壓力區；nick_AJ 則把點位一關一關排出來，過了一關看下一關，上攻沒力的話很快就會被壓回去。
    figures:
      - src: /img/1562104504407822346-image.jpg
        caption: 15 分K 的一層壓力：Shawnnnn 在微台 15 分K 上把前幾次的高點（紅圈）和上方往下彎的長均線圈出來，右邊價格急拉上去，就碰到這層壓力。
        from: "1562104504407822346"
  - heading: 跌破後撐轉壓
    text:
      - 大級別的均線被跌破之後，會由支撐變成壓力。Alina 那次觀察到價格卡在 4 小時 200MA 附近，說再下穿就很難看；照邏輯這裡該反彈，但當天還是跌破了。傍晚反彈碰到這條 4 小時 200MA 就插針回落，她判斷反彈到這條線就是極限，再上去很難；Shawnnnn 補充除非晚上的數據影響很大。
    figures:
      - src: /img/1560231418573885553-IMG_4864.jpg
        caption: 4 小時 200MA 由撐轉壓：小台 4 小時K 跌破紫色 200MA 後，反彈的長 K 上影線剛好碰到這條線（47655）就回落。右上趨勢表 15 分到 4 小時都偏空。
        from: "1560088194358321293"
  - heading: 在壓力區怎麼下單
    text:
      - 大壓區沒那麼容易「頭也不回地往上」過，所以 Alina 認為壓力區才是比較好的試單位置：那天她只在今日壓力掛一口微台試空，價格往上再分批加空。
      - 相反地，價格掉到下方的 5 分 EMA200 上、K 棒貼著線、又帶量反彈時，位置很尷尬：跌下去又反彈上來，這時追空怕被拉尾。她選擇空手不硬做，等真的走出下跌或上漲趨勢再切入。
    items:
      - 壓力區小量試空：一口微台掛在壓力，往上再分批補掛。
      - 要空下方的 EMA200，等 K 棒向下貫穿它再空。
      - K 棒很貼均線：多看幾根再決定，Alina 說這種「高手區」她不做。
      - 價格已經衝起來、停損要抓很遠時不追，等回踩再進（Alina）。
      - 日K 乖離很大時，拉回休息很正常（Shawnnnn），不要在壓力前追。
    figures:
      - src: /img/1560500506047021096-image.jpg
        caption: 位置尷尬就不追空：小台 5 分K 從今日壓力 47589 回落，跌到紫色的 5 分 EMA200 附近止跌，接著帶量站回雙線，趨勢表 30 分也轉偏多。Alina 說這裡 K 棒貼線又有量，不硬做。
        from: "1560464622538985544"
cautions:
  - 價格卡在 EMA200、K 棒貼著線又帶量反彈時，不要追空，先空手等方向。
  - 日K 乖離很大時還在壓力前追，很容易碰上拉回休息。
  - 均線的價位會一直移動，掛單前要看當下的位置，不要拿之前抄下的數字。
