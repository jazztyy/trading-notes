slug: events-settlement
title: 數據公布與結算日：沒把握就空手
topic: 盤勢判讀
order: 5
summary: 美國數據（非農、CPI）公布前，位置卡在中間就空手，越靠近美股開盤越不交易；公布後的爆拉爆跌比較有空間做，方向照原本的結構判斷。結算日近遠月價差容易讓判斷打結、勝率低，沒把握就不做，也要記得當月合約 13:30 就收盤。
sections:
  - heading: 數據公布前先空手
    text:
      - 美國數據公布前後波動大、方向難猜。Shawnnnn 會避開數據公布前的時段，而且越靠近美股開盤越不交易，都是開盤後半小時才開始看。他的理由很簡單：一天的交易機會那麼多，一直看盤進場其實很累，不差這一段。
      - 手上有單、要不要抱過數據，Kai 的做法是會怕就先出幾口，不然就設一個自己能接受的移動停利點。至於要不要在數據前新進場，Alina 和 Shawnnnn 的共同結論是：位置卡在中間、不好判斷時就空手，現在進場等於在賭方向。
    items:
      - 數據前：越靠近美股開盤越不交易，開盤後半小時再看。
      - 手上有單：先減幾口，或設自己能接受的移動停利。
      - 位置卡在中間：空手，不賭方向。
  - heading: 公布後照原本的邏輯做
    text:
      - 數據公布後的爆拉爆跌，反而比較有空間做。Alina 的計畫是數據拉高就空、殺低就多，等價格先跑出方向和位置再進。
      - 方向還是照原本的結構判斷，不是看消息猜。數據前價格已經跌破上升趨勢線和交界位，Alina 就轉空看；30 分K 雖然插出一根漂亮的下影針，Shawnnnn 的判斷仍是空方太強。公布後先爆拉、又急跌時，Alina 的理智告訴她上方壓力很大、而且已經跌破上升趨勢框，所以順勢追空；如果是往上拉，她也要看拉上去的狀況，滑得很快才追。nick_AJ 的觀察是，往下的趨勢其實一直沒變，只是差點被凹上去，又被消息面砸下來。
      - 進場之後也要保護獲利：Alina 在反彈時先保本出場，等拉高再重新空。
    figures:
      - src: /img/1559883854393647225-image.jpg
        caption: 破線轉空：小台 5 分K 一根長黑同時跌破藍色上升趨勢線和「今日交界位」，右上趨勢表 1、2、5 分K 都轉偏空，Alina 在這裡轉空。
        from: "1559850017257168999"
      - src: /img/1559890991434178580-image.jpg
        caption: 數據前已經破框：小台 1 小時K 碰到上方紅色壓力線後被打下來，跌破藍色上升通道的下緣。有了這個破框，數據公布後的急拉急跌 Alina 就順著空方追。
        from: "1559850017257168999"
  - heading: 結算日沒把握就不做
    text:
      - 結算日是 Alina 勝率最低、最容易被雙巴的日子，她說自己常常下單錯亂，因為近月和遠月的價差會讓判斷打結；wenwen 也提醒結算日要注意近月跟次月的價差，而且自己很容易上頭。Alina 的結論是沒把握就不用進單，與其硬做，不如看莊家表演，等價格到點位再做；Kai 則乾脆綁手不做。
      - 結算日價格卡在壓力線下、還沒站穩的時候特別難判斷，多空都有可能，Alina 稱之為打架位，她認為安全的做法是等真的轉折、在下降途中再做，不然很容易被巴。Shawnnnn 則先定好一條轉弱的線，真的跌破才覺得弱，在那之前就等趨勢明確再進場。
      - 結算日的收盤時間也不一樣：當月合約 13:30 就停止交易，不是一般的 13:45。Shawnnnn 以前就忘記平倉，結果單子動不了。
    items:
      - 沒把握：不進單，等價格到點位再做。
      - 壓力線下沒站穩：等趨勢明確或真的轉折後再做。
      - 當月合約 13:30 停止交易，要平倉得在這之前。
    figures:
      - src: /img/1549597153922519081-image.jpg
        caption: 結算日的打架位：小台 2 分K 衝上紅色今日壓力線後又掉回線下、沒站穩，下面還有紅、紫均線撐著，多空都有可能，Alina 認為這種位置很容易被巴。
        from: "1549584688241188955"
      - src: /img/1549598130905808937-image.jpg
        caption: 先定好轉弱的線：同一天微台 2 分K 還在白線、紅線之上，Shawnnnn 標出藍色水平線 45810，真的跌破這條才會覺得弱。
        from: "1549584688241188955"
cautions:
  - 不要在數據公布前賭方向，位置卡在中間時寧可空手。
  - 結算日容易被巴、上頭亂按，沒把握時就綁手不做。
  - 忘記結算日當月合約 13:30 就收盤，單子會來不及平倉、動不了。
