slug: king-lines
title: 雙線策略：白線、藍線與上彎下彎
topic: 指標設定
order: 1
summary: Shawnnnn 的雙線策略是「單向行情順勢拉回時進場」：線上彎才做多、下彎才做空，等價格拉回到白線（激進）或藍線（保守）再進場；兩條線貼在一起時就觀望。
sections:
  - heading: 這套策略在做什麼
    text:
      - Shawnnnn 的指標會畫出兩條線，白線比較激進、藍線比較保守。這套策略最理想的狀態，是在單向行情裡、等價格順著趨勢拉回到線上時進場，所以它不會讓你去追多追空，停損也比較好抓。
      - 線的顏色只代表激進或保守，不代表多空：白線可以進多，也可以進空，方向要看線是往上彎還是往下彎（下一段）。每個人的顏色設定不一樣，例如 Jessie 圖上的藍線，就是 Shawnnnn 圖上的紅線，看圖時以自己的設定為準。
    items:
      - 白線（激進）：掛白線進場的次數比較多，伴隨的停損次數、獲利次數也都比較多。
      - 藍線（保守）：成本比較好，但掛得到的次數比較少。
  - heading: 上彎做多、下彎做空
    text:
      - 方向只看線彎的方向。Shawnnnn 說，線下彎之後再變平，代表空方還在，這時候還不能做多；真的要做多，要等線先上彎，進場點是上彎後的回踩。做空反過來，是線下彎之後、價格反彈上來碰到線的位置。
      - 看方向和找進場可以用不同週期：Shawnnnn 當天先用 7 分K 判斷方向（「7 分還是偏空」），再借 1 分K 的圖示範做多的進場位置。
    items:
      - 做多：白線、藍線上彎，價格回踩到線上再進。例如 2 分K 是上揚趨勢，想做多就在白線進多。
      - 做空：線下彎，價格反彈碰到線再進；往下走的時候，白線也是空單的進場點。
      - 線下彎後走平：空方還在，不要做多，等它真的上彎。
    figures:
      - src: /img/1544901799180243005-image.jpg
        caption: 上彎後的回踩：1 分K 白線、藍線都轉成上彎後，價格兩次回踩到白線（紅圈）就是做多的位置。Shawnnnn 用這張圖說明「這個做多就沒問題」。
        from: "1544898472098922566"
      - src: /img/1544901549795450880-IMG_7270.jpg
        caption: 下彎後的反彈做空：7 分K 雙線往下，價格反彈上來碰到藍線（紅圈）就是空方的上車點，Shawnnnn 確認這個判斷是對的。上方橘色區塊是壓力區。
        from: "1544898472098922566"
  - heading: 兩條線貼在一起就觀望
    text:
      - 兩條線貼近或交纏，代表現在沒有單向行情。Shawnnnn 遇到這種線會觀望（「這裡很密就觀望」），維尼的複習重點也是「白藍線分開時比較安全」。喜歡頻繁交易的人可以在白線、藍線掛單試，但 Shawnnnn 自己會等線開一點才進場，而且是價格快到了才去掛當時白線、藍線的價格。
      - 盤整時真的要做，Shawnnnn 說在兩條線中間掛單都可以，適合短打；線跟 EMA 很近的時候，也可以改掛 EMA 的價格。
    items:
      - 維尼整理的時段提醒：開盤前後和下午的垃圾時間不進場，開盤後先觀望 40 分鐘再試單。
    figures:
      - src: /img/1542908421228208158-image.jpg
        caption: 線很密就觀望：紅圈處白線和藍線貼在一起交纏，Shawnnnn 說這種地方要觀望；之後兩條線拉開、一起往下彎，才是比較好做的空方。
        from: "1542905706485784576"
  - heading: 停損怎麼抓、訊號怎麼看
    text:
      - 因為是等拉回才進場，停損很好設。Shawnnnn 舉的空單例子：停利抓在前低附近，想賺 160 點左右；如果沒到停利就往上走，停損可以抓前面那根綠K的最高價（大約 45 點），或乾脆固定 60 點。前面打了很多下引線的時候，停損可以再收緊一點。
      - 程式訊號和手動進場要分清楚。nick_AJ 比對過，程式的 SELL 訊號和 Shawnnnn 手動在白線進場的位置一樣；看別人的倉位圖時，倉位最左邊才是建倉位置，SELL 箭頭只是程式訊號。群組裡另外常提的「帝王訊號」是 30 分K 的策略訊號，和這組雙線不同，nick_AJ 建議不要拿到短週期去看。
    figures:
      - src: /img/1542907011702718525-image.jpg
        caption: 空單的停利停損：2 分K 價格反彈到藍線附近進空，停利抓在前低附近（約 159 點），停損放在前面綠K的高點上方（約 44 點）。後來價格沒到停利就往上走、白線上彎，這時就照停損出場。
        from: "1542905706485784576"
cautions:
  - 線還沒上彎就做多、還沒下彎就做空，等於逆著指標做；下彎後走平只代表空方還在，不是轉多。
  - 兩條線黏在一起時硬做，很容易被來回巴。
  - 把 30 分K 的帝王訊號拿到 1、2 分K 這類短週期看。
