slug: stocks
title: 個股：技術面選股，再看籌碼
topic: 籌碼消息
order: 1
summary: 同一套方法也能用在個股：先用技術面（均線順向、交界、雙線、EMA200、框框區間）挑股票和進場位置，再看籌碼（外資、分點、族群金流）。個股當沖成本高、也不好做，Shawnnnn 建議先從微台練功，Alina 也覺得打台指期單純一點。
sections:
  - heading: 同一套方法也能用在個股
    text:
      - Shawnnnn 說這套方法拿去做個股波段、個股當沖，或是石油、債券、加密貨幣等其他商品都可以用，只是週期不同。他自己只做指期，沒時間做那麼多，建議挑一個自己喜歡的方式去復盤；不用什麼都會，會一個就很厲害了。
    items:
      - 個股波段：日K、1 小時K。
      - 個股當沖：2 分K 或 3 分K。
      - TradingView 的個股即時數據要另外買，只有少數標的可以免費看（代號旁有灰色點點的）。
      - 個股當沖成本比較高，Shawnnnn 不太建議，先從一口微台練功。
    figures:
      - src: /img/1543094216828260392-image.jpg
        caption: 同一套用在個股波段：富喬 1 小時K 上，下跌段線轉成綠色、一路壓在 K 棒上方；出現 BUY 之後白線、紅線一起上彎，K 棒沿著線往上走，看法和指期一樣。
        from: "1543094063492763659"
  - heading: 選股：先技術面，再看籌碼
    text:
      - Alina 做個股會搭配籌碼，覺得比較穩；Shawnnnn 也說看分點真的會準。她的順序是先從技術面挑出均線順向的股票，再看籌碼。
      - 另一種是均線糾結、季線下彎、等一根表態的股票。Alina 會買進去蹲，不求漲很多根，至少一定會有一根；糾結的一樣要防守，跌破就走。Shawnnnn 提醒這種要每天看標的、盤後認真做功課，而且現在的盤勢下中小型股很容易只點火一天，成交總量最好有 1500 以上。
    items:
      - 技術面：先挑均線順向的股票。
      - 外資：每天掃一下外資買的標的。
      - 分點：看有沒有厲害的大哥分點，以及分點的成本。
      - 族群金流：有的族群很團結，領頭羊漲上去，就買同族群的其他檔。
  - heading: 找進場位置
    text:
      - 進場一樣可以用指期那套邏輯：交界、壓力支撐、雙線和 EMA200。Alina 會在個股上畫「框框」（價格震盪的區間），用它找進場位置，也好判斷停損；上穿 EMA200、回踩交界，就是她說的完美入場點。
      - 日K 上她偏好沿著五日線買綠K，覺得比追動能不容易受傷，她七月用追動能的打法賠得很慘。族群已經連漲很多天時，要注意資金輪動，可以等壓回、守好均線再買，或畫斐波看大概可以觀察哪些點位；真的要追，就要盯族群金流、手腳要快。
    items:
      - 上穿 EMA200、回踩交界時進場。
      - 用框框區間找進場位，跌回框框或跌破防守就停損。
      - 沿五日線買綠K，不追紅K；糾結型的股票「買綠可以，買紅絕對不行」。
      - 走出分價量的大量區可以觀察，位階剛好在大量區附近也可以觀察。
    figures:
      - src: /img/1555090057810022543-IMG_3538.jpg
        caption: 用框框找位置：聯電日K 上，Alina 把前高附近的震盪區畫成白框（約 145-165），價格回到框裡，160 要守住，不然就回到框內震盪。框框讓進場位和停損都好判斷。
        from: "1555089928650489947"
      - src: /img/1555415688313835712-IMG_3609.jpg
        caption: 上穿交界進：合晶 5 分K 上，今日交界位 132、壓力 139、支撐 121。Alina 說當天的好位置是價格上穿交界時進場，之後再觀察碰到壓力 139 的反應。
        from: "1555411880468815903"
      - src: /img/1555418194850742343-Screenshot_20261002_111603_Woojii.jpg
        caption: 沿五日線買綠：合晶日K 的粉紅色五日線（128.1）一路上彎，K 棒沿著它往上走。Alina 會抓五日線、在綠K 時買，不去追紅K。
        from: "1555411880468815903"
  - heading: 庫存股的價差：先賣再撿
    text:
      - 夜盤開高、日盤卻開高走低時，Alina 會拿手上成本好的庫存股吃價差：開盤開高先賣，盤中看狀況或尾盤再買回。這樣留倉也不會損失中間下跌那一段，而且賣的是現股，沒有借券壓力，等於吃一點作空的豆腐。
    items:
      - 只用成本好的股票做，可以只賣一部分保留彈性；成本高的，賣了可能就賣了。
      - 開盤 15 分鐘就鎖漲停的不動；有倒貨氛圍就跟著賣。
      - 適合的情況：已經連續紅K 很多天、有隔日沖抬轎、創高盤（通常都會拉回）。
      - 怕買不回來：Alina 遇到覺得很 OK 的股票，即使賣飛也願意追高買回。
cautions:
  - 個股當沖成本高也不好做：Alina 當沖也很常輸，最好要有留倉的準備，她留不了的都賠錢、放到隔日反而都可以賺。
  - 中小型股容易只點火一天，成交量不夠的不要碰。
  - 族群已經連漲很多天還追高，要小心資金輪動。
