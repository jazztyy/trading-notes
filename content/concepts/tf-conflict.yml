slug: tf-conflict
title: 週期方向不一致時：同向才好做
topic: 多週期判斷
order: 2
summary: 30 分、1 小時、4 小時、日K 方向一致時才好做；各週期互相矛盾就代表在震盪，要先分清楚是反彈還是回檔、是短多還是長多，少做單，也不要在週期之間跳來跳去找理由。
sections:
  - heading: 同向才好做
    text:
      - Shawnnnn 一再複習的原則是「大週期看趨勢，小週期看進場位置」。最好做的情況是各週期方向一致：30 分、1 小時、4 小時、日K 都朝同一個方向，順著做就好。反過來，如果各週期看起來很混亂、讓你搞不清楚該做哪邊，那就代表現在是震盪。
      - 小週期反應快，但不能只看小週期。nick_AJ 的習慣是：越短的週期反應越快，但他還是會同步搭配大週期一起看。
    items:
      - 30 分、1 小時、4 小時、日K 同方向：比較好做，順勢找進場點。
      - 各週期互相矛盾、看起來很亂：視為震盪，少做單或空手觀望。
  - heading: 分清楚是反彈還是回檔
    text:
      - 週期打架時，先弄清楚每個週期各自在講什麼。Shawnnnn 舉過的例子：30 分、1 小時、4 小時都是下跌趨勢，眼前的上漲只是下跌中的反彈；但從日K 看，這段下跌只是回檔。同一段走勢在不同週期的意義不一樣，所以才會覺得混亂。
      - Alina 會用 EMA200 看大級別的位置。大級別都下穿 EMA200 時，她會去看大級別的 EMA200 在哪裡，那裡就是壓力。30 分K 已經下穿 EMA200、1 小時也在附近時，順勢應該偏空看；不過她也提醒，如果前一段漲得又快又急（當時是很快拉到五萬），現在的下跌也可能只是正常回測，接下來在區間裡來回震盪是合理的。
    items:
      - 黃金交叉要真的穿過才算：雙線只是「快要穿過」EMA200 還不算，要雙線一起向上穿過才是（Alina）。
      - 小週期黃金交叉、大級別還在 EMA200 下方時，往上會先碰到大級別 EMA200 的壓力。
    figures:
      - src: /img/1559569077918375966-image.jpg
        caption: 真的穿過才算黃金交叉：台指期 2 分K 白線、藍線一起向上穿過橘色 EMA200，之後沿著雙線往上走。Alina 說像這樣穿過才算，但當天大級別都在 EMA200 之下，她會再看大級別 EMA200 的位置當壓力。
        from: "1559569077918375966"
  - heading: 短多長空怎麼看
    text:
      - 最常遇到的矛盾是小週期轉多、大週期還偏空。nick_AJ 的判讀是：小週期轉多了，但大時區還是偏空，價格回到多空線下方，要上穿多空線才會開始黃金交叉偏多。Alina 把這種情況叫做「短多長空」：短線可以多，長的趨勢還是空。
      - 反過來的情況也要一起看：小週期碰到線隨時可能反彈，但大週期可能還有很多回測空間。Shawnnnn 講這種判斷時也先說清楚「沒有一定，市場永遠是對的」。
    items:
      - 短多長空只當短多做，不要當成趨勢已經翻多。
      - 想低接多單，先看回測：回測時線沒有彎下去，才可以考慮低接多（Alina）。
      - 小週期碰線反彈時，回頭看大週期離線還有多遠；離得遠，就代表大週期還有回測空間。
    figures:
      - src: /img/1562095201093292052-image.jpg
        caption: 短多長空的長相：台指期 5 分K 從低點翻上白線、藍線，右上趨勢表 2 分、5 分K 偏多，但 30 分K 到日線全是偏空，價格也還在上方橘色 EMA200（約 46500，nick_AJ 說的多空線）之下。
        from: "1562095201093292052"
      - src: /img/1544175498081337484-image.jpg
        caption: 小週期碰線可能反彈：微台 5 分K 回落，下影線剛好碰到紅線，Shawnnnn 說這裡隨時可能反彈。
        from: "1544175498081337484"
      - src: /img/1544175764696469625-image.jpg
        caption: 大週期還有回測空間：同一時間的 15 分K，K 棒離白線、紅線都還很遠，Shawnnnn 說還有很多空間可以回測。兩張要對照著看。
        from: "1544175498081337484"
  - heading: 不要在週期之間跳來跳去
    text:
      - Shawnnnn 雖然說可以看各個週期，但千萬不要跳來跳去，一下看 5 分、一下看 2 分、一下看 7 分，除非你真的有那個能耐。他也特別說不要「做 7 分看 2 分」：用一個週期進場，卻改看另一個週期決定怎麼辦，只會越看越亂。
      - 指標和策略也是一樣。nick_AJ 問過：盤面看起來偏多，但知道上方有壓力，這種盤還做不做？Shawnnnn 的回答是，會自己判斷壓力的人可能就不做；只看線做事的人，就不會去管壓力支撐。策略多不一定好也不一定壞：壞處是互相打架、矛盾，導致少做單；好處是可能幫你判斷這筆不能做，甚至逆勢做反向賺錢。對他自己來說，看太多反而會讓操作很不舒服。
    items:
      - 選定一個做單的週期，大週期只拿來看方向。
      - 策略之間互相矛盾時就少做單，把矛盾當成過濾不好的單的工具。
cautions:
  - 亂跳週期：1 分K 逐漸上彎、2 分K 還在下彎時，挑對自己有利的週期看，只會越看越亂。
  - 把下跌趨勢中的反彈當成翻多：小週期黃金交叉了，大週期還偏空，追多容易撞到大級別的壓力。
  - 各週期很混亂時還硬要出手；這時是震盪，少做單或空手。
