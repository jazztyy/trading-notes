slug: trendline
title: 趨勢線與通道：突破回踩才算轉向
topic: 撐壓點位
order: 7
summary: 低點連成上升趨勢線、高點連成下降趨勢線。被下降趨勢線壓著時，要突破後回踩站穩才算轉多，不然都只是反彈；做多就防守上升趨勢線，實體 K 跌破才出場，沿通道走時到上緣再考慮做空。
sections:
  - heading: 趨勢線怎麼畫、怎麼看
    text:
      - 把一段走勢的低點連起來是上升趨勢線，高點連起來是下降趨勢線，上下兩條平行的線把走勢夾在中間就是通道。畫趨勢線是為了看清楚現在是哪一種走勢：沿著上升趨勢線走、回測不破，多方就還在；被下降趨勢線壓著，每一次上漲都只是反彈。
      - Alina 形容下跌的長相是「下降的樓梯」：碰到支撐彈一下，然後再往下。這種走勢裡碰到支撐頂多是短多的點，空在比較高位置的人可以續抱觀察，看會不會突破下降趨勢線。高點一次比一次低、低點差不多平的時候（nick_AJ 把高點連線、低點畫平，Alina 說就是這樣看），是收斂或下降區間的長相，接下來就看它往哪個方向收斂。
    items:
      - 上升趨勢線：連低點，是做多的防守線。
      - 下降趨勢線：連高點，是反彈的壓力線，突破後才有機會轉多。
      - 通道：下緣是支撐、上緣是壓力。
  - heading: 下降趨勢線：突破、回踩站穩才算轉多
    text:
      - Alina 的標準是：多方要拿回局勢，必須突破下降趨勢線，而且突破之後回踩站穩才算；做到之前，再強的上漲都只是反彈。反彈碰到下降趨勢線時壓力還是很大，價格一路彈到 1 小時K 的下降趨勢線時，Shawnnnn 提醒「到下降趨勢線了」，Alina 也說多軍雖然很快樂，這裡壓力還是很大。
    items:
      - 轉多的條件：突破下降趨勢線，再回踩不跌回線下。只有突破、沒有回踩站穩，都當反彈看（Alina）。
      - 線畫在哪個級別，就用那個級別對照：Alina 畫的是 60 分K 的下降趨勢線，位置大約參考 60 分K 的上布林；布林會移動，記當時的點位就好，不要拿 5 分K 的上布林來對。
    figures:
      - src: /img/1559565358476566528-IMG_4794.jpg
        caption: 還在反彈的長相：台指 60 分K 從 50117 高點往下畫的綠色下降趨勢線，K 棒一直在線下，白框是一路往下的幾個整理區。Alina 說要突破綠線、回踩站穩才算拿回多方局勢；當時線的位置大約在上布林 49187。
        from: "1559565358476566528"
      - src: /img/1559748180466344008-image.jpg
        caption: 反彈碰線就是壓力：微台 1 小時K 一根長紅從缺口 48933 附近彈上去，正好頂到藍色下降趨勢線。這裡還不算突破，Shawnnnn 和 Alina 都提醒壓力很大。
        from: "1559565358476566528"
  - heading: 突破之後怎麼做
    text:
      - 突破下降趨勢線之後，Shawnnnn 先看上方最近的壓力當目標：他在 30 分K 看價格挑戰下降趨勢線時說，只要這條線過了，上面的壓力應該不難到。到了壓力先平一口，等價格衝上去、再回踩這個壓力守住時，他才再進場嘗試。
      - 收斂或下降區間被跌破時也要看趨勢線。Alina 會接著看價格能不能突破下降通道，突破了還要守住，不能再跌回通道裡。
    items:
      - 目標：先看突破後上方最近的壓力（Shawnnnn）。
      - 到壓力先平一口，回踩壓力守住再進場（Shawnnnn）。
      - 突破下降通道後要守住，跌回通道就不算（Alina）。
    figures:
      - src: /img/1555082298855006309-image.jpg
        caption: 突破後的劇本：微台 30 分K 長紅突破藍色下降趨勢線，碰到上方粉紅色壓力線（580）時 Shawnnnn 先平一口；黃色箭頭是他等的走法，衝上去後回踩這條壓力（藍圈處）守住，再進場嘗試。
        from: "1555047487075655753"
  - heading: 上升趨勢線與通道：做多的防守線
    text:
      - 做多時，上升趨勢線就是防守線。Alina 在 30 分K 把低點連成一條藍色上升趨勢線，價格回測到線附近時加入多單，規則是出現實體 K 跌破這條線才出場。當時 nick_AJ 提醒雙線正要往下交叉、但也可能 V 轉，位置很曖昧，Alina 也同意；有了這條線，就知道錯了要在哪裡出場。
      - 價格之後沿著上升通道走，Alina 打算等漲到通道上緣、碰到壓力線再考慮做空。小級別的上升趨勢線也是一樣的看法：Shawnnnn 說小小的上升趨勢線有守住就別害怕；後來線破了，但走勢變成橫盤震盪，他也不會太擔心。
    items:
      - 做多防守上升趨勢線，實體 K 跌破才出場（Alina）。
      - 沿著上升通道走時，漲到通道上緣再考慮做空（Alina）。
      - 小上升趨勢線守住就不用怕；破了但轉成橫盤震盪，也不必太擔心（Shawnnnn）。
    figures:
      - src: /img/1559832959346016266-image.jpg
        caption: 上升通道的上下緣：小台 30 分K 兩條平行的藍線，下緣就是 Alina 防守的上升趨勢線，價格回測到下緣附近（交界位 48862）她加入多單；上緣剛好碰到今日壓力 49212，是她打算再來空的地方。
        from: "1559825442783895614"
cautions:
  - 反彈到下降趨勢線時壓力還是很大，多軍再快樂也要小心；沒有突破、回踩站穩之前，都當反彈看。
  - 走成下降階梯時，碰到支撐彈一下只是短多，彈完通常還會再往下，不要急著當成轉多。
